# Ported from Goobstation for ClawCommand.
#
# Fork note: the Action prototype on this fork has no "icon:" field (the icon goes on a Sprite
# component instead), so each action entity below carries its icon via a Sprite component rather
# than Action.icon.

- type: entity
  id: ActionSlasherSummonMachete
  name: Summon Machete
  description: Summon your bound machete to your active hand, or create one if lost.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 20
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _GoobStation/Actions/slashericons.rsi
    state: SummonMachete
  - type: InstantAction
    event: !type:SlasherSummonMacheteEvent

- type: entity
  id: ActionSlasherSummonMeatSpike
  name: Meat Spike
  description: Conjure a horrific meat spike beneath you to capture your victims.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 15
    checkCanInteract: false
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _GoobStation/Actions/slashericons.rsi
    state: Meatspike
  - type: InstantAction
    event: !type:SlasherSummonMeatSpikeEvent

- type: entity
  id: ActionSlasherIncorporealize
  name: Incorporealize
  description: Become incorporeal, capable of moving through walls and being completely invisible, but unable to interact with the world. Can only be used when unseen.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 1
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _GoobStation/Actions/slashericons.rsi
    state: Incorporealize
  - type: InstantAction
    event: !type:SlasherIncorporealizeEvent

- type: entity
  id: ActionSlasherCorporealize
  name: Corporealize
  description: Manifest your being from your incorporeal state. Can only be used when incorporeal.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 1
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _GoobStation/Actions/slashericons.rsi
    state: Corporealize
  - type: InstantAction
    event: !type:SlasherCorporealizeEvent

- type: entity
  id: ActionSlasherPossession
  name: Possession
  description: Use this on a person to begin to exact your control on them, giving you temporary control of their body for 45 seconds. Once time is up, both bodies return.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 180
    checkCanInteract: false
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _GoobStation/Actions/slashericons.rsi
    state: Possession
  - type: TargetAction
    range: 3.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:SlasherPossessionEvent

- type: entity
  id: ActionSlasherRegenerate
  name: Regenerate
  description: Quickly regenerate your being, restoring all lost health, repairing wounds, and removing all stuns. Must be recharged by stealing a soul after every use.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 75
    checkCanInteract: false
    checkConsciousness: false
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _GoobStation/Actions/slashericons.rsi
    state: Regenerate
  - type: InstantAction
    event: !type:SlasherRegenerateEvent

- type: entity
  id: ActionSlasherStaggerArea
  name: Stagger Area
  description: You exert your dark aura to people in range, slowing them down for a short time.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 20
    checkCanInteract: false
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _GoobStation/Actions/slashericons.rsi
    state: StaggerArea
  - type: InstantAction
    event: !type:SlasherStaggerAreaEvent

- type: entity
  id: ActionSlasherMassacre
  name: Massacre
  description: Unleash a brutal chain of attacks. The more hits in a row you land, the more damage you deal. A devastating finishing blow follows the 13th consecutive hit.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 20
    checkCanInteract: false
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _GoobStation/Actions/slashericons.rsi
    state: SummonMachete
  - type: InstantAction
    event: !type:SlasherMassacreEvent

- type: entity
  id: ActionSlasherSoulSteal
  name: Soul Steal
  description: Siphon a victim's soul. Must be used on an incapacitated living target (or dead body) to steal their soul, empowering your machete and increasing your health.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 2
    checkCanInteract: false
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _GoobStation/Actions/slashericons.rsi
    state: SoulSteal
  - type: TargetAction
    range: 2.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:SlasherSoulStealEvent

- type: entity
  id: ActionSlasherNightVision
  name: Enhanced Vision
  description: You see through the darkness.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 1
    checkCanInteract: false
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _GoobStation/Actions/slashericons.rsi
    state: SlasherVision
  - type: InstantAction
    event: !type:ToggleNightVisionEvent

- type: entity
  id: ActionSlasherRelentlessGrab
  name: Relentless Grab
  description: Your next melee attack will grab your target.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 15
    checkCanInteract: false
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _GoobStation/Actions/slashericons.rsi
    state: RelentlessGrab
  - type: InstantAction
    event: !type:SlasherRelentlessGrabEvent
