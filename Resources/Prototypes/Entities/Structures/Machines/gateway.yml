# Claw Command - BaseGateway restored. Upstream folded BaseGateway into Gateway and turned it into a
# station teleporter (StationTeleporter autoLinkKey: Nanotrasen + a permanent Portal). The fork's
# Lavaland gateways still run on the old GatewayComponent/GatewaySystem (UI-driven, Portal added and
# removed on open/close), so they must not inherit either of those or they would show up as
# destinations in every station teleporter console. Shared frame/sprite/physics live here; the
# upstream station-teleporter behaviour lives on Gateway below.
- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseGateway
  name: gateway
  description: A mysterious gateway built by unknown hands, it allows for faster than light travel to far-flung locations.
  components:
  - type: Sprite
    sprite: Structures/Machines/gateway.rsi
    noRot: true
    layers:
    - state: frame
    - state: on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
    - state: portal
      shader: unshaded
      map: ["portal"]
      visible: false
  # GatewaySystem sets GatewayVisuals.Active on BOTH ends on open and close. LinkedEntityVisuals is
  # not usable for these: GatewaySystem links one-way, so only the source gets HasAnyLinks and the
  # unlink on close never clears it.
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.GatewayVisuals.Active:
        portal:
          True: { visible: true }
          False: { visible: false }
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      portalFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        hard: false
  - type: Appearance

- type: entity
  parent: BaseGateway # Claw Command - was the root prototype upstream
  id: Gateway
  components:
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.LinkedEntityVisuals.HasAnyLinks:
        portal:
          True: { visible: true }
          False: { visible: false }
  - type: StationTeleporter
    portalLayerMap: "portal"
    autoLinkKey: Nanotrasen
  - type: Portal
    randomTeleport: false
    canTeleportToOtherMaps: true
  - type: PointLight
    enabled: true
    radius: 3
    energy: 1
  - type: AmbientSound
    enabled: true
    sound:
      path: /Audio/Ambience/ambi_gateway.ogg
    range: 5
    volume: 8
