# for important antag roles (nukie reinforcements, ninja, etc.)
- type: ghostRoleRaffleSettings
  id: default
  settings:
    initialDuration: 45
    joinExtendsDurationBy: 2
    maxDuration: 45

# for roles that don't matter too much or are available plentifully (e.g. space carp)
- type: ghostRoleRaffleSettings
  id: short
  settings:
    initialDuration: 15
    joinExtendsDurationBy: 0
    maxDuration: 15

# Claw Command - advanced xenomorph larvae: plentiful and time-sensitive, so don't sit in the raffle long
- type: ghostRoleRaffleSettings
  id: advXenoShort
  settings:
    initialDuration: 5
    joinExtendsDurationBy: 0
    maxDuration: 5
