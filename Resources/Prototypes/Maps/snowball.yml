            AtmosphericTechnician: [ 1, 2 ]
            StationEngineer: [ 1, 5 ]
            SeniorEngineer: [ 0, 1 ] # Claw Command - senior variant
            TechnicalAssistant: [ 0, 3 ] #intern, not counted
            #medical (6 - 8)
