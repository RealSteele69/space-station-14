            Bartender: [ 0, 2 ]
            Botanist: [ 0, 2 ]
            Chef: [ 0, 3 ]
            Janitor: [ 0, 2 ]
            Chaplain: [ 0, 1 ]
            Librarian: [ 0, 1 ]
            ServiceWorker: [ 0, 2 ]
