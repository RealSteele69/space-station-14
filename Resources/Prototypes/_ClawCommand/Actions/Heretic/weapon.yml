- type: entity
  parent: BaseAction
  id: ActionRunebreak
  name: Rune Break
  description: Destroys all runes carved by this blade.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _ClawCommand/Heretic/abilities_heretic.rsi
    layers:
    - state: rune_break
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:DeleteAllCarvingsEvent
