# Claw Command - Rodentia abilities.

# Cheek pouches (MouthStorage). Uses the storage-implant event, which the pouch's Storage handles.
- type: entity
  parent: BaseAction
  id: ActionOpenMouthStorage
  name: Open cheek storage
  description: Allows you to store items in your cheeks.
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -10
    useDelay: 1
  - type: Sprite
    layers:
    - texture: DeltaV/Interface/Actions/mouthStorageOpen.png
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:OpenStorageImplantEvent

# Sneak under tables (CrawlUnderObjects).
- type: entity
  parent: BaseAction
  id: ActionToggleSneakMode
  name: Toggle sneak mode
  description: Sneak underneath tables.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 3
  - type: Sprite
    sprite: Structures/Furniture/Tables/generic.rsi
    layers:
    - state: full
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ToggleCrawlingStateEvent

# Call nearby mice (MobCallSource).
- type: entity
  parent: BaseAction
  id: ActionMouseCall
  name: Mousecall
  description: Call nearby mice to your location.
  components:
  - type: Action
    useDelay: 15
  - type: Sprite
    sprite: _ClawCommand/Interface/Actions/call.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:MobCallActionEvent
