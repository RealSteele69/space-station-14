- type: entity
  parent: BaseToggleAction
  id: ActionToggleFoxForm
  name: Fox Form
  description: Transform in or out of your fox form.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 10 # emote spam
    checkCanInteract: false
  - type: Sprite
    sprite: _ClawCommand/Mobs/Species/Kitsune/transform.rsi
    layers:
    - state: foxform
      map: ["enum.ActionVisuals.Icon"]
    - state: humanform
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:KitsuneFoxFormActionEvent

# Egg-laying trait. Upstream's ActionAnimalLayEgg now raises EntityProductionActionEvent for its own
# production system, so the trait gets an action that still raises the event EggLayerTraitSystem handles.
- type: entity
  parent: BaseAction
  id: ActionTraitLayEgg
  name: Lay egg
  description: Uses hunger to lay an egg.
  components:
  - type: Action
    useDelay: 60
  - type: Sprite
    sprite: Objects/Consumable/Food/egg.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:EggLayInstantActionEvent
