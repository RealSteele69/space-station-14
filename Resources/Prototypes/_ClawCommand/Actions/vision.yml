# Toggle action entity prototypes for NightVision / ThermalVision goggles.

- type: entity
  parent: BaseAction
  id: ToggleNightVision
  name: Toggle Night Vision
  description: Toggle the night-vision overlay on your goggles.
  components:
  - type: Action
    useDelay: 0.5
  - type: Sprite
    sprite: _ClawCommand/Clothing/Eyes/Goggles/nightvision.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ToggleNightVisionEvent

- type: entity
  parent: BaseAction
  id: ToggleThermalVision
  name: Toggle Thermal Vision
  description: Toggle the thermal-vision overlay on your goggles.
  components:
  - type: Action
    useDelay: 0.5
  - type: Sprite
    sprite: Clothing/Eyes/Glasses/thermal.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ToggleThermalVisionEvent
