  - type: AdvXenoBiomorph
    special: Charge
    specialMinRange: 1
    specialMaxRange: 12
    specialCooldown: 10
    warmup: 2
    chargeObjectDamage: 60
    chargeState: breaker_charging
    aliveState: breaker_run
    heavyClaws: true
