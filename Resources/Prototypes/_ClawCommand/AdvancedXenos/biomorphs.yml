# Claw Command - NPC xenomorphs ("biomorphs"). Sprites and sounds are the CM-SS13 PvE set (by Athena148).
# These are AI mobs for the infestation event, not ghost roles.
# Health is the original maxHealth, damage its melee damage, attack rate 1 / base_attack_cooldown, speed scaled x0.9.
# Armour (armor_legacy_mob) becomes a damage modifier set: melee -> Blunt/Slash, bullet -> Piercing, laser -> Heat.

- type: entity
  abstract: true
  parent: [ SimpleSpaceMobBase, BaseMobDestructible ]
  id: MobAdvXenoBiomorphBase
  name: xenomorph
  description: Something from the dark between the stars, all chitin and teeth.
  components:
  - type: AdvXenoBiomorph
    deathSound:
      path: /Audio/_ClawCommand/AdvancedXenos/Biomorphs/xenomorph_death_hiss.ogg
  - type: NpcFactionMember
    factions:
    - Xeno
  - type: HTN
    rootTask:
      task: XenoCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: CombatMode
  - type: Puller
    needsHands: false # drags with jaws and claws; xenos have no hands
  - type: NoSlip
  - type: Insulated
  - type: Sprite
    drawdepth: Mobs
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: AdvXenoBlood
        Quantity: 300
  - type: TemperatureDamage
    heatDamageThreshold: 360
    coldDamageThreshold: -150
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    damage:
      types:
        Slash: 20
  - type: Butcherable
    spawned:
    - id: FoodMeatXeno
      amount: 5
  - type: TypingIndicator
    proto: alien
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - FootstepSound
  - type: Speech
    speechVerb: AdvXeno
  - type: SlowOnDamage
    speedModifierThresholds:
      9999: 1

- type: entity
  abstract: true
  parent: MobAdvXenoBiomorphBase
  id: MobAdvXenoBiomorphRangedBase
  components:
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.9
  - type: BasicEntityAmmoProvider
    proto: AdvXenoSpitAcidNpc
    capacity: 1
    count: 1
  - type: Gun
    fireRate: 1.1
    useKey: false
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/Effects/Fluids/splat.ogg

# ----------------------------------------------------------------------------- warrior

- type: entity
  parent: MobAdvXenoBiomorphBase
  id: MobAdvXenoBiomorphWarrior
  name: xenomorph warrior
  description: A tall beast, dotted with reinforced chitin plates and a pair of razor sharp claws. It looks pretty pissed off.
  components:
  - type: Sprite
    sprite: _ClawCommand/Mobs/AdvancedXenos/biomorph_warrior.rsi
    scale: 1.1, 1.1
    offset: 0, 0.28
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: warrior_animations-moving
  - type: DamageStateVisuals
    states:
      Alive:
        Base: warrior_animations-moving
      Dead:
        Base: warrior_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      450: Dead
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcClaw
    attackRate: 1.1
    soundHit:
      path: /Audio/_ClawCommand/AdvancedXenos/Biomorphs/warrior_attack.ogg
    damage:
      types:
        Slash: 30
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.7
    baseSprintSpeed: 2.7
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/_ClawCommand/AdvancedXenos/Biomorphs/warrior_move.ogg

