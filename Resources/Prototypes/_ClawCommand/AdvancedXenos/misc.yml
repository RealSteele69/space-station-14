# Claw Command - supporting prototypes for the advanced xenomorphs.

# ----------------------------------------------------------------------------- alerts (originally shown in the stat panel)

- type: alert
  id: AdvXenoPlasma
  icons:
  - sprite: /Textures/_ClawCommand/Interface/AdvancedXenos/alerts.rsi
    state: plasma
  alertViewEntity: AlertAdvXenoPlasmaSpriteView
  name: alerts-adv-xeno-plasma-name
  description: alerts-adv-xeno-plasma-desc

- type: entity
  id: AlertAdvXenoPlasmaSpriteView
  categories: [ HideSpawnMenu ]
  components:
  - type: GenericCounterAlert
    centerGlyph: false
    hideLeadingZeroes: false
  - type: Sprite
    sprite: /Textures/_ClawCommand/Interface/AdvancedXenos/alerts.rsi
    layers:
    - map: [ "enum.AlertVisualLayers.Base" ]
    - map: [ "1" ]
      sprite: /Textures/Interface/Alerts/essence_counter.rsi
      offset: 0.25, -0.3
    - map: [ "10" ]
      sprite: /Textures/Interface/Alerts/essence_counter.rsi
      offset: 0.125, -0.3
    - map: [ "100" ]
      sprite: /Textures/Interface/Alerts/essence_counter.rsi
      offset: 0, -0.3

- type: alert
  id: AdvXenoGrowth
  icons:
  - sprite: /Textures/_ClawCommand/Interface/AdvancedXenos/alerts.rsi
    state: larva
  alertViewEntity: AlertAdvXenoGrowthSpriteView
  name: alerts-adv-xeno-growth-name
  description: alerts-adv-xeno-growth-desc

- type: entity
  parent: AlertAdvXenoPlasmaSpriteView
  id: AlertAdvXenoGrowthSpriteView
  categories: [ HideSpawnMenu ]

