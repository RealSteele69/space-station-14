# Cult constructs and shades. Player-controlled spirits bound into shells; built like the guardian, not a simple mob.

- type: entity
  abstract: true
  id: ConstructBase
  save: false
  components:
  - type: LagCompensation
  - type: Input
    context: "human"
  - type: MobMover
  - type: InputMover
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
  - type: Sprite
    drawdepth: Mobs
    sprite: _ClawCommand/BloodCult/mobs.rsi
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 300
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: Damageable
    damageModifierSet: ManifestedSpirit
  - type: Injurable
    damageContainer: ManifestedSpirit
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Dead
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: CombatMode
  - type: Internals
  - type: Examiner
  - type: Speech
    speechVerb: Ghost
  - type: Emoting
  - type: TypingIndicator
    proto: guardian
  - type: Puller
    needsHands: false
  - type: Hands
    startingHands:
      hand_right:
        location: Right
      hand_left:
        location: Left
  - type: ComplexInteraction
  - type: Visibility
  - type: ContentEye
  - type: Eye
  - type: Actions
  - type: IsDeadIC
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - Inorganic
  - type: ShowHealthIcons
    damageContainers:
    - Biological
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
  - type: Appearance
  - type: StatusIcon
  - type: NpcFactionMember
    factions:
    - GeometerOfBlood
  - type: BloodCultConstruct
  # The cult's mind (:g).
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - BloodCult
  - type: ActiveRadio
    channels:
    - BloodCult
  - type: Grammar
    attributes:
      gender: epicene

- type: entity
  parent: ConstructBase
  id: ConstructJuggernaut
  name: juggernaut
  description: A massive, armored construct built to spearhead attacks and soak up enemy fire.
  components:
  - type: Sprite
    layers:
    - state: juggernaut
      map: [ "enum.ConstructVisualsState.Sprite" ]
    - state: glow_juggernaut_cult
      map: [ "enum.ConstructVisualsState.Glow" ]
      shader: unshaded
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: BloodCultConstruct
    actions:
    - ActionForceWallCult
    - ActionGauntletEcho
  - type: MeleeWeapon
    hidden: true
    angle: 30
    animation: WeaponArcSmash
    attackRate: 1
    damage:
      types:
        Structural: 90
        Blunt: 25
    soundHit:
      collection: MetalThud
  - type: GenericVisualizer
    visuals:
      enum.ConstructVisualsState.Transforming:
        enum.ConstructVisualsState.Sprite:
          True: { state: make_juggernaut_cult }
          False: { state: juggernaut }
        enum.ConstructVisualsState.Glow:
          True: { visible: false }
          False: { visible: true }

- type: entity
  parent: ConstructBase
  id: ConstructArtificer
  name: artificer
  description: A bulbous construct dedicated to building and maintaining the Cult of Nar'Sie's armies.
  components:
  - type: Sprite
    layers:
    - state: artificer
      map: [ "enum.ConstructVisualsState.Sprite" ]
    - state: glow_artificer_cult
      map: [ "enum.ConstructVisualsState.Glow" ]
      shader: unshaded
  - type: BloodCultConstruct
    actions:
    - ActionSummonCultFloor
    - ActionLesserConstruction
    - ActionSummonCultDoor
    - ActionSummonSoulStone
  - type: MovementIgnoreGravity
  - type: MeleeWeapon
    hidden: true
    angle: 30
    animation: WeaponArcPunch
    attackRate: 1
    damage:
      types:
        Blunt: 5
        Structural: 60
  - type: GenericVisualizer
    visuals:
      enum.ConstructVisualsState.Transforming:
        enum.ConstructVisualsState.Sprite:
          True: { state: make_artificer_cult }
          False: { state: artificer }
        enum.ConstructVisualsState.Glow:
          True: { visible: false }
          False: { visible: true }
  - type: Pullable

- type: entity
  parent: ConstructBase
  id: ConstructWraith
  name: wraith
  description: A wicked, clawed shell built to assassinate enemies and sow chaos behind enemy lines.
  components:
  - type: Sprite
    layers:
    - state: wraith
      map: [ "enum.ConstructVisualsState.Sprite" ]
    - state: glow_wraith_cult
      map: [ "enum.ConstructVisualsState.Glow" ]
      shader: unshaded
  - type: MobThresholds
    thresholds:
      0: Alive
      65: Dead
  - type: BloodCultConstruct
    actions:
    - ActionPhaseShift
  - type: MovementIgnoreGravity
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: MeleeWeapon
    hidden: true
    angle: 30
    animation: WeaponArcSmash
    attackRate: 1
    damage:
      types:
        Structural: 40
        Slash: 20
  - type: GenericVisualizer
    visuals:
      enum.ConstructVisualsState.Transforming:
        enum.ConstructVisualsState.Sprite:
          True: { state: make_wraith_cult }
          False: { state: wraith }
        enum.ConstructVisualsState.Glow:
          True: { visible: false }
          False: { visible: true }
  - type: Pullable

# What every cultist becomes when Nar'Sie rises.
- type: entity
  parent: ConstructBase
  id: ConstructHarvester
  name: harvester
  description: A long, thin construct built to herald Nar'Sie's rise. It'll be all over soon.
  components:
  - type: Sprite
    layers:
    - state: harvester
      map: [ "enum.ConstructVisualsState.Sprite" ]
    - state: glow_harvester_cult
      map: [ "enum.ConstructVisualsState.Glow" ]
      shader: unshaded
  - type: MobThresholds
    thresholds:
      0: Alive
      65: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 5
  - type: MovementIgnoreGravity
  - type: MeleeWeapon
    hidden: true
    angle: 30
    animation: WeaponArcSmash
    attackRate: 1
    damage:
      types:
        Structural: 40
        Slash: 50

- type: entity
  parent: ConstructBase
  id: ShadeCult
  name: shade
  description: A bound spirit.
  components:
  - type: Sprite
    layers:
    - state: shade_cult
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead
  - type: MeleeWeapon
    hidden: true
    angle: 30
    animation: WeaponArcSmash
    attackRate: 1
    damage:
      types:
        Blunt: 10
  - type: MovementSpeedModifier
    baseWalkSpeed: 5.5
    baseSprintSpeed: 5.5
  - type: MovementIgnoreGravity

# --- Purified constructs (blessed soul shards) ---------------------------------
# These serve the crew: no cult faction, no cult mind, and the cult's icons don't show for them.

- type: entity
  parent: ConstructJuggernaut
  id: ConstructJuggernautHoly
  name: purified juggernaut
  description: A massive, armored construct, freed from Nar'Sie's grasp.
  components:
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: IntrinsicRadioTransmitter
    channels: []
  - type: ActiveRadio
    channels: []
  - type: BloodCultConstruct
    holy: true
    actions:
    - ActionForceWallCult
    - ActionGauntletEcho
  - type: Sprite
    layers:
    - state: juggernaut
      map: [ "enum.ConstructVisualsState.Sprite" ]
    - state: glow_juggernaut_holy
      map: [ "enum.ConstructVisualsState.Glow" ]
      shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.ConstructVisualsState.Transforming:
        enum.ConstructVisualsState.Sprite:
          True: { state: make_juggernaut_holy }
          False: { state: juggernaut }
        enum.ConstructVisualsState.Glow:
          True: { visible: false }
          False: { visible: true }

