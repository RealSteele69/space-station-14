# Blood Cult weapons, gear and relics.

# --- Weapons ----------------------------------------------------------------

# The cult's ritual dagger. Separate from the plain RitualDagger found in ruins, which stays a mundane knife.
- type: entity
  parent: RitualDagger
  id: RitualDaggerCult
  name: ritual dagger
  description: A strange dagger used by sinister groups for rituals and sacrifices. It hums with a faint, wet whisper.
  components:
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Piercing: 15
  - type: EmbeddableProjectile
  - type: ThrowingAngle
    angle: 225
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 15
  - type: BloodCultItem
  - type: RuneDrawer
  - type: ActivatableUI
    key: enum.BloodCultUiKey.RuneDrawer
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.BloodCultUiKey.RuneDrawer:
        type: BloodCultRadialBoundUserInterface

- type: entity
  parent: BaseItem
  id: EldritchLongsword
  name: eldritch longsword
  description: A sword humming with unholy energy. It glows with a dim red light.
  components:
  - type: Tool
    qualities:
    - Slicing
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Items/Weapons/cult_blade.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.3333
    range: 1.65
    damage:
      types:
        Slash: 24
    maxTargets: 3
    angle: 90
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 18
  - type: EmbeddableProjectile
  - type: ThrowingAngle
    angle: 225
  - type: Item
    size: Normal
    sprite: _ClawCommand/BloodCult/Entities/Items/Weapons/cult_blade.rsi
  - type: Clothing
    sprite: _ClawCommand/BloodCult/Entities/Items/Weapons/cult_blade.rsi
    slots:
    - back
  - type: DisarmMalus
  - type: BloodCultItem
  - type: PointLight
    color: Red
    radius: 2
    softness: 1

- type: entity
  parent: BaseItem
  id: BloodSpear
  name: blood halberd
  description: A sickening spear composed entirely of crystallized blood. Thrown into a body, it shatters and pins them.
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Items/Weapons/cult_spear.rsi
    state: icon
  - type: EmbeddableProjectile
    offset: 0.15,0.15
  - type: ThrowingAngle
    angle: 225
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.20,-0.10
          - -0.10,-0.20
          - 0.40,0.30
          - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Tool
    qualities:
    - Slicing
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Piercing: 26
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    range: 2
    attackRate: 1.42
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 40
  - type: Item
    sprite: _ClawCommand/BloodCult/Entities/Items/Weapons/cult_spear.rsi
    storedRotation: 44
    size: Huge
    shape:
    - 0,0,5,0
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 10
  - type: UseDelay
  - type: DisarmMalus
  - type: BloodCultItem
  - type: BloodSpear

- type: entity
  parent: BaseBola
  id: CultBola
  name: nar'sien bola
  description: A strong bola, bound with dark magic that lets it pass harmlessly through Nar'Sien cultists. Throw it to trip and slow your victim.
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Items/bola.rsi
    state: icon
  - type: BloodCultItem
    allowUseToEveryone: true
  - type: BloodCultPassThroughCult
  - type: Ensnaring
    freeTime: 2.0
    breakoutTime: 3.5
    walkSpeed: 0.7
    sprintSpeed: 0.7
    staminaDamage: 55
    canThrowTrigger: true
    canMoveBreakout: true

- type: entity
  parent: BaseItem
  id: MirrorShieldCult
  name: mirror shield
  description: An infamous shield used by Nar'Sien sects to confuse and disorient their enemies. Its edges are weighted for use as a throwing weapon, knocking down whoever it strikes.
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Items/mirror_shield.rsi
    state: icon
  - type: Item
    size: Ginormous
    sprite: _ClawCommand/BloodCult/Entities/Items/mirror_shield.rsi
    heldPrefix: mirror
  - type: BloodCultItem
  - type: BloodCultPassThroughCult
  - type: StunOnCollide
    knockdownAmount: 3
  - type: Reflect
    reflectProb: 0.75
    reflects:
    - Energy
  - type: Blocking
    passiveBlockModifier:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8
    activeBlockModifier:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8
      flatReductions:
        Blunt: 1
        Slash: 1
        Piercing: 1
        Heat: 1
    blockSound: !type:SoundPathSpecifier
      path: /Audio/Effects/glass_step.ogg
  - type: Damageable
  - type: Injurable
    damageContainer: Shield
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak

# --- Relics -----------------------------------------------------------------

- type: entity
  parent: BaseItem
  id: ShuttleCurse
  name: cursed orb
  description: You peer within this smoky orb and glimpse terrible fates befalling the emergency escape shuttle. Shatter it in hand to delay the shuttle.
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Items/shuttle_curse.rsi
    state: icon
  - type: BloodCultItem
  - type: ShuttleCurse

- type: entity
  parent: BaseItem
  id: WhetstoneCult
  name: eldritch whetstone
  description: A block, empowered by dark magic. Sharp weapons will be enhanced when used on the stone.
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Items/whetstone_cult.rsi
    layers:
    - state: icon
      map: [ "enum.GenericCultVisuals.Layer" ]
  - type: BloodCultItem
  - type: Whetstone # Only blades with slashing damage take an edge.
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.GenericCultVisuals.State:
        enum.GenericCultVisuals.Layer:
          True: { state: icon }
          False: { state: icon_off }

- type: entity
  parent: BaseItem
  id: VeilShifter
  name: veil shifter
  description: This relic instantly teleports you, and anything you're pulling, forward by a moderate distance.
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Items/veil_shifter.rsi
    layers:
    - state: icon
      map: [ "enum.GenericCultVisuals.Layer" ]
  - type: BloodCultItem
  - type: VeilShifter
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.GenericCultVisuals.State:
        enum.GenericCultVisuals.Layer:
          True: { state: icon }
          False: { state: icon_off }

- type: entity
  parent: BaseItem
  id: VoidTorch
  name: void torch
  description: Used by veteran cultists to instantly send items to their brethren. Touch an item with it to pick the recipient.
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Items/void_torch.rsi
    layers:
    - state: icon
      map: [ "enum.GenericCultVisuals.Layer" ]
  - type: Item
    sprite: _ClawCommand/BloodCult/Entities/Items/void_torch.rsi
    heldPrefix: lit
  - type: BloodCultItem
  - type: VoidTorch
  - type: VoidTorchVisuals
  - type: PointLight
    enabled: true
    color: "#e33119"
    radius: 1.0
    energy: 5.0
    netsync: false
  - type: LightBehaviour
    behaviours:
    - !type:RandomizeBehaviour # immediately make it bright and flickery
      id: turn_on
      interpolate: Nearest
      minDuration: 0.02
      maxDuration: 0.06
      startValue: 6.0
      endValue: 9.0
      property: Energy
      isLooped: true
    - !type:FadeBehaviour # have the radius start small and get larger as it starts to burn
      id: turn_on
      maxDuration: 8.0
      startValue: 1.0
      endValue: 6.0
    - !type:RandomizeBehaviour # weaker flicker as it fades out
      id: fade_out
      interpolate: Nearest
      minDuration: 0.02
      maxDuration: 0.06
      startValue: 4.0
      endValue: 8.0
      property: Energy
      isLooped: true
    - !type:FadeBehaviour # fade out radius as it burns out
      id: fade_out
      maxDuration: 4.0
      startValue: 6.0
      endValue: 1.0
  - type: UserInterface
    interfaces:
      enum.BloodCultUiKey.VoidTorch:
        type: BloodCultListBoundUserInterface
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.GenericCultVisuals.State:
        enum.GenericCultVisuals.Layer:
          True: { state: icon }
          False: { state: icon_off }

- type: entity
  parent: BaseItem
  id: ShadowShackles
  name: shadow shackles
  description: Shackles that bind the wrists with sinister magic.
  components:
  - type: Item
    size: Small
    storedRotation: 90
  - type: Handcuff
    breakoutTime: 5
    breakOnRemove: true
    cuffedRSI: Objects/Misc/cablecuffs.rsi
    bodyIconState: body-overlay
    color: black
  - type: Sprite
    sprite: _ClawCommand/BloodCult/actions.rsi
    state: cuff
  - type: UseDelay
    delay: 6

# --- Clothing ---------------------------------------------------------------

- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterCultArmor
  name: true nar'sien hardened armor
  description: A heavily armored exosuit worn by warriors of the Nar'Sien cult. It can withstand hard vacuum.
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Clothes/Outer/cult_armor.rsi
  - type: Clothing
    sprite: _ClawCommand/BloodCult/Entities/Clothes/Outer/cult_armor.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.7
        Caustic: 0.2
        Radiation: 0.2
  - type: ExplosionResistance
    damageCoefficient: 0.75
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetCultArmor
  - type: BloodCultItem

- type: entity
  parent: ClothingHeadHardsuitBase
  id: ClothingHeadHelmetCultArmor
  categories: [ HideSpawnMenu ]
  name: true nar'sien hardened helmet
  description: A heavily armored helmet worn by warriors of the Nar'Sien cult. It can withstand hard vacuum.
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Clothes/Helmet/cult_helmet.rsi
  - type: Clothing
    sprite: _ClawCommand/BloodCult/Entities/Clothes/Helmet/cult_helmet.rsi
    equipSound: /Audio/Effects/rustle1.ogg
    unequipSound: /Audio/Effects/rustle2.ogg
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: BloodCultItem

- type: entity
  parent: ClothingOuterRobesCult
  id: ClothingOuterRobesCultTrue
  name: flagellant's robe
  description: Blood-soaked robes infused with dark magic. They let the wearer move at inhuman speed, at the cost of taking far more damage.
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Clothes/Outer/cult_robe.rsi
  - type: Clothing
    sprite: _ClawCommand/BloodCult/Entities/Clothes/Outer/cult_robe.rsi
  - type: BloodCultItem
  - type: ClothingSpeedModifier
    walkModifier: 1.25
    sprintModifier: 1.25
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 1.4
        Slash: 1.4
        Piercing: 1.4
        Heat: 1.4
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodCultHoodTrue
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot { }

- type: entity
  parent: ClothingHeadHatHoodCulthood
  id: ClothingHeadHatHoodCultHoodTrue
  name: flagellant's hood
  description: A blood-soaked hood infused with dark magic.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Clothes/Helmet/cult_hood.rsi
  - type: Clothing
    sprite: _ClawCommand/BloodCult/Entities/Clothes/Helmet/cult_hood.rsi
    equipSound: /Audio/Effects/rustle1.ogg
    unequipSound: /Audio/Effects/rustle2.ogg
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 1.4
        Slash: 1.4
        Piercing: 1.4
        Heat: 1.4
  - type: BloodCultItem

- type: entity
  parent: ClothingEyesBase
  id: ClothingEyeCultBlindfold
  name: zealot's blindfold
  description: May Nar'Sie guide you through the darkness and shield you from the light.
  components:
  - type: Sprite
    sprite: Clothing/Eyes/Misc/blindfold.rsi
    state: icon
  - type: Clothing
    sprite: Clothing/Eyes/Misc/blindfold.rsi
  - type: FlashImmunity
  - type: EyeProtection
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - Inorganic
  - type: ShowHealthIcons
    damageContainers:
    - Biological
  - type: BloodCultItem

# --- Hand auras -------------------------------------------------------------

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseBloodCultAura
  name: blood aura
  description: A sinister looking aura that distorts the flow of reality around it.
  categories: [ HideSpawnMenu ]
  components:
  - type: Item
    size: Ginormous
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0
    maxTargets: 1
    animation: WeaponArcSlash
    angle: 1
  - type: Unremoveable
    deleteOnDrop: true
  - type: BloodCultItem

- type: entity
  parent: BaseBloodCultAura
  id: BloodRitesAura
  name: blood rite aura
  description: Absorbs blood from anything you touch. Touching cultists and constructs heals them. Use it in hand to cast an advanced rite.
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Items/rites.rsi
    state: icon
  - type: Item
    sprite: _ClawCommand/BloodCult/Entities/Items/rites.rsi
  - type: BloodRitesAura
  - type: UserInterface
    interfaces:
      enum.BloodCultUiKey.Rites:
        type: BloodCultRadialBoundUserInterface
  - type: ActivatableUI
    key: enum.BloodCultUiKey.Rites
    inHandsOnly: true
    requireActiveHand: false

- type: entity
  parent: BaseBloodCultAura
  id: StunAura
  name: stunning aura
  description: Will stun and mute a weak-minded victim on hit.
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Items/stun.rsi
    state: icon
  - type: Item
    sprite: _ClawCommand/BloodCult/Entities/Items/stun.rsi
  - type: StunAura
    speech: Fuu ma'jin!

- type: entity
  parent: BaseBloodCultAura
  id: ShadowShacklesAura
  name: shadow shackles aura
  description: Will bind the target with shadow shackles on hit.
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Items/shadow_shackles.rsi
    state: icon
  - type: Item
    sprite: _ClawCommand/BloodCult/Entities/Items/shadow_shackles.rsi
  - type: ShadowShacklesAura
    speech: In'totum Lig'abis!
  - type: ContainerContainer
    containers:
      shackles: !type:Container

# --- Soul shards and shells -------------------------------------------------

- type: entity
  parent: BaseItem
  id: SoulShard
  name: soul shard
  description: A mysterious glowing shard.
  components:
  - type: LagCompensation
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Items/soul_stone.rsi
    layers:
    - state: soul_stone
      map: [ "enum.SoulShardVisualState.Sprite" ]
    - state: soul_stone_glow
      map: [ "enum.SoulShardVisualState.Glow" ]
      shader: unshaded
      visible: false
  - type: MindContainer
  - type: Examiner
    skipChecks: true
  - type: PointLight
    color: Red
    radius: 2
    softness: 1
    enabled: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SoulShardVisualState.HasMind:
        enum.SoulShardVisualState.Glow:
          True: { visible: true }
          False: { visible: false }
      enum.SoulShardVisualState.Blessed:
        enum.SoulShardVisualState.Sprite:
          True: { state: soul_stone_blessed }
          False: { state: soul_stone }
  - type: Speech
  - type: IsDeadIC
  - type: SoulShard
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - BloodCult
  - type: ActiveRadio
    channels:
    - BloodCult

- type: entity
  parent: SoulShard
  id: SoulShardGhost
  suffix: Ghost Role
  components:
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    name: ghost-role-information-soul-shard-name
    description: ghost-role-information-soul-shard-description
    rules: ghost-role-information-soul-shard-rules
    raffle:
      settings: short
  - type: GhostTakeoverAvailable

- type: entity
  parent: SoulShard
  id: SoulShardHoly
  suffix: Blessed
  components:
  - type: SoulShard
    isBlessed: true
  - type: IntrinsicRadioTransmitter
    channels: []
  - type: ActiveRadio
    channels: []

- type: entity
  parent: SoulShardHoly
  id: SoulShardHolyGhost
  suffix: Blessed, Ghost Role
  components:
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    name: ghost-role-information-soul-shard-holy-name
    description: ghost-role-information-soul-shard-holy-description
    rules: ghost-role-information-soul-shard-holy-rules
    raffle:
      settings: short
  - type: GhostTakeoverAvailable

- type: entity
  parent: BaseItem
  id: ConstructShell
  name: construct shell
  description: An empty construct shell. Place a filled soul shard inside to give it life.
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Entities/Items/construct_shell.rsi
    state: icon
  - type: Item
    size: Huge
  - type: ItemSlots
  - type: ConstructShell
    shardSlot:
      name: soul-shard-slot-name
      ejectOnBreak: true
      whitelist:
        components:
        - SoulShard
  - type: UserInterface
    interfaces:
      enum.BloodCultUiKey.Shell:
        type: BloodCultRadialBoundUserInterface
        interactionRange: -1
  - type: ContainerContainer
    containers:
      Shard: !type:ContainerSlot

# --- Runed metal ------------------------------------------------------------

