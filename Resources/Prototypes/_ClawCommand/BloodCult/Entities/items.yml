  stackEntity: RunedMetal1
  name: materials-runed-metal
  icon: { sprite: /Textures/_ClawCommand/BloodCult/Entities/runic_metal.rsi, state: runic }
  color: "#9d2b39"
  price: 0.05

# --- Projectiles and effects ------------------------------------------------

- type: entity
  parent: BaseBullet
  id: BloodBoilProjectile
  name: concentrated blood
  description: Oh no.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Effects/blood_boil.rsi
    state: bullet
  - type: Projectile
    damage:
      types:
        Heat: 10
        Piercing: 10
  - type: PointLight
    enabled: true
    color: "#ff4300"
    radius: 2.0
    energy: 7.0
  - type: BloodBoilProjectile

- type: entity
  parent: BaseBulletTrigger
  id: ProjectileGauntlet
  name: gauntlet
  description: Oh no.
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#FF0000"
    radius: 2.0
    energy: 5.0
  - type: Projectile
    ignoreResistances: true
    damage:
      types:
        Blunt: 50
  - type: Sprite
    sprite: _ClawCommand/BloodCult/Effects/gauntlet_echo.rsi
    layers:
    - state: gauntlet_echo

- type: entity
  id: CultTileSpawnEffect
  name: cult tile effect
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: TimedDespawn
    lifetime: 0.5
  - type: Transform
    noRot: true
    anchored: true
  - type: Sprite
    drawdepth: FloorObjects
    layers:
    - sprite: _ClawCommand/BloodCult/Effects/tiles_spawn.rsi
      state: floorglow
      shader: unshaded
  - type: PointLight
    color: "#FF0000"

- type: entity
  id: CultTeleportInEffect
  name: teleport in
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.8
  - type: Transform
    noRot: true
    anchored: true
  - type: Sprite
    drawdepth: Effects
    layers:
    - sprite: _ClawCommand/BloodCult/Effects/cult_in_out.rsi
      state: cult_in
      shader: unshaded
  - type: PointLight
    color: "#FF0000"

- type: entity
  id: CultTeleportOutEffect
  name: teleport out
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.8
