# _ClawCommand: Avali species.
# Avali are drawn on their own body sheet (_ClawCommand/Mobs/Species/Avali/parts.rsi): human height and
# head size with feathered wing-arms, a beaked head and a long tail, tinted by the skin colour. Because the
# frame matches the human one, normal clothing fits without per-item sprites. What does need adjusting:
#   - eyes sit higher (moth-shaped), so the Inventory uses the moth eyewear variants (speciesId: moth);
#   - masks get a small profile displacement for the beak;
#   - the torso is the same shape for both sexes, so the human female jumpsuit displacement is not used.
# Gameplay: cold-adapted ammonia-blooded pack hunters, fragile to blunt force and heat, weak in melee,
# with preenable feathers (Preenable, see Content.Shared/_ClawCommand/Body/Preening).

- type: markingsGroup
  parent: Undergarments
  id: MarkingsAvali
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop: # crests
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadSide: # ears; the patterned sets include the base ears
      limit: 2
      required: true
      default: [ AvaliEarsBase ]
    enum.HumanoidVisualLayers.LArm:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Tail: # the patterned sets include the base tail
      limit: 2
      required: true
      default: [ AvaliTailBase ]
    enum.HumanoidVisualLayers.UndergarmentTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.UndergarmentBottom:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Genital:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Penis:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Breasts:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceAvali
  categories: [ HideSpawnMenu ]
  suffix: Claw Command
  name: avali appearance
  components:
  - type: Inventory
    speciesId: moth # same eye placement as moths, so moth eyewear variants line up
    displacements:
      # No head displacement: shifting headwear forward over the beak clips large hardsuit helmets.
      mask:
        sizeMaps:
          32:
            sprite: _ClawCommand/Mobs/Species/Avali/displacement.rsi
            state: mask
  - type: InitialBody
    organs:
      Torso: OrganAvaliTorso
      Head: OrganAvaliHead
      ArmLeft: OrganAvaliArmLeft
      ArmRight: OrganAvaliArmRight
      HandRight: OrganAvaliHandRight
      HandLeft: OrganAvaliHandLeft
      LegLeft: OrganAvaliLegLeft
      LegRight: OrganAvaliLegRight
      FootLeft: OrganAvaliFootLeft
      FootRight: OrganAvaliFootRight
      Brain: OrganAvaliBrain
      Eyes: OrganAvaliEyes
      Tongue: OrganAvaliTongue
      Appendix: OrganAvaliAppendix
      Ears: OrganAvaliEars
      Lungs: OrganAvaliLungs
      Heart: OrganAvaliHeart
      Stomach: OrganAvaliStomach
      Liver: OrganAvaliLiver
      Kidneys: OrganAvaliKidneys
  - type: HumanoidProfile
    species: SpeciesAvali

- type: entity
  parent:
  - AppearanceAvali
  - BaseSpeciesMobOrganic
  id: MobAvali
  name: Urist McChirp
  suffix: Claw Command
  components:
  - type: Icon
    sprite: _ClawCommand/Mobs/Species/Avali/parts.rsi
    state: full
  # Voice — Avali speech + emote sound profiles (MaleAvali / FemaleAvali, picked per sex on the species).
  - type: Vocal
    emoteSounds: MaleAvali # Claw Command - was a sex-keyed 'sounds' dict, removed by the WizDen rebase
  - type: Speech
    speechSounds: MaleAvali
    speechVerb: Parrot
    allowedEmotes: [ 'Chirp', 'Trill', 'Warble', 'Purr', 'Growl' ]
  - type: Damageable
    damageModifierSet: ModifierSetAvali
  - type: Fixtures # light, hollow-boned build
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 160
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: AmmoniaBlood
        Quantity: 300 # half the blood of most species
  # Cold-adapted: a cooler resting temperature, low heat capacity (temperature swings faster), suffers from
  # heat early and badly, and is barely slowed by the cold.
  - type: Temperature
    temperature: 296.15
    specificHeat: 1800 # Claw Command - rescaled from 25 for the joule-based heat model
  - type: TemperatureDamage
    coldDamageThreshold: 223
    heatDamageThreshold: 310
    coldDamage:
      types:
        Cold: 0.05
    heatDamage:
      types:
        Heat: 5
  - type: ThermalRegulator
    metabolismHeat: 400
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 296.15
    thermalRegulationTemperatureThreshold: 10
  - type: TemperatureSpeed
    thresholds:
      279: 0.95
      265: 0.9
      240: 0.85
  - type: MovementSpeedModifier
    weightlessAcceleration: 2.5  # pack-hunter zero-g advantage
  - type: MeleeWeapon
    altDisarm: false
    angle: 30
    animation: WeaponArcClaw
    soundHit:
      collection: AlienClaw
    damage: # evens out to about 5 slash after BonusMeleeDamage
      types:
        Slash: 6
  - type: BonusMeleeDamage # significantly weaker in melee
    damageModifierSet:
      coefficients:
        Blunt: 0.65
        Slash: 0.85
  - type: Preenable
    featherPrototype: AvaliFeather
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 2

- type: damageModifierSet
  id: ModifierSetAvali
  coefficients:
    Blunt: 1.3
    Piercing: 1.1
    Slash: 1.1
