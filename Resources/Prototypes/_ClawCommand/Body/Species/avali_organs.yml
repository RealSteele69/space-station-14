# _ClawCommand: Avali organs.
# Body sheet: _ClawCommand/Mobs/Species/Avali/parts.rsi, a dedicated Avali body drawn on the human
# frame (same height and head size), with the wing feathers built into the arm/hand parts. It is
# greyscale and tinted by the skin colour. Ears and tail come from the AvaliEarsBase/AvaliTailBase
# markings (avali_markings.yml); eyes are a moth-shaped state of the same sheet, which is why the
# appearance uses moth eyewear variants.
#
# Metabolizer type: Avali internal organs MUST carry a metabolizer-type allow-listed by the Oxygen
# reagent (Oxygenate effect — Reagents/gases.yml line ~19), or Avali physically can't be oxygenated
# and suffocate even in a breathable atmosphere. Vulpkanin uses `Animal`; we follow the same
# pattern to avoid editing the Oxygen reagent's allow-list.

- type: entity
  parent: OrganBase
  id: OrganAvaliBase
  abstract: true
  suffix: Claw Command, Avali

- type: entity
  id: OrganAvaliMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Animal ]

- type: entity
  parent: OrganAvaliBase
  id: OrganAvaliInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  parent: OrganAvaliBase
  id: OrganAvaliExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _ClawCommand/Mobs/Species/Avali/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _ClawCommand/Mobs/Species/Avali/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: MarkingsAvali

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganAvaliExternal ]
  id: OrganAvaliTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganAvaliExternal ]
  id: OrganAvaliHead
  components:
  - type: VisualOrganMarkings
    hideableLayers: # crests and ears poke through helmets otherwise
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.FacialHair

- type: entity
  parent: [ OrganBaseArmLeft, OrganAvaliExternal ]
  id: OrganAvaliArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganAvaliExternal ]
  id: OrganAvaliArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganAvaliExternal ]
  id: OrganAvaliHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganAvaliExternal ]
  id: OrganAvaliHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganAvaliExternal ]
  id: OrganAvaliLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganAvaliExternal ]
  id: OrganAvaliLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganAvaliExternal ]
  id: OrganAvaliFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganAvaliExternal ]
  id: OrganAvaliFootRight

- type: entity
  parent: [ OrganBaseBrain, OrganAvaliInternal ]
  id: OrganAvaliBrain

- type: entity
  parent: [ OrganBaseEyes, OrganAvaliInternal, OrganAvaliExternal ]
  id: OrganAvaliEyes
  description: They seem as if they're looking at something far away...
  components:
  - type: VisualOrgan
    data:
      sprite: _ClawCommand/Mobs/Species/Avali/parts.rsi
      state: eyes

- type: entity
  parent: [ OrganBaseTongue, OrganAvaliInternal ]
  id: OrganAvaliTongue

- type: entity
  parent: [ OrganBaseAppendix, OrganAvaliInternal ]
  id: OrganAvaliAppendix

- type: entity
  parent: [ OrganBaseEars, OrganAvaliInternal ]
  id: OrganAvaliEars

- type: entity
  parent: [ OrganBaseLungs, OrganAvaliInternal, OrganAvaliMetabolizer ]
  id: OrganAvaliLungs

- type: entity
  parent: [ OrganBaseHeart, OrganAvaliInternal, OrganAvaliMetabolizer ]
  id: OrganAvaliHeart

- type: entity
  parent: [ OrganBaseStomach, OrganAvaliInternal, OrganAvaliMetabolizer ]
  id: OrganAvaliStomach
  components:
  - type: Stomach
    specialDigestible: # fruit and meat (raw is fine), no vegetables
      tags:
      - Fruit
      - Meat
      - Pill
      - TagNutribrick
      - TagIceCream

- type: entity
  parent: [ OrganBaseLiver, OrganAvaliInternal, OrganAvaliMetabolizer ]
  id: OrganAvaliLiver

- type: entity
  parent: [ OrganBaseKidneys, OrganAvaliInternal, OrganAvaliMetabolizer ]
  id: OrganAvaliKidneys
