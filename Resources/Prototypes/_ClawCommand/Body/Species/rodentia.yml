# _ClawCommand: Rodentia species.
# Small, quick, resourceful rodent folk on their own body sheet (DeltaV/Mobs/Species/Rodentia/parts.rsi).
# The sheet is drawn on the human frame, so clothing fits without displacement maps; their small
# stature comes from the height/width sliders instead (see SpeciesRodentia).
# Signature traits: cheek pouches (MouthStorage), sneaking under tables (CrawlUnderObjects), rummaging
# in disposals, calling nearby mice, cheese puns, and setting off mousetraps even in shoes.

- type: markingsGroup
  parent: Undergarments
  id: MarkingsRodentia
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 4 # face patterns and the base-head recolour markings
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 8 # ears, plus whiskers, which draw on this layer
      required: true
      default: [ RodentiaHeadTopEarDefault ]
    enum.HumanoidVisualLayers.HeadSide:
      limit: 8 # cheeks
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 10
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 2
      required: true
      default: [ RodentiaTailDefault ]
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Genital:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Penis:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Breasts:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceRodentia
  categories: [ HideSpawnMenu ]
  suffix: Claw Command
  name: rodentia appearance
  components:
  - type: Inventory
    speciesId: rodentia
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganRodentiaTorso
      Head: OrganRodentiaHead
      ArmLeft: OrganRodentiaArmLeft
      ArmRight: OrganRodentiaArmRight
      HandRight: OrganRodentiaHandRight
      HandLeft: OrganRodentiaHandLeft
      LegLeft: OrganRodentiaLegLeft
      LegRight: OrganRodentiaLegRight
      FootLeft: OrganRodentiaFootLeft
      FootRight: OrganRodentiaFootRight
      Brain: OrganRodentiaBrain
      Eyes: OrganRodentiaEyes
      Tongue: OrganRodentiaTongue
      Appendix: OrganRodentiaAppendix
      Ears: OrganRodentiaEars
      Lungs: OrganRodentiaLungs
      Heart: OrganRodentiaHeart
      Stomach: OrganRodentiaStomach
      Liver: OrganRodentiaLiver
      Kidneys: OrganRodentiaKidneys
  - type: HumanoidProfile
    species: SpeciesRodentia

- type: entity
  parent:
  - AppearanceRodentia
  - BaseSpeciesMobOrganic
  id: MobRodentia
  name: Urist McRat
  suffix: Claw Command
  components:
  - type: Icon
    sprite: DeltaV/Mobs/Species/Rodentia/parts.rsi
    state: full
  - type: Speech
    speechVerb: SpeechRodentia
    speechSounds: Squeak
    allowedEmotes: [ 'Squeak' ]
  - type: TypingIndicator
    proto: rodentia
  - type: Vocal
    emoteSounds: MaleRodentia
  - type: CheeseAccent
  - type: Damageable
    damageModifierSet: ModifierSetRodentia
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Blunt: 2
        Slash: 3
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 140 # light build
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  # Redeclaring Satiation replaces the inherited one wholesale, so Thirst is restated.
  - type: Satiation
    satiations:
      Hunger:
        prototype: RodentiaSatiationHunger
      Thirst:
        prototype: NormalSatiationThirst
  - type: Butcherable
    spawned:
    - id: FoodMeatRat
      amount: 5
  - type: CreamPied
    sprite:
      sprite: DeltaV/Effects/creampie.rsi
      state: creampie_rodentia
  - type: Rummager
  - type: AlwaysTriggerMousetrap
  - type: MouthStorage
    mouthProto: CheekStorage
    openStorageAction: ActionOpenMouthStorage
    spitDamageThreshold: 3
  - type: CrawlUnderObjects
    actionProto: ActionToggleSneakMode
  - type: ActionGrant
    actions:
    - ActionMouseCall
  - type: MobCallSource
    range: 25
    whitelist:
      tags:
      - Mouse

- type: damageModifierSet
  id: ModifierSetRodentia
  coefficients:
    Blunt: 1.15
    Slash: 1.15
    Piercing: 1.15
