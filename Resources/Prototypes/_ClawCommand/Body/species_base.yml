- type: entity
  abstract: true
  parent:
  - MobBloodstream
  - MobAtmosStandard
  - MobFlammable
  - BaseSpeciesMob
  - BaseMobDestructible # Claw Command - upstream split gib/ash thresholds out of MobDamageable; mirror BaseSpeciesMobOrganic.
  - BaseHungerThirstSlowdown # Claw Command - starving/parched slowdown, formerly built into the retired Hunger/Thirst components
  id: BaseSpeciesMobOrganicNoRespirator
  save: false
  components:
  # Claw Command - upstream retired Hunger/Thirst for the Satiation system; mirror BaseSpeciesMobOrganic.
  - type: Satiation
    satiations:
      Hunger:
        prototype: NormalSatiationHunger
      Thirst:
        prototype: NormalSatiationThirst
  - type: SatiationMood # Claw Command - how fed and hydrated you are feeds into mood.
    satiations:
      Hunger:
        thresholds:
          Overfed: HungerOverfed
          Okay: HungerOkay
          Peckish: HungerPeckish
          Starving: HungerStarving
      Thirst:
        thresholds:
          Overhydrated: ThirstOverHydrated
          Okay: ThirstOkay
          Thirsty: ThirstThirsty
          Parched: ThirstParched
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.50
        Heat: 0.1
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      types:
        Heat: -0.07
        Blunt: -0.05
        Piercing: -0.05
        Slash: -0.05
  - type: Fingerprint
  - type: Blindable
  - type: Temperature
  - type: TemperatureDamage
    heatDamageThreshold: 325
    coldDamageThreshold: 260
    coldDamage:
      types:
        Cold: 0.1 #per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 1.5 #per second, scales with temperature & other constants
  - type: TemperatureSpeed
    thresholds:
      293: 0.9
      280: 0.8
      260: 0.7
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
  - type: Perishable
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeat
      amount: 5
  - type: FireVisuals
    alternateState: Standing
  - type: StunVisuals
  - type: UndergarmentRemoval # CC14
  - type: SprinterDust # Claw Command: dust cloud beneath the feet when moving above walking speed
