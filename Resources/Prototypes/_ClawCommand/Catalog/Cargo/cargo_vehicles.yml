# claw command
# Vehicle orders - EVENT MAP ONLY. Deliberately commented out so they never show up in normal rounds.
# To enable for an event: uncomment the products you want (vehicles spawn straight onto the cargo pad;
# keyed vehicles also need their key product ordered), then re-comment once the event is over.
# Vehicles: _ClawCommand/Entities/Objects/Vehicles/{cars,ridden,trailers,rmc_vehicles,rmc_combat_vehicles}.yml

