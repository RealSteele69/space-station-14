- type: entity
  name: magic candle box
  parent: BoxCardboard
  id: BoxCandleInfinite
  description: This box is specifically moulded to only carry magic candles.
  components:
  - type: Sprite
    layers:
      - state: box
      - state: candle
  - type: Storage
    grid:
    - 0,0,5,3
    whitelist:
      tags:
      - MagicCandle
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: CandleInfinite
          amount: 2
        - id: CandleBlueInfinite
          amount: 2
        - id: CandleRedInfinite
          amount: 2
        - id: CandleGreenInfinite
          amount: 2
        - id: CandlePurpleInfinite
          amount: 2

- type: entity
  name: mood lighting box
  parent: BoxLighttube
  id: BoxLighttubeMood
  description: This box is shaped on the inside so that only light tubes and bulbs fit. Contains a selection of colored tubes for setting the mood.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ColoredLightTubeRed
          amount: 4
        - id: ColoredLightTubeFrostyBlue
          amount: 4
        - id: ColoredLightTubeBlackLight
          amount: 4
