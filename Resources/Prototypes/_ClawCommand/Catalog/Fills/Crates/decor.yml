- type: entity
  parent: CrateGenericSteel
  id: CrateDecorCarpet
  name: decorative carpet crate
  description: One stack of carpet in each available color.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: FloorCarpetItemRed
        - id: FloorCarpetItemBlack
        - id: FloorCarpetItemBlue
        - id: FloorCarpetItemGreen
        - id: FloorCarpetItemOrange
        - id: FloorCarpetItemSkyBlue
        - id: FloorCarpetItemPurple
        - id: FloorCarpetItemPink
        - id: FloorCarpetItemCyan
        - id: FloorCarpetItemWhite

- type: entity
  parent: CrateGenericSteel
  id: CrateDecorMoodLighting
  name: mood lighting crate
  description: Two boxes of colored light tubes for setting the mood - red, frosty blue, and black light.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: BoxLighttubeMood
        amount: 2
