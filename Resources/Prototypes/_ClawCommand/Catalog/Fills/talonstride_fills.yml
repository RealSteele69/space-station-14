# Ported from space/ for the TalonStride map.

# ---------------------------------------------------------------- Crates

# source: Entities/Structures/Storage/crates.yml
- type: entity
  parent: CrateGenericSteel
  id: CrateFootlocker
  name: footlocker
  description: A footlocker for someones equipment.
  components:
  - type: Icon
    sprite: Structures/Storage/Crates/footlocker.rsi
  - type: Sprite
    sprite: Structures/Storage/Crates/footlocker.rsi

# source: Catalog/Fills/Crates/npc.yml
- type: entity
  id: CrateNPCPibble
  parent: CrateLivestock
  name: pitbull crate
  description: "Note from the shelter: Lab mix. Looking for a home without cats, birds, or children. Anxious when pet."
  components:
  - type: StorageFill
    contents:
    - id: MobPibble

# source: _Floof/Catalog/Fills/Crates/prizeball.yml
- type: entity
  id: CratePrizeBall
  parent: CrateGenericSteel
  name: prize ball crate
  description: For when you really, really suck at arcade games, like gacha games, or if your station does not have a prize vendor.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:EntSelector
        id: PrizeBall
        amount: !type:ConstantNumberSelector { value: 10 }

# source: _Floof/Entities/Structures/Storage/lewd_crate.yml
- type: entity
  parent: CrateBaseWeldable
  id: CrateLewd
  name: lewd crate
  components:
  - type: Icon
    sprite: Structures/Storage/Crates/generic.rsi
  - type: Sprite
    sprite: Structures/Storage/Crates/generic.rsi
  - type: Reflect
    reflects:
    - Energy
    reflectProb: 0.2
    spread: 90

# source: _Floof/Catalog/Fills/Crates/lewd.yml
- type: entity
  id: CrateLewdToys
  parent: CrateLewd
  name: sex toys crate
  description: Improve your station's mood by introducing some fun "toys"! Careful, work may plummet and the station may become a mess.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: TalonStrideLewdImpactPlay
          rolls: !type:ConstantNumberSelector { value: 4 }
        - !type:NestedSelector
          tableId: TalonStrideLewdKinkClothing
          rolls: !type:ConstantNumberSelector { value: 4 }
        - !type:NestedSelector
          tableId: TalonStrideLewdKinkTools
          rolls: !type:ConstantNumberSelector { value: 5 }
        - id: Brutepack
          prob: 0.5

# Pared-down copies of Floof's LewdImpactPlay / LewdKinkClothing / LewdKinkTools tables,
# keeping only entries that already exist in this fork. Prefixed so a future full Floof
# lewd port can bring the original table ids without colliding.
