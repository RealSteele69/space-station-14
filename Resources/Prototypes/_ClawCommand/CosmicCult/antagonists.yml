- type: antag
  id: CosmicAntagCultist
  name: roles-antag-cosmiccult-name
  antagonist: true
  setPreference: true
  objective: roles-antag-cosmiccult-description
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 15h # same bar as heretic; complex antag, read the guidebook
  guides: [ CosmicCult ]

- type: antag
  id: CosmicAntagColossus
  name: ghost-role-information-colossus-name
  antagonist: true
  objective: ghost-role-colossus-objective

- type: antagSpecifier
  parent: RestrictedAntag
  id: CosmicCultist
  prefRoles:
  - CosmicAntagCultist
  # Appended to RestrictedAntag's command/security/silicon/intern exclusions ([AlwaysPushInheritance]).
  jobBlacklist:
  - Chaplain
  blacklist:
    components:
    - AntagImmune
    - BibleUser
  components:
  - type: CosmicCult
  - type: WeakToHoly
  mindRoles:
  - MindRoleCosmicCult

- type: antagSpecifier
  parent: RestrictedAntag
  id: CosmicColossus
  spawnerPrototype: SpawnPointCosmicColossus
  pickPlayer: false
  mindRoles:
  - MindRoleCosmicColossus
  briefing:
    text: ghost-role-colossus-briefing
    color: CadetBlue
    sound: /Audio/_DV/CosmicCult/antag_cosmic_AI_briefing.ogg
  components:
  - type: CosmicColossus
    timed: true
