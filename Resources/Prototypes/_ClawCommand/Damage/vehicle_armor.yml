# Claw Command - vehicle armour. No flat reductions, so bumps, knocks and small arms still register.
# Each vehicle gets separate brute/fire multipliers.

# Bikes, carts, karts, the ATV, power loaders: light frames, exposed engines.
- type: damageModifierSet
  id: VehicleFrameLight
  coefficients:
    Blunt: 0.9
    Slash: 0.6
    Piercing: 0.8
    Heat: 1.0
    Shock: 1.3
    Structural: 0.6

# Cars, trucks and vans: steel bodywork.
- type: damageModifierSet
  id: VehicleFrameCar
  coefficients:
    Blunt: 0.75
    Slash: 0.5
    Piercing: 0.6
    Heat: 0.9
    Shock: 1.2
    Structural: 0.5

# RMC-14 combat vehicles (values from RMC's VehicleFrameAPC / VehicleFrameTank).

- type: damageModifierSet
  id: ArmoredVehicleAPC
  coefficients:
    Blunt: 0.7
    Slash: 0.8
    Piercing: 0.6
    Structural: 0.7
    Heat: 1

- type: damageModifierSet
  id: ArmoredVehicleTank
  coefficients:
    Blunt: 0.8
    Slash: 0.7
    Piercing: 0.4
    Structural: 0.8
    Heat: 1.5
