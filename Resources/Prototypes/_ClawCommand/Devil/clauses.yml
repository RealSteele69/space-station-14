# Clauses written on a devil contract as "contractee: <id>" or "contractor: <id>".
# The ID is what is searched for on the paper. Spaces on the written portion are removed,
# so keep IDs lowercase and one word.
# Positive weight costs the signer, negative weight benefits them. A contract can only be signed at weight 0 or more.

- type: clause
  id: soulownership
  clauseWeight: 25
  event: !type:DevilContractSoulOwnershipEvent

- type: clause
  id: weakness
  clauseWeight: -35
  damageModifierSet: DevilDealPositive

- type: clause
  id: fearoffire
  clauseWeight: -20
  damageModifierSet: HellSpawn
  addedComponents:
  - type: SpecialHighTempImmunity

- type: clause
  id: brokeness
  clauseWeight: -20
  spawnedItems:
  - ClothingShoesRealJordansAutographed

- type: clause
  id: fearofdeath
  clauseWeight: -25
  addedComponents:
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Critical
      201: Dead

- type: clause
  id: fearoflight
  clauseWeight: -15
  addedComponents:
  - type: FlashImmunity

- type: clause
  id: fearofelectricity
  clauseWeight: -15
  addedComponents:
  - type: Insulated

- type: clause
  id: gluttony
  clauseWeight: -10
  removedComponents:
