- type: clause
  id: chance
  clauseWeight: -20
  event: !type:DevilContractChanceEvent

- type: clause
  id: shadows
  clauseWeight: -25
  addedComponents:
  - type: Stealth
  - type: StealthOnMove

- type: clause
  id: humanity
  clauseWeight: 80
