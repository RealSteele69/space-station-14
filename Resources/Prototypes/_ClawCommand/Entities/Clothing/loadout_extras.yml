# Misc clothing entities ported from Goob for loadout picker options.

# Not parented to ClothingHeadHelmetBasic: that one folds a visor down via a "visor-" equipped prefix,
# and this sprite has no visor-* worn states, so lowering it made the helmet vanish while worn.
- type: entity
  parent: [ClothingHeadHelmetArmoredBase, BaseSecurityContraband]
  id: ClothingHeadHelmetBasicAlt
  name: security helmet
  description: Standard security gear. Protects the head from impacts.
  suffix: Alt
  components:
  - type: Sprite
    sprite: _GoobStation/Clothing/Head/Helmets/security.rsi
    state: icon-visor
  - type: Clothing
    sprite: _GoobStation/Clothing/Head/Helmets/security.rsi
  - type: Tag
    tags:
    - WhitelistChameleon
    - SecurityHelmet
  # HeadTop/HeadSide hide ear markings; the vulpkanin worn state draws its own ears.
  - type: HideLayerClothing
    layers:
      HeadTop: HEAD
      HeadSide: HEAD
      Hair: HEAD

- type: entity
  parent: ClothingUniformSkirtBase
  id: ClothingUniformJumpskirtReporter
  name: reporter's dress
  description: An extravagant black dress designed to catch the attention of as many people as possible.
  components:
  - type: Sprite
    sprite: _GoobStation/Clothing/Uniforms/Jumpskirt/Civilian/reporter_dress.rsi
  - type: Clothing
    sprite: _GoobStation/Clothing/Uniforms/Jumpskirt/Civilian/reporter_dress.rsi
