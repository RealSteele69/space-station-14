# _ClawCommand: Avali-flavored hair markings.
# The 18 resomi_hair.rsi hairstyles as Avali-only options, alongside the vanilla human hair pool.
# They use Avali/avali_hair.rsi, a copy of resomi_hair.rsi shifted up onto the taller Avali head
# (the Resomi originals sit 3-4px lower and float over an Avali face).

- type: marking
  id: AvaliHairBackstrafe
  bodyPart: Hair
  groupWhitelist: [ MarkingsAvali ]
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/Avali/avali_hair.rsi
    state: ResomiBackstrafe

