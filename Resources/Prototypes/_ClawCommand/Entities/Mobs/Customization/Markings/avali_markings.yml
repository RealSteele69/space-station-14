# _ClawCommand: Avali markings for the Avali body sheet (_ClawCommand/Mobs/Species/Avali/parts.rsi).
# AvaliEarsBase and AvaliTailBase are the species' ears and tail and are defaults in MarkingsAvali;
# they follow the skin colour. The patterned ear/tail sets redraw the base underneath, so they replace it
# rather than stacking on top. Crests sit on HeadTop; the Hair layer keeps human and Avali hairstyles.

# Crests

- type: marking
  id: AvaliCrestBigPonytail
  bodyPart: HeadTop
  groupWhitelist: [ MarkingsAvali ]
  sprites:
  - sprite: _ClawCommand/Mobs/Customization/Avali/avali_crests.rsi
    state: avali_crest_bigponytail_primary
  - sprite: _ClawCommand/Mobs/Customization/Avali/avali_crests.rsi
    state: avali_crest_bigponytail_secondary
