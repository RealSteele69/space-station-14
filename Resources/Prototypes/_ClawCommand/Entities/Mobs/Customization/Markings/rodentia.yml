# Claw Command - Rodentia markings.
# Art lives in Textures/DeltaV/Mobs/Customization/Rodentia (see the meta.json files there for credits).

# HEAD

## DEFAULTS

- type: marking
  id: RodentiaHeadTopEarDefault
  bodyPart: HeadTop
  groupWhitelist: [MarkingsRodentia, Human]
  coloring:
    default:
      type: !type:TattooColoring
  sprites:
  - sprite: DeltaV/Mobs/Customization/Rodentia/ear_markings.rsi
    state: mouse
  - sprite: DeltaV/Mobs/Customization/Rodentia/ear_markings.rsi
    state: mouse_overlay

- type: marking
  id: RodentiaTailDefault
  bodyPart: Tail
  groupWhitelist: [MarkingsRodentia, Human]
  coloring:
    default:
      type: !type:TattooColoring
  sprites:
  - sprite: DeltaV/Mobs/Customization/Rodentia/tail_markings.rsi
    state: mouse

