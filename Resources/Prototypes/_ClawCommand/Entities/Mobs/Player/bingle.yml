# Bingles: pit minions spawned by the BingleSpawn station event.
# Toned down for this server: no stamina damage on hit (the original stunned like a baton),
# lower melee and structural damage, less health, slower healing, no damage resistance on the
# base bingle and no flash immunity.

- type: entity
  name: bingle
  id: MobBingle
  parent: MobSpaceBasic
  description: bingle
  components:
  - type: Bingle
  - type: GhostTakeoverAvailable
  - type: GhostRole
    name: ghost-role-information-bingle-name
    description: ghost-role-information-bingle-description
    rules: ghost-role-information-bingle-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: default
  - type: Sprite
    drawdepth: Mobs
    sprite: _ClawCommand/Mobs/Bingle/bingle.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base", "movement" ]
      state: alive
    - map: [ "enum.BingleVisual.Upgraded" ]
      state: Upgraded
      visible: false
    - map: [ "enum.BingleVisual.Combat" ]
      state: combat
      visible: false
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Dead
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Dead:
        Base: dead
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Nitrogen
        Quantity: 100
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    wideAnimationRotation: 0
    animation: WeaponArcSlash
    damage:
      types:
        Blunt: 5
        Structural: 8
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3.5
  - type: Stamina
    baseCritThreshold: 100
  - type: Damageable
  - type: Injurable
    damageContainer: Biological
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Effects/Footsteps/slime1.ogg
      params:
        volume: 3
  - type: TypingIndicator
    proto: alien
  - type: Speech
    speechVerb: Bingle
    speechSounds: Slime
  - type: ReplacementAccent
    accent: bingle
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      types:
        Poison: -0.1
        Blunt: -0.1
        Slash: -0.1
        Piercing: -0.1
        Heat: -0.1
        Cold: -0.1
        Shock: -0.1
  - type: PointLight
    radius: 1.2
    energy: 1
    color: "#008080"

- type: entity
  id: MobBinglePrime
  name: binglest
  description: The most bingle per bingle.
  parent: MobBingle
  suffix: Prime
  components:
  - type: Bingle
    prime: true

- type: entity
  id: MobBingleUpgraded
  parent: MobBingle
  name: bingler
  description: More bingle per bingle.
  suffix: Upgraded
  components:
  - type: Bingle
    upgraded: true
  - type: Sprite
    drawdepth: Mobs
    sprite: _ClawCommand/Mobs/Bingle/bingle.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base", "movement" ]
      state: Upgraded
    - map: [ "enum.BingleVisual.Combat" ]
      state: combat
      visible: false
  - type: DamageStateVisuals
    states:
      Alive:
        Base: Upgraded
      Dead:
        Base: dead_upgraded
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    wideAnimationRotation: 0
    animation: WeaponArcSlash
    damage:
      types:
        Blunt: 7
        Structural: 12
  - type: Damageable
    damageModifierSet: BingleUpgraded

- type: entity
  id: SpawnPointGhostBinglePrime
  parent: MarkerBase
  categories: [ HideSpawnMenu, Spawner ]
  name: ghost role spawn point
  suffix: bingle prime
  components:
  - type: GhostRole
    name: ghost-role-information-bingle-name
    description: ghost-role-information-bingle-description
    rules: ghost-role-information-bingle-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: MobBinglePrime
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - sprite: _ClawCommand/Mobs/Bingle/bingle.rsi
      state: icon

- type: entity
  id: SpawnPointGhostBingle
  parent: MarkerBase
  categories: [ HideSpawnMenu, Spawner ]
  name: ghost role spawn point
  suffix: bingle
  components:
  - type: GhostRole
    name: ghost-role-information-bingle-name
    description: ghost-role-information-bingle-description
    rules: ghost-role-information-bingle-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: short
  - type: GhostRoleMobSpawner
    prototype: MobBingle
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - sprite: _ClawCommand/Mobs/Bingle/bingle.rsi
      state: icon
