# Ported from Euphoria/Entities/Objects/Consumable/Drinks (no dedicated source
# entity file — milkshake/syrup glasses mirror this fork's own
# drinks_metamorphic.yml pre-filled-glass convention). Reachable via the
# chemistry/mixing reactions in milkshakes_euphoria.yml under Recipes/Reactions.

- type: entity
  parent: DrinkGlass
  id: DrinkBlackberryShake
  suffix: blackberry milkshake
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: BlackberryShake
        Quantity: 30
  - type: Icon
    sprite: _Euphoria/Objects/Consumable/Drinks/Milkshakes/blackberry_shake.rsi
    state: icon

