# Additional baked cakes not covered by the vanilla cake lineup.

- type: entity
  name: brioche cake
  parent: [ FoodCakeBase, BaseSlicingRefinableFood ]
  id: FoodCakeBrioche
  description: A ring of sweet, glazed buns baked together into one cake.
  components:
  - type: FlavorProfile
    flavors:
      - bread
      - sweet
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/baked_cakes.rsi
    state: briochecake
  - type: ToolRefinable
    refineResult:
    - id: FoodCakeBriocheSlice
      amount: 8
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 70
      - ReagentId: Vitamin
        Quantity: 12
      - ReagentId: Sugar
        Quantity: 10

- type: entity
  name: brioche cake slice
  parent: FoodCakeSliceBase
  id: FoodCakeBriocheSlice
  description: Delicious sweet-bread. Who needs anything else?
  components:
  - type: FlavorProfile
    flavors:
      - bread
      - sweet
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/baked_cakes.rsi
    state: briochecake_slice
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 8.75
      - ReagentId: Vitamin
        Quantity: 1.5
      - ReagentId: Sugar
        Quantity: 1.25

