- type: entity
  name: khachapuri
  parent: [ SolutionSmall, FoodBakedBase ]
  id: FoodBakedKhachapuri
  description: Bread with egg and cheese baked into a boat. What's not to love?
  components:
  - type: Item
    size: Small
  - type: FlavorProfile
    flavors:
      - bread
      - egg
      - cheesy
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/baked_misc.rsi
    state: khachapuri
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 24
      - ReagentId: Vitamin
        Quantity: 4

- type: entity
  name: chocolate cornet
  parent: FoodBakedBase
  id: FoodBakedChocolateCornet
  description: Which end is the head, the fat end or the thin end?
  components:
  - type: FlavorProfile
    flavors:
      - chocolate
      - bread
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/baked_misc.rsi
    state: chococornet
