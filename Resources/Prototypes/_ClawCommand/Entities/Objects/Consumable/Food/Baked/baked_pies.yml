  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/baked_pies.rsi
    state: dulcedebatataslice
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 7
      - ReagentId: Vitamin
        Quantity: 2
      - ReagentId: Sugar
        Quantity: 1.5
  - type: Tag
    tags:
    - Vegetable
    - Pie
    - Slice
