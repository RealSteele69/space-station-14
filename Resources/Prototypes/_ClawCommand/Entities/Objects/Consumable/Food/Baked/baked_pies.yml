  description: A delicious jelly made with sweet potatoes.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - potatoes
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/baked_pies.rsi
    state: dulcedebatata
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 56
      - ReagentId: Vitamin
        Quantity: 16
      - ReagentId: Sugar
        Quantity: 12
  - type: ToolRefinable
    refineResult:
    - id: FoodPieDulceDeBatataSlice
      amount: 8
  - type: Tag
    tags:
    - Vegetable
    - Pie

- type: entity
  name: slice of dulce de batata
  parent: FoodPieSliceBase
  id: FoodPieDulceDeBatataSlice
  description: A sweet slice of dulce de batata jelly.
  components:
