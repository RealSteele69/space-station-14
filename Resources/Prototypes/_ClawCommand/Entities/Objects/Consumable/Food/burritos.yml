# Burrito family, not previously present in this fork. Built from the
# existing FoodDoughTortillaFlat ingredient (already used as the generic
# "tortilla" for nachos/enchiladas elsewhere in this repo), so no new
# produce/dough items were needed. Recipes in
# _ClawCommand/Recipes/Cooking/meal_recipes_burritos.yml.

- type: entity
  parent: FoodMealBase
  id: FoodMealBurrito
  name: burrito
  description: Tortilla-wrapped goodness.
  components:
  - type: FlavorProfile
    flavors:
    - meaty
    - soy
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/burritos.rsi
    state: burrito
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 18
      - ReagentId: Protein
        Quantity: 4
  - type: Tag
    tags:
    - Meat

