# Ported from Floof/Entities/Objects/Consumable/Food/fish_snacks.yml
# Species-specific fish meat ingredients from the source (FoodMeatSalmon, FoodMeatFishLowQualityFillet,
# FoodMeatMoonFishFillet, FoodMeatDonkFish, FoodMeatArmorFish) don't exist in this fork - our fishing
# system (Entities/Objects/Specific/Fishing/fish.yml) already refines every fish into a single generic
# FoodMeatFish/FoodMeatSquid ingredient, so all recipes below use that instead, matching the convention
# already used by the ported NF fish dishes (RecipeCarpSushi in meal_recipes_nf.yml).
# Sprites copied to _Floof/Objects/Consumable/Food/{fish_filet,squid}.rsi.

- type: entity
  name: salmon sushi roll
  parent: [FoodMealBase, BaseSlicingRefinableFood]
  id: FoodMealSalmonSushi
  description: Where did the seaweed come from?
  components:
  - type: FlavorProfile
    flavors:
    - fishy
    - cucumber
    - avocado
  - type: Sprite
    sprite: _Floof/Objects/Consumable/Food/fish_filet.rsi
    state: salmon_sushi_roll
  - type: Solution
    solution:
      maxVol: 40
      reagents:
      - ReagentId: Nutriment
        Quantity: 20
      - ReagentId: Flavorol
        Quantity: 10
      - ReagentId: CucumberWater
        Quantity: 2
  - type: ToolRefinable
    refineResult:
    - id: FoodMealSalmonSushiSlice
      amount: 5
  - type: Tag
    tags:
    - Meat

- type: entity
  name: salmon sushi roll slice
  parent: FoodInjectableBase
  id: FoodMealSalmonSushiSlice
