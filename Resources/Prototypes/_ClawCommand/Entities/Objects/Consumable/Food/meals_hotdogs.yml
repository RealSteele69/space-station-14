# Claw Command - topped hotdogs from the DonkCo recipe folder (BoxFolderHotdogRecipes).
# Each is a plain microwave recipe (Recipes/Cooking/meal_recipes_hotdogs.yml): hotdog bun + sausage +
# the toppings on its card. All share the bay_food.rsi "hotdog" sprite of the base FoodMealHotdog.

- type: entity
  parent: FoodMealHotdog
  id: FoodMealHotdogLosAngeles
  name: Los Angeles hotdog
  description: Wrapped in bacon, smothered in onions and chili. Born from street carts and questionable life choices.
  components:
  - type: FlavorProfile
    flavors:
    - meaty
    - bacon
    - onion
    - spicy
  - type: Solution
    solution:
      maxVol: 25
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Protein
        Quantity: 4
      - ReagentId: Vitamin
        Quantity: 1
      - ReagentId: CapsaicinOil
        Quantity: 2

