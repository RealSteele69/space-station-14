# Claw Command - sushi components and dishes not already covered by the NF
# avocado/carp sushi port (sushi_nf.yml) or the Floof salmon roll. Prep
# ingredients (rice, seaweed, canned tuna) are stocked in the chef vending
# machine; finished dishes go through the RandomFoodMeal spawner.

# === Components === #

- type: entity
  name: sushi rice
  parent: FoodInjectableBase
  id: FoodSushiRice
  description: A bowl of sticky rice for making sushi.
  components:
  - type: FlavorProfile
    flavors:
    - rice
    - salty
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/sushi_extras.rsi
    state: sushi_rice
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: TableSalt
        Quantity: 5

- type: entity
  name: seaweed sheet
  parent: FoodInjectableBase
  id: FoodSeaweedSheet
  description: A thin, light salted sheet of plant matter. Commonly used in sushi recipes.
  components:
  - type: FlavorProfile
    flavors:
    - salty
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/sushi_extras.rsi
    state: sea_weed
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 2
      - ReagentId: TableSalt
        Quantity: 2
  - type: Tag
    tags:
    - Vegetable

- type: entity
  name: canned tuna
  parent: FoodInjectableBase
  id: FoodCannedTuna
  description: A small can of tuna fish, beloved by felines.
  components:
  - type: FlavorProfile
    flavors:
    - cannedtuna
    - salty
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/sushi_extras.rsi
    state: tuna_can
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: TableSalt
        Quantity: 5
      - ReagentId: Mercury
        Quantity: 1
  - type: Tag
    tags:
    - Meat

