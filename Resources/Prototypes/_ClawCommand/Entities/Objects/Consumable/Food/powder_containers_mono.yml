# Ported from Mono/Entities/Objects/Specific/Cooking/powder_containers.yml
# BlackTeaPouch and CoffeePouch skipped: those use the vanilla TeaPowder /
# CoffeeGrounds reagents, not a new Mono reagent, so there's nothing to add
# here for them.
# Adapted: source parented directly off ReagentPacketBase (no solution
# component, no Item size). This fork's ReagentPacketBase doesn't carry a
# Solution by itself (see vanilla ingredients.yml's ReagentPacket /
# ReagentPacketSmall split), so these use ReagentPacketSmall instead, same
# as other small single-reagent packets in this fork.

- type: entity
  parent: ReagentPacketSmall
  id: ReagentContainerGreenTeaPouch
  name: green tea pouch
  description: A pouch of green tea powder. Good for brewing tea!
  components:
  - type: Sprite
    sprite: _Mono/Objects/Consumable/Food/teabags.rsi
    state: greenBag
  - type: Solution
    solution:
      reagents:
      - ReagentId: GreenTeaPowder
        Quantity: 50

