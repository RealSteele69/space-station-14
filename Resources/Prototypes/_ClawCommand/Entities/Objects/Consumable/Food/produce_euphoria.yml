- type: entity
  name: blackberry
  parent: FoodProduceBase
  id: FoodBlackberry
  description: These berries have a deep sweetness and refreshing tartness to them.
  components:
  - type: FlavorProfile
    flavors:
    - blackberry
  - type: Solution
    solution:
      maxVol: 11
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Vitamin
        Quantity: 4
  - type: Sprite
    sprite: _Euphoria/Objects/Specific/Hydroponics/blackberry.rsi
  - type: Item
    heldPrefix: produce
  - type: Produce
    plantId: BlackberryPlants
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: BlackberryJuice
        Quantity: 10
  - type: Tag
    tags:
    - Fruit
  - type: FoodSequenceElement
    entries:
      Burger: Blackberry
      Taco: Blackberry

