- type: entity
  name: humpshroom
  parent: FoodProduceBase
  id: FoodHumpShroom
  description: A sweet-smelling mushroom that excretes a sticky and arousing liquid.
  components:
  - type: FlavorProfile
    flavors:
      - mushroom
  - type: Solution
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Philterex
        Quantity: 5
      - ReagentId: Nutriment
        Quantity: 5
  - type: Sprite
    sprite: _Floof/Objects/Specific/Hydroponics/humpshroom.rsi
  - type: Produce
    plantId: HumpShroomPlants
  - type: Extractable
    grindableSolutionName: food
  - type: Tag
    tags:
    - Vegetable

- type: entity
  name: breedshroom
  parent: FoodProduceBase
  id: FoodBreedShroom
  description: An overwhelmingly smelling mushroom that excretes an incredibly sticky and arousing liquid. It has been known to increase the population in colonies.
  components:
  - type: FlavorProfile
    flavors:
      - mushroom
  - type: Solution
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Libidozenithizine
        Quantity: 2
      - ReagentId: Philterex
        Quantity: 4
      - ReagentId: Happiness
        Quantity: 4
  - type: Sprite
    sprite: _Floof/Objects/Specific/Hydroponics/breedshroom.rsi
  - type: Produce
    plantId: BreedShroomPlants
  - type: Extractable
    grindableSolutionName: food
  - type: Tag
    tags:
    - Vegetable

- type: entity # Floofstation
  name: pomegranate
  parent: [FoodProduceBase, BaseSlicingRefinableFood]
  id: FoodPomegranate
  description: A delicious, sweet fruit, believed to have special properties.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - spooky
  - type: Solution
    solution:
      maxVol: 40
      reagents:
      - ReagentId: Pomelustine
        Quantity: 30
      - ReagentId: Nutriment
        Quantity: 10
  - type: Sprite
    sprite: _Floof/Objects/Specific/Hydroponics/pomegranate.rsi
  - type: Produce
    plantId: PomegranatePlants
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuicePomegranate
        Quantity: 20
  - type: ToolRefinable
    refineResult:
    - id: FoodPomegranateSlice
      amount: 2
  - type: Tag
    tags:
    - Fruit

- type: entity # Floofstation
  name: pomegranate slice
  parent: ProduceSliceBase
  id: FoodPomegranateSlice
  description: A delicious, sweet fruit, believed to have special properties.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - spooky
  - type: Sprite
    sprite: _Floof/Objects/Specific/Hydroponics/pomegranate.rsi
  - type: Solution
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Pomelustine
        Quantity: 15
      - ReagentId: Nutriment
        Quantity: 5
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuicePomegranate
        Quantity: 10
  - type: Tag
    tags:
    - Fruit
    - Slice

- type: entity
  name: coconut
  parent: FoodProduceBase
  id: FoodCoconut
  description: A delicious, sweet fruit, believed to have special properties.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - creamy
      - nutty
  - type: Solution
    solution:
      maxVol: 7
      reagents:
      - ReagentId: CoconutWater
        Quantity: 2
      - ReagentId: Nutriment
        Quantity: 5
  - type: Sprite
    sprite: _Floof/Objects/Specific/Hydroponics/coconut.rsi
  - type: Produce
    plantId: CoconutPlants
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: CoconutWater
        Quantity: 10
  - type: Tag
    tags:
    - Fruit
    - CoconutFruit
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 1 # give it a tiny bit of throw damage for the silly

- type: entity
  name: coconut gun husk
  parent: FoodProduceBase
  id: FoodCoconutGunFruit
  description: A delicious, gun-shaped fruit with a thick wooden stem.
  components:
  - type: FlavorProfile
    flavors:
      - gunpowder
      - sweet
      - creamy
      - nutty
  - type: Solution
    solution:
      maxVol: 15
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Sulfur # kept so it tastes similar to gatfruit
        Quantity: 5
      - ReagentId: CoconutWater
        Quantity: 5
  - type: Sprite
    sprite: _Floof/Objects/Specific/Hydroponics/coconut_gun.rsi
  - type: Produce
    plantId: CoconutGunPlants
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: CoconutWater
        Quantity: 10
  - type: Tag
    tags:
    - Fruit

