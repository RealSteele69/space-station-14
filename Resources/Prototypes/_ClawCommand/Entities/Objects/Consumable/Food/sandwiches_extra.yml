# New sandwiches/toasts not previously present in this fork. Recipes in
# _ClawCommand/Recipes/Cooking/meal_recipes_sandwiches_extra.yml.

- type: entity
  parent: FoodMealBase
  id: FoodMealBLT
  name: BLT sandwich
  description: The classic bacon, lettuce, and tomato sandwich.
  components:
  - type: FlavorProfile
    flavors:
    - bacon
    - cabbage
    - tomato
    - mayonnaise
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/sandwiches_extra.rsi
    state: blt
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 18
      - ReagentId: Protein
        Quantity: 4
      - ReagentId: Mayo
        Quantity: 5
  - type: Tag
    tags:
    - Meat

