# Claw Command - standalone candy/sweet snacks not already covered by
# candy_extras.yml, lollypops.yml (88 variants), snacks.yml or snacks_extras.yml.
# Reachability is via RandomSnackTable (Food_Drinks/food_snacks.yml), except
# space twinkie which stocks the candy vending machine like its source.

- type: entity
  parent: FoodBase
  id: FoodChocolateCoin
  name: chocolate coin
  description: A completely edible, but non-flippable, festive coin.
  components:
  - type: FlavorProfile
    flavors:
    - chocolate
    - sweet
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/candy_extras.rsi
    state: chococoin
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: CocoaPowder
        Quantity: 1
      - ReagentId: Sugar
        Quantity: 1

