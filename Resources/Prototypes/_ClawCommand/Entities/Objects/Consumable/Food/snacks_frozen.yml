# Claw Command - frozen dessert and snowcone variants not already covered by
# the vanilla frozen.yml or the DeltaV ice-cream-vat flavor port. Reachability
# is via RandomSnackTable (Food_Drinks/food_snacks.yml), matching how the
# existing frozen desserts/snowcones are distributed.

# === Frozen desserts === #

- type: entity
  name: honkdae
  parent: FoodFrozenBase
  id: FoodFrozenHonkdae
  description: The clown's favorite dessert.
  components:
  - type: FlavorProfile
    flavors:
    - banana
    - sweet
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/frozen_treats.rsi
    state: honkdae
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: JuiceBanana
        Quantity: 5
  - type: Tag
    tags:
    - Fruit

- type: entity
  name: banana split
  parent: FoodFrozenBase
  id: FoodFrozenBananaSplit
  description: A long dish filled with ice cream, chocolate and a banana down the middle. A timeless classic by any standards.
  components:
  - type: FlavorProfile
    flavors:
    - banana
    - cherry
    - sweet
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/frozen_treats.rsi
    state: banana_split
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: JuiceBanana
        Quantity: 8
      - ReagentId: JuiceCherry
        Quantity: 2
  - type: Tag
    tags:
    - Fruit

- type: entity
  name: cherry shake
  parent: FoodFrozenBase
  id: FoodFrozenCherryShake
  description: Cherries mixed with ice cream, known for its filling taste.
  components:
  - type: FlavorProfile
    flavors:
    - cherry
    - sweet
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/frozen_treats.rsi
    state: cherryshake
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: JuiceCherry
        Quantity: 8
  - type: Tag
    tags:
    - Fruit

- type: entity
  name: blue cherry shake
  parent: FoodFrozenBase
  id: FoodFrozenBlueCherryShake
  description: Cherries mixed with ice cream, known for its filling taste. This one is an exotic blue!
  components:
  - type: FlavorProfile
    flavors:
    - cherry
    - sweet
  - type: Sprite
    sprite: _ClawCommand/Objects/Consumable/Food/frozen_treats.rsi
    state: bluecherryshake
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: JuiceCherry
        Quantity: 8
  - type: Tag
    tags:
    - Fruit

# === Snowcones === #
# FoodFrozenSnowconeBase (shaved ice + alpha-filling layer, tintable) and its
# trash are defined upstream in Entities/Objects/Consumable/Food/frozen.yml.
# Flavorless/berry/fruit-salad/clown/mime/rainbow already exist there; these
# fill in the rest of the flavor line using existing juice/soda reagents.

- type: entity
  name: lime snowcone
  parent: FoodFrozenSnowconeBase
  id: FoodFrozenSnowconeLime
  description: Lime syrup drizzled over a snowball in a paper cup.
  components:
  - type: Sprite
    layers:
    - state: cone
    - state: alpha-filling
      color: "#99bb43"
  - type: Edible
    trash:
    - FoodFrozenSnowconeTrash
  - type: Tag
    tags:
    - Fruit

