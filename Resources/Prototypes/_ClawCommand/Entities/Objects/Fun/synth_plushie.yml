# Claw Command - synth plushie.

- type: entity
  parent: BasePlushie
  id: PlushieSynth
  name: synth plushie
  description: Marketable and stylish, with built-in speakers to remind everybody why people call synths "beepers".
  components:
  - type: Sprite
    sprite: _ClawCommand/Objects/Fun/Plushies/synth_plushie.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: Item
    sprite: _ClawCommand/Objects/Fun/Plushies/synth_plushie.rsi
  - type: EmitSoundOnUse
    sound: &PlushieSynthSound
      path: /Audio/Machines/twobeep.ogg
      params:
        volume: 2
  - type: EmitSoundOnLand
    sound: *PlushieSynthSound
  - type: EmitSoundOnActivate
    sound: *PlushieSynthSound
  - type: EmitSoundOnTrigger
    sound: *PlushieSynthSound
  - type: EmitSoundOnCollide
    sound: *PlushieSynthSound
  - type: Edible
    useSound: *PlushieSynthSound
  - type: MeleeWeapon
    soundHit: *PlushieSynthSound
