# Ported from Euphoria/Recipes/Cooking/recipe_cards.yml
# These are flavor-text only - plain Paper entities describing hotdog toppings, not actual reagent/food
# recipes (the source's topping metamorph system for FoodHotdogBun was not ported - see
# Entities/Objects/Consumable/Food/meals_euphoria.yml). No new sprite assets needed; they use the
# existing vanilla Objects/Misc/folders.rsi and Objects/Misc/bureaucracy.rsi (via the Paper parent).

- type: entity
  id: BoxFolderHotdogRecipes
  parent: BoxFolderBaseEmpty
  name: hotdog recipes
  description: A folder of hotdog recipes from DonkCo.
  components:
  - type: Sprite
    sprite: Objects/Misc/folders.rsi
    layers:
    - state: folder-colormap
      color: "#9fed58"
    - state: folder-base
  - type: StorageFill
    contents:
    - id: PaperRecipeCardHotdogLA
    - id: PaperRecipeCardHotdogHuman
    - id: PaperRecipeCardHotdogTofu
    - id: PaperRecipeCardHotdogDirty
    - id: PaperRecipeCardHotdogChicago
    - id: PaperRecipeCardHotdogChili
    - id: PaperRecipeCardHotdogConey
    - id: PaperRecipeCardHotdogHalfSmoke
    - id: PaperRecipeCardHotdogBacon
    - id: PaperRecipeCardHotdogFish
    - id: PaperRecipeCardHotdogPolish

- type: entity
  id: PaperRecipeCardHotdogLA
  categories: [ HideSpawnMenu ]
  suffix: hotdog LA
  name: the Los Angeles
  parent: Paper
  components:
  - type: Paper
    content: |2
      [head=2]The Los Angeles[/head]

      1 - Cooked Sausage
      1 - Chili
      1 - Onion Slice
      1 - Cooked Bacon

      Served in a hotdog bun.

      [italic]Recipe provided by DonkCo.[/italic]

