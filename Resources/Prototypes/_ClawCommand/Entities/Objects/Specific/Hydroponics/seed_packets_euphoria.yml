# Seed packet entities pairing with plants in:
#   _ClawCommand/Hydroponics/seeds_plants_euphoria.yml

- type: entity
  parent: SeedBase
  name: packet of blackberry seeds
  description: "So berry good."
  id: BlackberrySeeds
  components:
    - type: Seed
      plantId: BlackberryPlants
    - type: Sprite
      sprite: _Euphoria/Objects/Specific/Hydroponics/blackberry.rsi

