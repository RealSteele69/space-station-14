# Seed packets for goob-ported plants.

- type: entity
  parent: SeedBase
  name: packet of strange berry seeds
  id: StrangeBerrySeeds
  components:
    - type: Seed
      plantId: StrangeBerryPlants
    - type: Sprite
      sprite: _GoobStation/Objects/Specific/Hydroponics/strange_berries.rsi

- type: entity
  parent: SeedBase
  name: packet of mango seeds
  id: MangoSeeds
  components:
    - type: Seed
      plantId: MangoPlants
    - type: Sprite
      sprite: _RMC14/Objects/Kitchen/Plants/mango.rsi

- type: entity
  parent: SeedBase
  name: packet of bluespace tomato seeds
  id: BluespaceTomatoSeeds
  components:
    - type: Seed
      plantId: BluespaceTomatoPlants
    - type: Sprite
      sprite: _GoobStation/Objects/Specific/Hydroponics/bluespace_tomato.rsi
