# Claw Command - RMC-14 APCs, tanks, armed humvee/van and power loaders on the upstream vehicle system.
# RMC runs these on its grid mover with map interiors, hardpoints and rotating turret entities. Here:
# - crews ride hidden inside (ContainerVehicle); the first in drives
# - each turret is a gunner seat (VehicleControls.turretWeapons): a passenger uses "Man turret" to get
#   that seat's gun in hand and fires it through the normal gun system. The driver can't man one.
# - turret overlays are baked per direction into *_turret.rsi (RMC's offsets) and face the hull's way
# - like every vehicle here the hull stops bullets and lasers when aimed at (RequireProjectileTarget),
#   and shots from aboard never hit their own vehicle (VehicleControlsSystem)
# Fixtures and lights follow RMC's prototypes; armour values are RMC's frame modifier sets.

- type: entity
  abstract: true
  parent: BaseVehicleVanClaw
  id: BaseVehicleArmoredClaw
  components:
  - type: Repairable
    damageValue: -40
    doAfterDelay: 3
    fuelCost: 10
  - type: VehicleControls
    damagedThreshold: 600
    criticalThreshold: 960
  - type: VehicleHandling
    crashDamage:
      types:
        Blunt: 1
    obstacleDamage:
      types:
        Structural: 10
        Blunt: 5
    occupantDamage:
      types:
        Blunt: 0.3
    runOverDamage:
      types:
        Blunt: 5
  - type: Vehicle
    transferDamageModifier:
      coefficients:
        Blunt: 0.2
        Slash: 0.2
        Piercing: 0.2
        Heat: 0.2
        Structural: 0.2
  - type: Damageable
    damageModifierSet: ArmoredVehicleAPC
  - type: PointLight
    radius: 12
    energy: 2.5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1200
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1:
            min: 4
            max: 8
          SheetSteel1:
            min: 6
            max: 10
          PartRodMetal1:
            min: 1
            max: 2
          CableApcStack1:
            min: 1
            max: 1
          PuddleOilVehicleWreck:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ExplodeBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Explosive
    explosionType: Default
    totalIntensity: 40
    intensitySlope: 5
    maxIntensity: 8
    maxTileBreak: 0 # no hull breaches from a wreck
    canCreateVacuum: false

# --- APCs --------------------------------------------------------------------

- type: entity
  abstract: true
  parent: BaseVehicleArmoredClaw
  id: BaseVehicleAPCClaw
  components:
  - type: VehicleHandling
    runOverSpeedLoss: 0.05
    coasting: 2.5
    grip: 13
    turnRate: 110
    turnRateAtTopSpeed: 50
    acceleration: 2
    speedingAcceleration: 0.5
    topSpeedMultiplier: 1.3
    braking: 5
    bumperBounds: "-1.15,-1.85,1.15,1.85"
  - type: Sprite
    sprite: _ClawCommand/Objects/Vehicles/apc.rsi
    layers:
    - state: apc_base
      map: ["base"]
    - state: damaged_frame
      map: ["wear"]
      visible: false
    - state: wheels_1
      map: ["wheels"]
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-1.7,1,1.7"
        density: 1200
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - TableLayer

- type: entity
  parent: BaseVehicleAPCClaw
  id: VehicleAPC
  name: armored personnel carrier
  description: A rugged armored personnel carrier outfitted for battlefield support. Crewed by a driver, a turret gunner, a front gunner and two port gunners.
  components:
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      tags:
      - VehicleKeysSecurity
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          tags:
          - VehicleKeysSecurity
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -3
  - type: ContainerContainer
    containers:
      vehicle_occupants: !type:Container
      key_slot: !type:ContainerSlot
  - type: Sprite
    layers:
    - state: apc_base
      map: ["base"]
    - state: damaged_frame
      map: ["wear"]
      visible: false
    - state: frontalcannon_0
    - state: dualcannon_0
    - state: wheels_1
      map: ["wheels"]
  - type: VehicleControls
    maxOccupants: 10
    turretWeapons:
    - VehicleTurretAPCDualCannon
    - VehicleTurretAPCFrontCannon
    - VehicleTurretAPCPortGun
    - VehicleTurretAPCPortGun

- type: entity
