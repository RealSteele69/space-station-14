        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseStructureDynamic
  id: VehiclePowerLoaderWreck
  name: power loader wreck
  description: What's left of a power loader. Good for scrap.
  components:
  - type: Sprite
    sprite: _ClawCommand/Objects/Vehicles/power_loader.rsi
    state: wreck
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
