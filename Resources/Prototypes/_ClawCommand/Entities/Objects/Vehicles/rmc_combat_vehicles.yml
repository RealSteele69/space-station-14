# --- Power loaders -----------------------------------------------------------
# Ridden: the loader frame (powerloader_overlay) draws over its pilot. The cargo claws aren't ported.

- type: entity
  parent: BaseVehicleRiddenClaw
  id: VehiclePowerLoader
  name: LU-50 power loader
  description: An old design refurbished by Weston-Yamada used in warehouses, constructions and military ships everywhere.
  components:
  - type: VehicleHandling
    runOverSpeedLoss: 0.2
    braking: 12
    coasting: 10
    grip: 35
    turnRate: 220
    turnRateAtTopSpeed: 160
    acceleration: 2.5
    topSpeedMultiplier: 1.2
    ejectSpeedLoss: null
    obstacleDamage:
      types:
        Structural: 6
        Blunt: 4
    runOverDamage:
      types:
        Blunt: 3
  - type: Sprite
    sprite: _ClawCommand/Objects/Vehicles/power_loader.rsi
    drawdepth: OverMobs
    layers:
    - state: powerloader_open
      map: ["buckledLayer"]
  - type: GenericVisualizer
    visuals:
      enum.StrapVisuals.State:
        buckledLayer:
          True: { state: powerloader_overlay }
          False: { state: powerloader_open }
  - type: VehicleControls
    criticalThreshold: 320
    damagedThreshold: 200
    hornAction: null
  - type: Strap
    modifyBuckleDrawDepth: false
    buckleSound:
      path: /Audio/_ClawCommand/Effects/Vehicle/powerloader_buckle.ogg
      params:
        variation: 0.1
    unbuckleSound:
      path: /Audio/_ClawCommand/Effects/Vehicle/powerloader_unbuckle.ogg
      params:
        variation: 0.1
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 2
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          VehiclePowerLoaderWreck:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: VehiclePowerLoader
  id: VehiclePowerLoaderGreen
  name: LU-43 power loader
  description: A really old but trusted design used in warehouses, constructions and military ships everywhere.
  components:
  - type: Sprite
    layers:
    - state: powerloader_open_jd
      map: ["buckledLayer"]
  - type: GenericVisualizer
    visuals:
      enum.StrapVisuals.State:
        buckledLayer:
          True: { state: powerloader_overlay_jd }
          False: { state: powerloader_open_jd }
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          VehiclePowerLoaderWreckGreen:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: VehiclePowerLoader
  id: VehiclePowerLoaderBlue
  name: LU-52 power loader
  description: A modernized design made to outdo the older models, once used in fancy ports and facilities.
  components:
  - type: Sprite
    layers:
    - state: powerloader_open_ft
      map: ["buckledLayer"]
  - type: GenericVisualizer
    visuals:
      enum.StrapVisuals.State:
        buckledLayer:
          True: { state: powerloader_overlay_ft }
          False: { state: powerloader_open_ft }
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          VehiclePowerLoaderWreckBlue:
            min: 1
            max: 1
