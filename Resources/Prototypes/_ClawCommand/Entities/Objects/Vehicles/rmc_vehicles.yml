# Claw Command - wheeled vans and humvees ported from RMC-14 (sprites from CMSS13, credited in each meta.json).
# RMC drives these on its own grid mover with map-loaded interiors and hardpoints; here they're plain
# enclosed cars on the upstream vehicle system: occupants ride hidden inside, wheels animate while moving.
# Fixtures, sprite offsets and headlight placement follow RMC's prototypes.

- type: entity
  abstract: true
  parent: BaseVehicleEnclosedClaw
  id: BaseVehicleVanClaw
  components:
  - type: GenericVisualizer
    visuals:
      enum.VehicleWearVisuals.Level:
        wear:
          Fine: { visible: false }
          Damaged: { visible: true }
          Critical: { visible: true }
  - type: Repairable
    damageValue: -30
    doAfterDelay: 2
    fuelCost: 6
  - type: VehicleHandling
    runOverSpeedLoss: 0.1
    cornerDrag: 0.4
    coasting: 2
    braking: 7
    topSpeedMultiplier: 1.35
    speedingAcceleration: 0.6
    grip: 7
    turnRate: 150
    turnRateAtTopSpeed: 65
    acceleration: 2.6
    bumperBounds: "-0.75,-1.35,0.75,1.65"
  - type: Sprite
    sprite: _ClawCommand/Objects/Vehicles/military_van.rsi
    layers:
    - state: van_base
      map: ["base"]
    - state: damaged_frame
      map: ["wear"]
      visible: false
    - state: wheels_1
      map: ["wheels"]
  - type: SpriteMovement
    movementLayers:
      wheels:
        state: wheels_0
    noMovementLayers:
      wheels:
        state: wheels_1
  - type: VehicleControls
    criticalThreshold: 640
    damagedThreshold: 400
    maxOccupants: 6
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-1.2,0.6,1.5"
        density: 1000
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - TableLayer
  - type: PointLight
    enabled: false
    radius: 6
    energy: 2.5
    softness: 2
    lightMask: ConeSingle
    autoRot: true
    offset: "0,0.9"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 4
            max: 8
          PartRodMetal1:
            min: 1
            max: 2
          CableApcStack1:
            min: 1
            max: 1
          PuddleOilVehicleWreck:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ExplodeBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseVehicleVanClaw
  id: VehicleMilitaryTruck
  name: military truck
  description: A rugged canvas-backed transport truck with room for a squad.

