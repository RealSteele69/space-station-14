# Humvee hulls only - RMC's turret/hardpoint variants need its weapon systems.
- type: entity
  parent: BaseVehicleVanClaw
  id: VehicleHumvee
  name: humvee
  description: A fast armored utility vehicle outfitted for patrols and support. This one carries no weapons.
  components:
  - type: VehicleHandling
    cornerDrag: 0.3
    topSpeedMultiplier: 1.45
    speedingAcceleration: 0.9
    grip: 11
    turnRate: 210
    turnRateAtTopSpeed: 90
    acceleration: 3.8
    bumperBounds: "-0.8,-1.35,0.8,1.35"
  - type: Sprite
    sprite: _ClawCommand/Objects/Vehicles/humvee.rsi
    layers:
    - state: humvee_base
      map: ["base"]
    - state: damaged_frame
      map: ["wear"]
      visible: false
    - state: wheels_1
      map: ["wheels"]
  - type: VehicleControls
    maxOccupants: 4
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 7
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.65,-1.2,0.65,1.2"
        density: 900
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - TableLayer

- type: entity
