  - type: VehicleControls
    maxOccupants: 6

# The Mono-Supron, drivable. RMC only has it as a side-on prop (facing left, plus a mirrored "_f" copy),
# so VehicleSideView shows whichever side matches the way it's pointing, and the damaged prop frames
# double as wear states. Wrecking it leaves the burnt-out prop behind.
- type: entity
  parent: BaseVehicleEnclosedClaw
  id: VehicleMonoSupron
  name: Mono-Supron
  description: The 'Mono-Supron', a mass-produced civilian vehicle for the colonial markets, in and outside of the United Nations. Produced by 'Miyahira' a car marque and a subsidiary company of the Weston-Yamada Corporation. This one still runs.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/vehicles.rsi
    offset: "0,0.3125"
    layers:
    - state: miyahira_orange
      map: ["base"]
  - type: VehicleSideView
    state: miyahira_orange
    wearSuffixes:
      Damaged: _damaged1
      Critical: _damaged3
  - type: VehicleHandling
    grip: 9
    acceleration: 4
    speedingAcceleration: 1
    topSpeedMultiplier: 1.5
    turnRate: 210
    turnRateAtTopSpeed: 90
    cornerDrag: 0.3
    bumperRadius: 0.8
  - type: VehicleControls
    maxOccupants: 4
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.5
    baseSprintSpeed: 6.5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          RMCPropVehicleMonoSupronOrangeDestroyed:
            min: 1
            max: 1
          PuddleOilVehicleWreck:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ExplodeBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: VehicleMonoSupron
  id: VehicleMonoSupronPolice
  name: Mono-Supron police cruiser
  description: A Mono-Supron in colonial police livery, with a light bar and siren. This one still runs.
  components:
  - type: Sprite
    layers:
    - state: miyahira_cop
      map: ["base"]
  - type: VehicleSideView
    state: miyahira_cop
    wearSuffixes:
      Damaged: _damaged1
      Critical: _damaged3
  - type: VehicleControls
    maxOccupants: 4
    sirenAction: ActionVehicleSiren
  - type: AmbientSound
    enabled: false
    volume: -2
    range: 12
    sound:
      path: /Audio/Effects/Vehicle/policesiren.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          RMCPropVehicleMonoSupronCopDestroyed:
            min: 1
            max: 1
          PuddleOilVehicleWreck:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ExplodeBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
