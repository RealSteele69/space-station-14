# Claw Command - turret guns for the RMC-14 combat vehicle port.
# A gunner who mans a turret seat (VehicleControlsComponent.turretWeapons) gets one of these put in their
# hand; it can't be dropped and is deleted when they let go or leave. It fires through the normal gun
# system from inside the vehicle. Ammo recharges, so there's nothing to reload or refill.
# Stats are loosely based on the RMC hardpoints, using our own projectiles; RMC's vehicle weapon sounds
# have no attribution, so stock sounds are used. Icons are RMC/CMSS13 hardpoint sprites (see meta.json).

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseVehicleTurretGun
  components:
  - type: Item
    size: Ginormous
  - type: Unremoveable
    deleteOnDrop: true
  - type: VehicleTurretWeapon
  - type: Gun
    minAngle: 2
    maxAngle: 8
    angleIncrease: 1
    angleDecay: 8
    fireRate: 4
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletRifle
    capacity: 60
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.25
  - type: AmmoCounter

# --- APC ---------------------------------------------------------------------

