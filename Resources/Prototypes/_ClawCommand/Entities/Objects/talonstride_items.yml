# --- EstacaoPirata/Entities/Objects/Misc/{base,black_cards,nt_cards}.yml ---
# This fork has no playing-card system (CardDeck/CardStack/OpenTriggeredStorageFill),
# so the deck boxes are plain, empty small storage boxes with the open/closed sprite.
- type: entity
  parent: [ BoxCardboard, BaseBagOpenClose ]
  id: CardBoxBase
  name: deck box
  abstract: true
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,1
  - type: Sprite
    sprite: EstacaoPirata/Objects/Misc/cards.rsi
    layers:
    - state: black_box
    - state: black_box_open
      map: [ "openLayer" ]
      visible: false
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,1,1
  - type: Appearance
  - type: StaticPrice
    price: 20

- type: entity
  parent: CardBoxBase
  id: CardBoxBlack
  name: black deck box
  components:
  - type: Sprite
    sprite: EstacaoPirata/Objects/Misc/cards.rsi
    layers:
    - state: black_box
    - state: black_box_open
      map: [ "openLayer" ]
      visible: false

- type: entity
  parent: CardBoxBase
  id: CardBoxNanotrasen
  name: nanotrasen deck box
  components:
  - type: Sprite
    sprite: EstacaoPirata/Objects/Misc/cards.rsi
    layers:
    - state: nanotrasen_box
    - state: nanotrasen_box_open
      map: [ "openLayer" ]
      visible: false

