# Ported from space/ for the TalonStride map.
# Misc handheld items. Source files noted per section; behaviour that depends on
# systems this fork lacks has been stripped (see per-entity comments).

# --- Nyanotrasen/Entities/Objects/Specific/Chapel/bibles.yml ---
# Source Summonable used `specialItem: SpawnPointGhostIfrit` (field and ghost role
# don't exist here); the override is dropped and the Bible parent's summon is kept.
- type: entity
  parent: Bible
  id: BibleMystagogue
  name: book of mysteries
  description: The mystagogue's holy book.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Specific/Chapel/holylight.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Nyanotrasen/Objects/Specific/Chapel/holylight.rsi

# --- Entities/Objects/Specific/Mail/Items/boxes.yml ---
# Old BodyPart entities (HeadHuman, TorsoSlime, ...) are replaced here by the
# organ-based body system, so the kits are filled with the equivalent Organ* parts.
- type: entity
  name: Build-a-Buddy kit
  suffix: Human
  parent: BoxHug
  id: BoxBuildABuddyHuman
  description: "\"Henry the Human\" Build-a-Buddy kit. Some assembly required."
  components:
  - type: StorageFill
    contents:
    - id: OrganHumanHead
    - id: OrganHumanTorso
    - id: OrganHumanArmLeft
    - id: OrganHumanArmRight
    - id: OrganHumanHandLeft
    - id: OrganHumanHandRight
    - id: OrganHumanLegLeft
    - id: OrganHumanLegRight
    - id: OrganHumanFootLeft
    - id: OrganHumanFootRight
  - type: Storage
    grid:
    - 0,0,4,3
    whitelist:
      components:
      - Organ

- type: entity
  name: Build-a-Buddy kit
  suffix: Slime
  parent: BoxBuildABuddyHuman
  id: BoxBuildABuddySlime
  description: "\"Steven the Slime\" Build-a-Buddy kit. Some assembly required."
  components:
  - type: StorageFill
    contents:
    - id: OrganSlimePersonHead
    - id: OrganSlimePersonTorso
    - id: OrganSlimePersonArmLeft
    - id: OrganSlimePersonArmRight
    - id: OrganSlimePersonHandLeft
    - id: OrganSlimePersonHandRight
    - id: OrganSlimePersonLegLeft
    - id: OrganSlimePersonLegRight
    - id: OrganSlimePersonFootLeft
    - id: OrganSlimePersonFootRight

