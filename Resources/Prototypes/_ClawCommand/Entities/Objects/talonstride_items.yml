# --- DeltaV/Entities/Objects/Consumable/Food/Containers/lunchbox.yml ---
# MeleeWeapon heavy-attack fields and the stamina-only DamageOtherOnHit don't
# exist in this fork and are dropped.
- type: entity
  id: LunchboxGeneric
  parent: [ BoxCardboard, BaseBagOpenClose ]
  name: lunchbox
  description: For on-the-go meal carrying needs.
  components:
  - type: Sprite
    sprite: DeltaV/Objects/Storage/lunchbox.rsi
    layers:
    - state: generic
    - state: generic-open
      map: ["openLayer"]
  - type: Item
    size: Large
    shape: null
    sprite: DeltaV/Objects/Storage/lunchbox.rsi
    heldPrefix: generic
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,1,2
    - 3,0,4,2 # Claw Command - source had an inverted `3,0,1,2` box (left > right), which fails to load here
  - type: PhysicalComposition
    materialComposition:
      Plastic: 100
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 5.5
    angle: 80.5
    soundHit:
      path: "/Audio/Weapons/click.ogg"
  - type: StaticPrice # Claw Command - above its 100 plastic
    price: 25

- type: entity
  parent: LunchboxGeneric
  id: LunchboxMedical
  suffix: Medical
  components:
  - type: Sprite
    layers:
    - state: medical
    - state: medical-open
      map: [ "openLayer" ]
  - type: Item
    heldPrefix: medical

- type: entity
  parent: LunchboxGeneric
  id: LunchboxSyndicate
  suffix: Syndicate
  components:
  - type: Sprite
    layers:
    - state: syndicate
    - state: syndicate-open
      map: [ "openLayer" ]
  - type: Item
    heldPrefix: syndicate

# --- Corvax/Entities/Objects/Materials/Sheets/other.yml ---
# Printer paper stack. The Corvax printer and its SheetPrinter material are not
# ported (no machine here to consume it); stack prototype is in talonstride_misc.yml.
- type: entity
  parent: Paper
  id: SheetPrinter
  suffix: Full
  components:
  - type: Stack
    stackType: SheetPrinter
    baseLayer: base
    layerStates:
    - paper
    - paper
    - paper
  - type: Sprite
    state: paper
    layers:
    - state: paper
      map: ["base"]
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false

- type: entity
  parent: SheetPrinter
  id: SheetPrinter1
  suffix: Single
  components:
  - type: Stack
    stackType: SheetPrinter
    count: 1

# --- Entities/Objects/Weapons/Melee/spear.yml ---
# EmbedPassiveDamage doesn't exist here (dropped). Sharp is replaced by the Slicing
# tool quality, matching this fork's Spear. MeleeWeapon heavy-attack fields dropped.
# Solution comes from SolutionDart like the fork's Spear.
- type: entity
  name: salvage harpoon
  parent: [ BaseItem, SolutionDart ]
  id: SalvageHarpoon
  description: A spear made of refined steel produced for salvage and hunting purposes. Hunters fancy it when it comes to hunting various carp species.
  components:
  - type: Tool
    qualities:
    - Slicing
  - type: EmbeddableProjectile
    offset: 0.15,0.15
  - type: ThrowingAngle
    angle: 225
  - type: LandAtCursor
  - type: Tag
    tags:
    - Spear
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.40,-0.30
          - -0.30,-0.40
          - 0.40,0.30
          - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    sprite: _DEN/Objects/Weapons/Melee/harpoon.rsi
    layers:
    - state: spear
    - state: spear1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: MeleeWeapon
    wideAnimationRotation: -135
    range: 1.75
    damage:
      types:
        Piercing: 10
        Slash: 2
    maxTargets: 3
    angle: 20
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 16
  - type: Item
    size: Ginormous
    shape:
    - 0,0,0,6
    storedRotation: -45
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: MeleeChemicalInjector
    solution: melee
  - type: RefillableSolution
    solution: melee
  - type: InjectableSolution
    solution: melee
  - type: SolutionInjectOnEmbed
    transferAmount: 1
    solution: melee
  - type: SolutionTransfer
    maxTransferAmount: 1
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 3
        Slash: 3
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5
  - type: UseDelay
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: spear

# --- DeltaV/Entities/Objects/Weapons/Guns/Projectiles/toy_projectiles.yml ---
- type: entity
  id: BulletBB
  name: BB
  description: Don't shoot your eye out.
  parent: BaseItem
  components:
  - type: Item
    size: Tiny
  - type: Reflective
  - type: Appearance
  - type: FlyBySound
  - type: Sprite
    sprite: DeltaV/Objects/Weapons/Guns/Ammunition/Boxes/bbgun.rsi
    layers:
    - state: bbbullet
  - type: Tag
    tags:
    - BulletBB
    - Trash
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0.1
    angularDamping: 0.1
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.01
        density: 1
        mask:
        - ItemMask
        restitution: 0.3 #bounce
        friction: 0.2
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: False
  - type: TileFrictionModifier
    modifier: 0.01
  - type: Projectile
    impactEffect: BulletImpactEffect
    deleteOnCollide: false
    onlyCollideWhenShot: true
    damage:
      types:
        Blunt: 1
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: Ammo
    muzzleFlash: null
  - type: PhysicalComposition
    materialComposition:
      Steel: 1
  - type: SpaceGarbage

