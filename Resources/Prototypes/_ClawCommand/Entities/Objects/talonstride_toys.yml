# Ported from space/ for the TalonStride map.

# --- _Floof/Entities/Objects/Fun/toys.yml ---
# Sprites already exist in _Floof/Objects/Fun/floof_plush.rsi.
- type: entity
  parent: PlushieHuman
  id: PlushieArachneNobility
  name: Arachne Nobility Plushie
  description: Soft as spider silk, this arachne plushie is here to be of assistance. Do not poke, submit to them poking you instead!
  components:
  - type: Sprite
    sprite: _Floof/Objects/Fun/floof_plush.rsi
    state: noblearachne
  - type: UseDelay
    delay: 3.0
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Voice/Human/womanlaugh.ogg
      params:
        volume: 2
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Voice/Arachnid/arachnid_laugh.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Voice/Human/womanlaugh.ogg
      params:
        volume: 2
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Voice/Arachnid/arachnid_laugh.ogg
      params:
        variation: 0.05
        volume: 4

# Source used /Audio/_Floof/Voice/Rodentia/Rat_Scream_01.ogg (not in this fork,
# no attribution in source); substituted with the existing mouse squeak.
- type: entity
  parent: PlushieHuman
  id: PlushieBunnyChiefMedicalOfficer
  name: bunny chief medical officer
  description: This plushie smells like carrots and has an aura of non-violence
  components:
  - type: Sprite
    sprite: _Floof/Objects/Fun/floof_plush.rsi
    state: CMObun
  - type: UseDelay
    delay: 3.0
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Items/Toys/mousesqueek.ogg
      params:
        volume: 2
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Animals/mouse_squeak.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Items/Toys/mousesqueek.ogg
      params:
        volume: 2
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Animals/mouse_squeak.ogg
      params:
        variation: 0.05
        volume: 4

- type: entity
  parent: PlushieHuman
  id: PlushieChillHuman
  name: chill human plushie
  description: It's just a chill lill dude.
  components:
  - type: Sprite
    sprite: _Floof/Objects/Fun/floof_plush.rsi
    state: chill

# Source yap path was /Audio/_Floof/Voice/Vulpkanin/yap.ogg; this fork has it at
# /Audio/Voice/Vulpkanin/yap.ogg.
- type: entity
  parent: PlushieHuman
  id: PlushieERTFox
  name: ERT fox plushie
  description: Smells faintly of coffee and sterile surgical tools. She looks tired...
  components:
  - type: Sprite
    sprite: _Floof/Objects/Fun/floof_plush.rsi
    state: ertfox
  - type: UseDelay
    delay: 3.0
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Items/hypospray.ogg
      params:
        volume: 2
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Voice/Vulpkanin/yap.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Items/hypospray.ogg
      params:
        volume: 2
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Voice/Vulpkanin/yap.ogg
      params:
        variation: 0.05
        volume: 4

- type: entity
  parent: PlushieHuman
  id: PlushieGrumpyQuartermaster
  name: Grumpy Quartermaster plushie
  description: A plushie of a human cargonian, looks unimpressed. Smells like oak.
  components:
  - type: Sprite
    sprite: _Floof/Objects/Fun/floof_plush.rsi
    state: grumpyqm
  - type: UseDelay
    delay: 3.0
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Items/Lighters/zippo_open.ogg
      params:
        volume: 1
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/kaching.ogg
      params:
        volume: 1
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Items/Lighters/zippo_open.ogg
      params:
        volume: 1
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/kaching.ogg
      params:
        volume: 1

- type: entity
  parent: PlushieHuman
  id: PlushieHos
  name: Head of security plushie
  description: The person under the suit no longer matters, this plushie represents the ideal head of security form.
  components:
  - type: Sprite
    sprite: _Floof/Objects/Fun/floof_plush.rsi
    state: moss
  - type: UseDelay
    delay: 2.0
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Items/drink.ogg
      params:
        volume: 1
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/egloves.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Items/drink.ogg
      params:
        volume: 1
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/egloves.ogg
      params:
        variation: 0.05
        volume: 4

