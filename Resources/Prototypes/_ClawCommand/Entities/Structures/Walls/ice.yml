# Claw Command - ice wall spawned by the void heretic ascension aura (AristocratSystem.IceWallPrototype).
# Upstream deleted WallIce and its ice.rsi (and map-migrates WallIce -> WallRockSnow), so this restores the
# pre-merge WallIce under a fork id: 300 damage to break, leaves a girder.
- type: entity
  parent: [ BaseWall, BaseStructureHealth ]
  id: WallIceVoid
  name: ice wall
  components:
  - type: Sprite
    sprite: _ClawCommand/Structures/Walls/ice.rsi
  - type: Icon
    sprite: _ClawCommand/Structures/Walls/ice.rsi
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    states:
    - !type:CornerSpriteSmoothing
      mask: [ walls ]
      base: ice
