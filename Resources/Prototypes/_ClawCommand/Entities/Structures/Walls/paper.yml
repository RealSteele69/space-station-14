- type: entity
  parent: [ BaseWall, StructureHealthWallWeak ] # Claw Command - BaseWall lost Damageable/Injurable in the upstream structure rebalance; WallWeak = 150, matching the girder threshold below
  id: WallPaper
  name: paper wall
  description: Helps to contain the repeated screams of martial artists.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Walls/paper.rsi
  - type: Icon
    sprite: Nyanotrasen/Structures/Walls/paper.rsi
  - type: Construction
    graph: Girder
    node: paperWall
  - type: Damageable # Claw Command - formerly inherited from BaseStructureWall (StructuralMetallic)
    damageModifierSet: SteelStaticMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: walls
    states:
    - !type:CornerSpriteSmoothing
      mask: [ walls ]
      base: paperwall
