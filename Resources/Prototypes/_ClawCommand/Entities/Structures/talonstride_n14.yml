#region Wells

- type: entity
  id: N14WellBoarded
  name: boarded well
  description: It's a well that's been boarded up. Maybe a crowbar will reveal its secrets.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Misc/well.rsi
    noRot: true
    state: well
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: Tag
    tags:
    - Structure
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.60,-0.4,0.6,0.7"
        density: 190
        mask:
        - MachineMask
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable

# Claw Command - source used SolutionContainerManager with named `tank`/`drainBuffer` solutions.
# This fork uses solution-entity composition: the well *is* its `tank` solution (SolutionTank),
# like vanilla StorageTank. The unused drainBuffer was dropped, as was SolutionRegeneration's
# `solution:` field (it now regenerates the entity's own Solution).
- type: entity
  parent: [ N14WellBoarded, SolutionTank ]
  id: N14WellWaterClean
  name: water well
  description: A well. Hopefully it's got some water at the bottom. Let's hope it's clean.
  suffix: Clean
  components:
  - type: Sprite
    state: wellwheel
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.50,-0.6,0.7,0.55"
        density: 190
        mask:
        - MachineMask
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
  - type: Solution
    solution:
      maxVol: 500
      reagents:
      - ReagentId: Water
        Quantity: 500
  - type: DrainableSolution
    solution: tank
  - type: ReagentTank
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 1

#endregion
#region Windows

- type: entity
  parent: BaseStructure
  id: N14WindowBase # use for single tile / standalone windows & broken windows
  description: A window for seeing into places.
  abstract: true
  name: window
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: WallMount
    arc: 360 # interact despite grilles
  - type: Tag
    tags:
    - ForceFixRotations
    - Window
    # Claw Command - WeldbotFixableStructure tag dropped (doesn't exist in this fork)
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb {}
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Damageable
    damageModifierSet: GlassMod
  - type: Injurable
    damageContainer: Inorganic
  - type: ExaminableDamage
    messages: WindowMessages
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150 #excess damage (nuke?). avoid computational cost of spawning entities.
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Appearance

- type: entity
  parent: N14WindowBase
  id: N14WindowHouseWoodBroken
  suffix: wood, broken
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Windows/window_ruins.rsi
    state: woodwindowbroken
  - type: Icon
    sprite: _Nuclear14/Structures/Windows/window_ruins.rsi
    state: woodwindowbroken

#endregion
