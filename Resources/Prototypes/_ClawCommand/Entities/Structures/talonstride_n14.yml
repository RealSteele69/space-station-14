#region Closets

- type: entity
  parent: [ N14ClosetBase, StructureHealthContainerWeak ] # Claw Command - this fork's ClosetBase carries no health; mirrors ClosetSteelBase
  id: N14ClosetBaseW
  name: closet
  description: A basic closet for storing things.
  components:
  - type: Weldable
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Sprite
    noRot: true
    sprite: _Nuclear14/Structures/Storage/Closets/closet.rsi
    layers:
    - state: closet
      map: ["enum.StorageVisualLayers.Base"]
    - state: closet_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    # Claw Command - label layer driven by ClosetBase's GenericVisualizer
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: EntityStorageVisuals
    stateBaseClosed: closet
    stateDoorOpen: closet_open
    stateDoorClosed: closet_door

- type: entity
  parent: N14ClosetBaseW
  id: N14ClosetSafe
  name: safe
  description: Might be filled with valuables.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Storage/Furniture/safe.rsi

- type: entity
  parent: N14ClosetSafe
  id: N14LootClosetSafe
  suffix: Loot, Random Military # Claw Command - empty: no fill defined in the source either

- type: entity
  parent: [ BaseWallmountMetallic, StructureHealthContainerWeak ] # Claw Command - parented like vanilla BaseWallCloset (source had no parent)
  id: N14ClosetWallMedicabinet
  name: medicabinet
  description: A medicabinet mounted on the wall.
  components:
  - type: ResistLocker
  - type: Weldable
  - type: WallMount
    arc: 180
  - type: Transform
    noRot: false
  - type: Sprite
    drawdepth: WallMountedItems
    noRot: false
    sprite: _Nuclear14/Structures/Storage/Closets/medicabinet.rsi
    layers:
    - state: closet
      map: ["enum.StorageVisualLayers.Base"]
    - state: closet_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
  - type: EntityStorage
    isCollidableWhenOpen: true
    enteringOffset: 0, -0.75
    closeSound:
      path: /Audio/Items/deconstruct.ogg
    openSound:
      path: /Audio/Items/deconstruct.ogg
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
        ents: []
  # Claw Command - added so the door opens visually (source lacked storage visuals)
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: closet
    stateDoorOpen: closet_open
    stateDoorClosed: closet_door
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1

- type: entity
  parent: N14ClosetWallMedicabinet
  id: N14LootClosetWallMedicabinet
  suffix: Loot, Medical, Random # Claw Command - empty: no fill defined in the source either

