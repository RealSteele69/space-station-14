# Ported from space/ (Nuclear14 via Floof) for the TalonStride map.
# Source: Resources/Prototypes/_Nuclear14/Entities/Structures/** in the `space` tree.
# Only the entities TalonStride places, plus the parents they need, are brought over.
#
# Claw Command - general adaptations applied throughout this file:
# - Damageable `damageContainer` moved to the separate Injurable component (this fork's split).
# - Legacy damage modifier sets (Wood/Metallic/Rock/Glass, "may be removed" per
#   material_old.yml) swapped for this fork's current WoodMod/SteelMod/RockMod/GlassMod.
# - Sprite `netsync: false` dropped (obsolete field).
# - Construction graphs that don't exist here (N14Bed, N14DoorGraph, N14WoodWall, BarCounter)
#   are omitted, so these pieces are non-constructible decor, as with n14_furniture.yml.
# - The N14 "Loot"/"Refilling" closets have no fill in the source either (TODO in N14),
#   so they are ported as empty containers.
# Sprites already live under Resources/Textures/_Nuclear14/Structures/.

#region Beds

- type: entity
  parent: N14Bed
  id: N14BedWood
  name: wooden bed
  description: A bed with a wooden frame.
  components:
  - type: Sprite
    state: bed_wood

- type: entity
  parent: N14Bed
  id: N14BedMattressDirty1
  name: mattress
  description: A mattress on the floor. A little rough.
  components:
