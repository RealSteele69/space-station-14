#region Slanted walls

# Claw Command - source defined this on BaseStructure with a `Wall` tag; this fork marks walls
# with the Wall component instead (no `Wall` tag exists), so it now builds on vanilla BaseWall,
# which carries the same wall components (Wall, Airtight, Occluder, RadiationBlocker,
# BlockWeather, RangedDamageSound, PlacementReplacement). No Damageable = indestructible.
- type: entity
