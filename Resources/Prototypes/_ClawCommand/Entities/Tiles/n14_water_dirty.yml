# Dirty water tile entity ported from N14 for asterisk map.
- type: entity
  id: N14FloorWaterDirtyEntity
  name: water
  description: A real thirst quencher.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: FloorOccluder
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: _ClawCommand/Tiles/Planet/water.rsi # Claw Command - upstream deleted Tiles/Planet/water.rsi; restored copy (CC-BY-SA-3.0)
    drawdepth: BelowFloor
    layers:
      - state: shoreline_water
  - type: Solution
    id: pool
    solution:
      maxVol: 9999999
      reagents:
      - ReagentId: Water
        Quantity: 9999999
  - type: DrainableSolution
    solution: pool
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWater
      params:
        volume: 8
