# Plant entities for Goob-Station seeds, modernised from - type: seed prototypes.
# BluespaceTomatoPlants is its own plant (Singulo chemistry); it is not upstream's BlueTomatoPlants.

- type: entity
  parent: BasePlant
  id: StrangeBerryPlants
  categories: [HideSpawnMenu]
  name: strange berry bush
  components:
  - type: Sprite
    sprite: _GoobStation/Objects/Specific/Hydroponics/strange_berries.rsi
  - type: PlantData
    name: seeds-strange-berries-name
    packetPrototype: StrangeBerrySeeds
    productPrototypes: [ FoodStrangeBerries ]
  - type: Plant
    lifespan: 50
    maturation: 6
    production: 6
    yield: 4
  - type: PlantGrowth
    nutrientConsumption: 0.6
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantChemicals
    chemicals:
      Artifexium:
        min: 2
        max: 5
        potencyDivisor: 30
      Vitamin:
        min: 1
        max: 4
        potencyDivisor: 40

- type: entity
  parent: BasePlant
  id: MangoPlants
  categories: [HideSpawnMenu]
  name: mango tree
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Kitchen/Plants/mango.rsi
  - type: PlantData
    name: seeds-mango-name
    packetPrototype: MangoSeeds
    productPrototypes: [ FoodMango ]
  - type: Plant
    lifespan: 55
    maturation: 6
    production: 6
    yield: 3
    potency: 10
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantChemicals
    chemicals:
      Nutriment:
        min: 1
        max: 5
        potencyDivisor: 20
      Vitamin:
        min: 1
        max: 4
        potencyDivisor: 25

- type: entity
  parent: BasePlant
  id: BluespaceTomatoPlants
  categories: [HideSpawnMenu]
  name: bluespace tomato plant
  components:
  - type: Sprite
    sprite: _GoobStation/Objects/Specific/Hydroponics/bluespace_tomato.rsi
  - type: PlantData
    name: seeds-bluespace-tomato-name
    packetPrototype: BluespaceTomatoSeeds
    productPrototypes: [ FoodBluespaceTomato ]
  - type: Plant
    lifespan: 25
    maturation: 8
    production: 6
    yield: 2
    potency: 10
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantGrowth
    waterConsumption: 0.5
    nutrientConsumption: 0.6
  - type: PlantAtmospheric
    lowHeatTolerance: 288 # 15°C
    highHeatTolerance: 308 # 35°C
  - type: PlantChemicals
    chemicals:
      Nutriment:
        min: 1
        max: 3
        potencyDivisor: 20
      Singulo:
        min: 1
        max: 10
        potencyDivisor: 10
