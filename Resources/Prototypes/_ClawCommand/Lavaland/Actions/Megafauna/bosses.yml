#
# Attacks used by the lavaland megafauna and elite AI.
# Every action is both entity- and world-targeted, so attacks can track the picked target.

- type: entity
  parent: BaseAction
  id: ActionBaseMegafaunaAttack
  name: megafauna attack
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 4
    checkCanInteract: false
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _ClawCommand/Lavaland/Mobs/Bosses/96x96.rsi
    layers:
    - state: dragon
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    checkCanAccess: false
    range: 40
  - type: EntityTargetAction
  - type: WorldTargetAction

# ---------------------------------------------------------------------------
# Ash drake
# ---------------------------------------------------------------------------

- type: entity
  parent: ActionBaseMegafaunaAttack
  id: ActionAshDrakeFireBreath
  name: Fire Breath
  description: Breathe a cone of fire at the target.
  components:
  - type: Action
    useDelay: 5
    sound:
      path: /Audio/Animals/space_dragon_breath.ogg
  - type: WorldTargetAction
    event: !type:MegafaunaProjectileActionEvent
      projectile: MegafaunaProjectileAshDrakeFlame
      count: 3
      spread: 30
      jitter: 6
      volleys: 12
      volleyDelay: 0.07
      projectileSpeed: 11

- type: entity
  parent: ActionBaseMegafaunaAttack
  id: ActionAshDrakeFireballs
  name: Fireball Volley
  description: Spit a fan of fireballs.
  components:
  - type: Action
    useDelay: 6
    sound:
      path: /Audio/Magic/fireball.ogg
  - type: WorldTargetAction
    event: !type:MegafaunaProjectileActionEvent
      projectile: MegafaunaProjectileAshDrakeFireball
      count: 5
      spread: 50
      volleys: 2
      volleyDelay: 0.5
      projectileSpeed: 9

- type: entity
  parent: ActionBaseMegafaunaAttack
  id: ActionAshDrakeSwoop
  name: Swoop
  description: Take to the sky and crash down on the target.
  components:
  - type: Action
    useDelay: 14
  - type: AngerDelayAction
    minDelay: 7
    maxDelay: 14
    inverse: true
  - type: WorldTargetAction
    event: !type:MegafaunaSwoopActionEvent
      shadow: MegafaunaAshDrakeShadow
      landSpawn: AshDrakeShapeLanding
      trackTime: 1.8
      lockTime: 0.7
      shadowSpeed: 8
      landRadius: 1.8
      knockbackDistance: 4
      knockdownTime: 1.5
      landDamage:
        types:
          Blunt: 25
      takeoffSound:
        path: /Audio/Animals/space_dragon_roar.ogg
      landSound:
        path: /Audio/_ClawCommand/Lavaland/Effects/meteorimpact.ogg

- type: entity
  parent: ActionBaseMegafaunaAttack
  id: ActionAshDrakeFireRain
  name: Fire Rain
  description: Rain fire around the target.
  components:
  - type: Action
    useDelay: 10
    sound:
      path: /Audio/Animals/space_dragon_roar.ogg
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: AshDrakeShapeFireRain

- type: entity
  parent: ActionBaseMegafaunaAttack
  id: ActionAshDrakeFireRing
  name: Lava Ring
  description: Surround yourself with an expanding ring of fire.
  components:
  - type: Action
    useDelay: 16
    sound:
      path: /Audio/Magic/fireball.ogg
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: AshDrakeShapeFireRing
      spawnAtUser: true

# ---------------------------------------------------------------------------
# Bubblegum
# ---------------------------------------------------------------------------

- type: entity
  parent: ActionBaseMegafaunaAttack
  id: ActionBubblegumCharge
  name: Charge
  description: Charge at the target.
  components:
  - type: Action
    useDelay: 5
  - type: Sprite
    sprite: _ClawCommand/Lavaland/Mobs/Bosses/96x96.rsi
    layers:
    - state: bubblegum
      map: ["enum.ActionVisuals.Icon"]
  - type: WorldTargetAction
    event: !type:MegafaunaChargeActionEvent
      windUp: 0.7
      chargeSpeed: 15
      overshoot: 3
      maxDistance: 14
      hitRadius: 1.4
      knockbackDistance: 3
      knockdownTime: 1
      windUpSpawn: MegafaunaWindUpEffect
      trailSpawn: MegafaunaBloodTrail
      damage:
        types:
          Blunt: 20
          Slash: 10
      windUpSound:
        path: /Audio/Effects/demon_attack1.ogg
      hitSound:
        path: /Audio/Weapons/smash.ogg

- type: entity
  parent: ActionBubblegumCharge
  id: ActionBubblegumTripleCharge
  name: Triple Charge
  description: Charge at the target three times in a row.
  components:
  - type: Action
    useDelay: 10
  - type: WorldTargetAction
    event: !type:MegafaunaChargeActionEvent
      windUp: 0.6
      chainWindUp: 0.35
      charges: 3
      chargeSpeed: 17
      overshoot: 3
      maxDistance: 14
      hitRadius: 1.4
      knockbackDistance: 3
      knockdownTime: 1
      windUpSpawn: MegafaunaWindUpEffect
      trailSpawn: MegafaunaBloodTrail
      damage:
        types:
          Blunt: 18
          Slash: 8
      windUpSound:
        path: /Audio/Effects/demon_attack1.ogg
      hitSound:
        path: /Audio/Weapons/smash.ogg

- type: entity
  parent: ActionBaseMegafaunaAttack
  id: ActionBubblegumHandSlams
  name: Hand Slams
  description: Grasping hands burst from the ground around the target.
  components:
  - type: Action
    useDelay: 7
  - type: Sprite
    sprite: _ClawCommand/Lavaland/Mobs/Bosses/96x96.rsi
    layers:
    - state: bubblegum
      map: ["enum.ActionVisuals.Icon"]
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: BubblegumShapeHandSlams

- type: entity
  parent: ActionBaseMegafaunaAttack
  id: ActionBubblegumBloodWarp
  name: Blood Warp
  description: Sink into the blood and resurface next to the target.
  components:
  - type: Action
    useDelay: 12
    sound:
      path: /Audio/Effects/demon_consume.ogg
  - type: Sprite
    sprite: _ClawCommand/Lavaland/Mobs/Bosses/96x96.rsi
    layers:
    - state: bubblegum
      map: ["enum.ActionVisuals.Icon"]
  - type: AngerDelayAction
    minDelay: 6
    maxDelay: 12
    inverse: true
  - type: WorldTargetAction
    event: !type:MegafaunaBlinkActionEvent

