- type: entity
  parent: BaseAction
  id: ActionTogglePKALight
  name: Toggle PKA Light
  description: Toggle the PKA light on and off.
  components:
  - type: Action
    useDelay: 0.5
  - type: Sprite
    sprite: Objects/Tools/seclite.rsi
    layers:
    - state: seclite
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ToggleActionEvent
