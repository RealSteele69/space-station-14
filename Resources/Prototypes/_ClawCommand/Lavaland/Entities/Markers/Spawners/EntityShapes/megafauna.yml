      size: 6
  - type: ShapeSpawnerCounter
    spawnPeriod: 0.8
  - type: AngerShapeSpawner
    counterRange: 1,3
  - type: ExpandingShapeSpawner

# --- Legion ---

- type: entity
  parent: MegafaunaShapeBase
