- type: entity
  name: ash drake
  id: LavalandBossAshDrake
  parent: LavalandMobBase
  description: Guardian of the Necropolis.
  components:
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-1,1,1"
        density: 1000
        mask:
        - LargeMobMask
        layer:
        - LargeMobLayer
  - type: NpcFactionMember
    factions:
    - Lavafauna
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        10
      AggroVisionRadius: !type:Single
        14
      NavSmash: !type:Bool
        true
  - type: Sprite
    drawdepth: Mobs
    sprite: _ClawCommand/Lavaland/Mobs/Bosses/96x96.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: dragon
  - type: DamageStateVisuals
    states:
      Alive:
        Base: dragon
      Dead:
        Base: dragon_dead
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MegafaunaVisuals.Airborne:
        enum.DamageStateVisualLayers.Base:
          True: { visible: false }
          False: { visible: true }
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Slash: 20
        Structural: 150
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  - type: Butcherable
    spawned:
    - id: FireballSpellbook
      amount: 1
  - type: Damageable
    damageModifierSet: Hierophant
  - type: Injurable
    damageContainer: Inorganic
  - type: TileMovement
  - type: BossMusic
    soundId: AshDrake
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  - type: CombatPower # Goobstation
    factor: 25 # times more dangerous than a crew-member
  # Megafauna AI
  - type: Fauna
  - type: ActionGrant
    actions:
    - ActionAshDrakeFireBreath
    - ActionAshDrakeFireballs
    - ActionAshDrakeSwoop
    - ActionAshDrakeFireRain
    - ActionAshDrakeFireRing
  - type: MegafaunaAi
    actionDelay: 0.6
    startingDelay: 1.0
    selector: !type:NestedMegafaunaSelector
      id: AshDrake
  - type: MegafaunaAggroRadius
    radius: 9
  - type: Anger
    totalHp: 2500
  - type: AngerPlayerScaling
    angerScale: 1.1
    hpScale: 1.2
  - type: MobPhases
    phaseThresholds:
      0: 1
      1000: 2
      1800: 3
  - type: MegafaunaGodmode
  - type: MegafaunaRejuvenate
  - type: DamageSquareImmunity
  - type: SpawnLootOnDeath
    table: !type:AllSelector
      children:
      - id: LavalandCrateNecropolisFilled
      - id: CrusherUpgradeBladeLavaAspect
      - id: LavalandDrakeFangNecklace # trophy cosmetic
