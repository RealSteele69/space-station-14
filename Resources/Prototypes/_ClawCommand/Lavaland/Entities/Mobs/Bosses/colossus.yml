- type: entity
  name: Colossus
  id: LavalandBossColossus
  parent: LavalandMobBase
  description: A monstrous creature protected by heavy shielding.
  components:
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-2,1,1"
        density: 1000
        mask:
        - LargeMobMask
        layer:
        - LargeMobLayer
  - type: NpcFactionMember
    factions:
    - Lavafauna
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: Sprite
    drawdepth: Mobs
    sprite: _ClawCommand/Lavaland/Mobs/Bosses/96x96.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: eva
  - type: BatteryAmmoProvider
    proto: BulletKineticShuttle
    fireCost: 50
  - type: BatterySelfRecharger
    autoRechargeRate: 50
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: Gun
    projectileSpeed: 20
    fireRate: 0.65
    useKey: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/plasma_cutter.ogg
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/demon_attack1.ogg
    damage:
      types:
        Blunt: 20
        Slash: 15
        Structural: 150
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  - type: Damageable
    damageModifierSet: Hierophant
  - type: Injurable
    damageContainer: Inorganic
  - type: Advertise
    pack: ColossusWords
    minimumWait: 15
    maximumWait: 40
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/_ClawCommand/Lavaland/Effects/meteorimpact.ogg
      params:
        volume: 5
  - type: TileMovement
  - type: BossMusic
    soundId: Colossus
  - type: CombatPower # Goobstation
    factor: 25 # times more dangerous than a crew-member
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  # Megafauna AI
  - type: Fauna
  - type: ActionGrant
    actions:
    - ActionColossusShotgun
    - ActionColossusBlast
    - ActionColossusSpiral
    - ActionColossusCrystalCross
    - ActionColossusJudgement
  - type: MegafaunaAi
    actionDelay: 0.6
    startingDelay: 1.0
    selector: !type:NestedMegafaunaSelector
      id: Colossus
  - type: MegafaunaAggroRadius
    radius: 10
  - type: Anger
    totalHp: 2500
  - type: AngerPlayerScaling
    angerScale: 1.1
    hpScale: 1.2
  - type: MobPhases
    phaseThresholds:
      0: 1
      1000: 2
      1900: 3
  - type: MegafaunaGodmode
  - type: MegafaunaRejuvenate
  - type: DamageSquareImmunity
  - type: SpawnLootOnDeath
    table: !type:AllSelector
      children:
      - id: LavalandCrateNecropolisFilled
      - id: CrusherUpgradeBladeIceFrost
      - id: LavalandColossusCoreNecklace # trophy cosmetic
