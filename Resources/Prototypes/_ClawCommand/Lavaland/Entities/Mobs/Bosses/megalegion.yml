- type: entity
  name: Legion
  id: LavalandBossMegaLegion
  parent: LavalandMobBase
  description: One of many.
  components:
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_ClawCommand/Lavaland/Mobs/legion_spawn.ogg
      params:
          volume: 5
          maxDistance: 30
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask:
        - LargeMobMask
        layer:
        - LargeMobLayer
  - type: NpcFactionMember
    factions:
    - Lavafauna
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        10
      AggroVisionRadius: !type:Single
        14
      NavSmash: !type:Bool
        true
  - type: Sprite
    drawdepth: Mobs
    sprite: _ClawCommand/Lavaland/Mobs/Bosses/96x96.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: mega_legion
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      collection: AlienClaw
    animation: WeaponArcBite
    damage:
        types:
          Blunt: 35
          Structural: 200
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 5
  - type: MobThresholds
    thresholds:
      0: Alive
      700: Dead
  - type: Damageable
    damageModifierSet: Hierophant
  - type: Injurable
    damageContainer: Inorganic
  - type: TileMovement
  - type: BossMusic
    soundId: AshDrake
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  - type: CombatPower # Goobstation
    factor: 25 # times more dangerous than a crew-member
  # Megafauna AI
  - type: Fauna
  - type: ActionGrant
    actions:
    - ActionLegionSummonSkulls
    - ActionLegionCharge
    - ActionLegionBileSpray
  - type: MegafaunaAi
    actionDelay: 0.6
    startingDelay: 1.0
    selector: !type:NestedMegafaunaSelector
      id: Legion
  - type: MegafaunaAggroRadius
    radius: 9
  - type: Anger
    totalHp: 700
  - type: AngerPlayerScaling
    angerScale: 1.1
    hpScale: 1.2
  - type: MobPhases
    phaseThresholds:
      0: 1
      350: 2
  - type: MegafaunaGodmode
  - type: MegafaunaRejuvenate
  - type: DamageSquareImmunity
  - type: SpawnLootOnDeath
    deleteOnDeath: true # splits into lesser legions
    table: !type:AllSelector
      children:
      - id: LavalandCrateNecropolisFilled
      - id: CrusherUpgradeBladeSharpness
      - id: MobLegion
        amount: 2
      - id: LavalandLegionSkullNecklace # trophy cosmetic
