- type: entity
  name: Elite
  id: LavalandEliteBase
  abstract: true
  parent: LavalandMobBase
  description: An elite monster, found in one of the strange tumors on lavaland.
  components:
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: NpcFactionMember
    factions:
    - Lavafauna
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        8
      AggroVisionRadius: !type:Single
        12
      NavSmash: !type:Bool
        true
  - type: Sprite
    drawdepth: Mobs
    sprite: _ClawCommand/Lavaland/Mobs/Elites/32x64.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: legionnaire
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      path: /Audio/Effects/demon_attack1.ogg
    animation: WeaponArcBite
    damage:
        types:
          Slash: 10
          Blunt: 10
          Structural: 50
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 2.5
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Dead
  - type: Damageable
    damageModifierSet: Hierophant
  - type: Injurable
    damageContainer: Inorganic
  - type: TileMovement
  - type: BossMusic
    soundId: Miniboss
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  - type: CombatPower # Goobstation
    factor: 8 # times more dangerous than a crew-member
  - type: Fauna
  - type: SpawnLootOnDeath
    table: !type:AllSelector
      children:
      - !type:NestedSelector
        tableId: CrusherUpgradesHandle
      - !type:NestedSelector
        tableId: LavalandMaterialRare
      - id: LavalandTumorShardNecklace # trophy cosmetic

- type: entity
  name: Legionnaire
  id: LavalandEliteLegionnaire
  parent: LavalandEliteBase
  description: A towering skeleton, embodying the terrifying power of Legion.
  components:
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Sprite
    drawdepth: Mobs
    sprite: _ClawCommand/Lavaland/Mobs/Elites/32x64.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: legionnaire
  - type: DamageStateVisuals
    states:
      Alive:
        Base: legionnaire
      Dead:
        Base: legionnaire_dead
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      path: /Audio/Effects/bite.ogg
    animation: WeaponArcBite
    damage:
        types:
          Slash: 25
          Blunt: 10
          Structural: 50
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 2.5
  - type: BossMusic
    soundId: Miniboss
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Dead
  - type: Damageable
    damageModifierSet: Hierophant
  - type: Injurable
    damageContainer: Inorganic
  - type: ActionGrant
    actions:
    - ActionLegionnaireCharge
    - ActionLegionnaireSummonSkulls
  - type: MegafaunaAi
    actionDelay: 0.6
    startingDelay: 1.0
    selector: !type:NestedMegafaunaSelector
      id: EliteLegionnaire
  - type: MegafaunaAggroRadius
    radius: 7
  - type: Anger
    totalHp: 1000
  - type: AngerPlayerScaling
    angerScale: 1.1
    hpScale: 1.15
  - type: MobPhases
    phaseThresholds:
      0: 1
      500: 2
  - type: MegafaunaGodmode
  - type: MegafaunaRejuvenate
  - type: DamageSquareImmunity

- type: entity
  id: LavalandElitePandora #Just a hierophant resprite, all of these are templates anyway.
  name: Pandora
  description: A large magic box with similar power and design to the Hierophant. Once it opens, it's not easy to close it.
  components:
  # Basic stuff
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.6,0.35,0.6"
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Clickable
  - type: InteractionOutline
  - type: InputMover
  - type: Input
    context: "human"
  - type: LagCompensation
  - type: MobMover
  - type: Actions
  - type: Appearance
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: DoAfter
  - type: Examiner
  - type: Eye
  - type: ContentEye
  - type: RequireProjectileTarget
    active: False
  - type: CombatMode
  - type: MobState
  # Actual boss from here
  - type: Damageable
    damageModifierSet: Hierophant
  - type: Injurable
    damageContainer: Inorganic
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _ClawCommand/Lavaland/Mobs/Elites/32x64.rsi
    state: pandora
  - type: DamageStateVisuals
    states:
      Alive:
        Base: pandora
      Dead:
        Base: pandora_dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 1.5
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Dead
  - type: Tag
    tags:
    - CannotSuicide
  - type: NoSlip
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  - type: BossMusic
    soundId: Hierophant
  - type: Fauna
  - type: ActionGrant
    actions:
    - ActionHierophantBox
    - ActionHierophantCrosses
    - ActionHierophantBlink
  - type: MegafaunaAi
    actionDelay: 0.8
    startingDelay: 1.0
    selector: !type:NestedMegafaunaSelector
      id: ElitePandora
  - type: MegafaunaBlink
    spawnOnTarget: HierophantShapeBlink
    spawnOnUsed: HierophantShapeBlink
  - type: MegafaunaAggroRadius
    radius: 7
  - type: Anger
    totalHp: 1000
  - type: AngerPlayerScaling
    angerScale: 1.1
    hpScale: 1.15
  - type: MobPhases
    phaseThresholds:
      0: 1
      500: 2
  - type: MegafaunaGodmode
  - type: MegafaunaRejuvenate
  - type: DamageSquareImmunity
  - type: SpawnLootOnDeath
    table: !type:AllSelector
      children:
      - !type:NestedSelector
        tableId: CrusherUpgradesMain
      - !type:NestedSelector
        tableId: LavalandMaterialRare
      - id: LavalandPandoraLatchNecklace # trophy cosmetic

- type: entity
