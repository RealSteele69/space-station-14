# Lavaland-tiered basilisk: a territorial beast whose ranged stare freezes its
# target in place. Reuses the vanilla basilisk sprite and its existing
# BasiliskRay projectile (Cold damage + ChangeTemperatureOnCollide) as-is, so
# no new components or projectiles were needed for the freeze gimmick.

- type: entity
  name: Basilisk
  id: LavalandMobBasilisk
  parent: LavalandMobBase
  description: A territorial beast, covered in a thick shell that absorbs energy. Its stare causes victims to freeze from the inside.
  components:
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: NpcFactionMember
    factions:
    - Lavafauna
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Asteroid/basilisk.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: basilisk
  - type: DamageStateVisuals
    states:
      Alive:
        Base: basilisk
      Dead:
        Base: basilisk_dead
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      path: /Audio/Effects/bite.ogg
    animation: WeaponArcBite
    damage:
        types:
          Slash: 15
          Piercing: 10
  - type: Gun
    projectileSpeed: 10
    fireRate: 0.75
    useKey: false
    selectedMode: SemiAuto
    showExamineText: false
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/syringe_gun.ogg
  - type: RechargeBasicEntityAmmo
    showExamineText: false
    rechargeCooldown: 0
    rechargeSound: null
  - type: BasicEntityAmmoProvider
    proto: BasiliskRay
    capacity: 1
    count: 1
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 3
  - type: MobThresholds
    thresholds:
      0: Alive
      300: Dead
  - type: Damageable
    damageModifierSet: Hierophant
  - type: Injurable
    damageContainer: Inorganic
  - type: Fauna
  - type: CombatPower # Goobstation
    factor: 4 # times more dangerous than a crew-member
