- type: entity
  id: MobLavalandGoliath
  parent: MobGoliath
  suffix: Lavaland
  components:
  - type: Sprite
    sprite: _ClawCommand/Lavaland/Mobs/goliath.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: goliath
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goliath
      Dead:
        Base: goliath_dead
  - type: NpcFactionMember
    factions:
    - Lavafauna
  - type: Fauna
  - type: HTN
    blackboard:
      VisionRadius: !type:Single # Highly aggressive
        8
      AggroVisionRadius: !type:Single
        9
      NavSmash: !type:Bool
        true

- type: entity
  id: MobLavalandGoliathAncient
  parent: MobGoliath
  name: ancient goliath
  suffix: Lavaland
  components:
  - type: Sprite
    sprite: _ClawCommand/Lavaland/Mobs/goliath.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: goliath_ancient
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goliath_ancient
      Dead:
        Base: goliath_ancient_dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 2.5
  - type: MeleeWeapon
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
    angle: 0
    attackRate: 0.75
    animation: WeaponArcPunch
    damage:
      types:
        Piercing: 10
        Slash: 15
  #- type: MobThresholds
  #  thresholds:
  #    0: Alive
  #    400: Dead
  - type: NpcFactionMember
    factions:
    - Lavafauna
  - type: Fauna
  - type: HTN
    blackboard:
      VisionRadius: !type:Single # Extremely aggressive
        9
      AggroVisionRadius: !type:Single
        10
      NavSmash: !type:Bool
        true
  - type: Butcherable
    spawned:
    - id: FoodMeatGoliath
      amount: 3
    - id: MaterialGoliathHide1
      amount: 3
    - id: MaterialBones1
      amount: 3

# Young goliath hatched by the broodmother elite.
- type: entity
  id: MobLavalandGoliathBrood
  parent: MobLavalandGoliath
  name: goliath brood
  description: A newly hatched goliath. Small, but already very angry.
  components:
  - type: Sprite
    scale: 0.6, 0.6
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: MeleeWeapon
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
    angle: 0
    attackRate: 1
    animation: WeaponArcPunch
    damage:
      types:
        Slash: 5
        Piercing: 3
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatGoliath
      amount: 1
  - type: TimedDespawn
    lifetime: 90
