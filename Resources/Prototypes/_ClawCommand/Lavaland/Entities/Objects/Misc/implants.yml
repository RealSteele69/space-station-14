- type: entity
  parent: BaseSubdermalImplant
  id: DeathRattleLavalandImplant
  name: lavaland death rattle implant
  description: This implant will inform the Supply radio channel should the user die. Works only on lavaland surface and tells the location of death.
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
      permanent: true
      whitelist:
        components:
        - MobState # admeme implanting a chair with rattle implant needs to give the chair mobstate so it can die first
    - type: MansusGraspBlockTrigger
    - type: TriggerBlocker
      mapWhitelist:
        components:
        - LavalandMap
    - type: TriggerOnMobstateChange
      mobState:
      - Dead
    # Claw Command: uses the shared rattle system, which reports the nearest nav beacon rather than raw coordinates.
    - type: RattleOnTrigger
      targetUser: true
      radioChannel: Supply

- type: entity
  id: DeathRattleLavalandImplanter
  suffix: Lavaland Death Rattle
  parent: BaseImplantOnlyImplanter
  components:
  - type: Implanter
    implant: DeathRattleLavalandImplant
