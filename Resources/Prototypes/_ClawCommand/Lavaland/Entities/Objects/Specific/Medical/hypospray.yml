- type: entity
  name: survival medipen
  parent: ChemicalMedipen
  id: SurvivalMedipen
  description: A cocktail of powerful healing chemicals. Slowly heals damage and stabilizes body temperature. You can overdose on these if you use more than one in quick succession.
  components:
  - type: Sprite
    sprite: _ClawCommand/Lavaland/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: survivalpen
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: survivalpen_empty
  - type: Solution # Claw Command - the inherited "hypospray" solution, sized up for the 40u dose
    solution:
      maxVol: 40
      reagents:
      - ReagentId: MinersSalve
        Quantity: 20
      - ReagentId: Leporazine
        Quantity: 10
      - ReagentId: Epinephrine
        Quantity: 10

# doesn't get any better than this
- type: entity
  name: luxury medipen
  parent: ChemicalMedipen
  id: LuxuryMedipen
  description: Contains powerful chemicals used to aid in exploration of harsh environments. Chemicals relatively harmful and not as effective when used outside of low pressure.
  components:
  - type: Sprite
    sprite: _ClawCommand/Lavaland/Objects/Specific/Medical/luxmedipen.rsi
    layers:
    - state: luxpen
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: luxpen_empty
  - type: Solution # Claw Command - the inherited "hypospray" solution, sized up for the 50u dose
    solution:
      maxVol: 50
      reagents:
      - ReagentId: Luxurium
        Quantity: 20
      - ReagentId: Leporazine
        Quantity: 10
      - ReagentId: Epinephrine
        Quantity: 10
      - ReagentId: TranexamicAcid
        Quantity: 10
