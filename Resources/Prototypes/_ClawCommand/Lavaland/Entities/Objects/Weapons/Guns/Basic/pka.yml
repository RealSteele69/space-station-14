# Proto-kinetic pistol / repeater / shotgun. Built on the shared WeaponProtoKineticAccelerator
# (Entities/Objects/Weapons/Guns/Basic/pka.yml), so they take the same PKAUpgrade modkits through its
# UpgradeableGun "upgrades" container.

# Pressure-scaled projectile damage, like the other lavaland kinetic weapons. Also what the space modkit
# (PKAUpgradeSpace) retunes.
- type: entity
  id: BaseWeaponProtoKineticLavaland
  abstract: true
  components:
  - type: PressureDamageChange
    applyToMelee: false
  - type: Gun
    fireRate: 0.8
    projectileSpeed: 25
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.5

- type: entity
  name: proto-kinetic shotgun
  id: WeaponProtoKineticShotgun
  parent: [ BaseWeaponProtoKineticLavaland, WeaponProtoKineticAccelerator ]
  description: Fires a spread of low-damage kinetic bolts that are half as effective for mining.
  components:
  - type: Sprite
    sprite: _ClawCommand/Lavaland/Objects/Weapons/Guns/Basic/kinetic_shotgun.rsi
    layers:
    - state: icon
    - state: animation-icon
      visible: false
      map: [ "empty-icon" ]
  - type: Clothing
    sprite: _ClawCommand/Lavaland/Objects/Weapons/Guns/Basic/kinetic_shotgun.rsi
  - type: BasicEntityAmmoProvider
    proto: PelletKineticSpread
  - type: GunRequiresWield
  - type: Item
    sprite: _ClawCommand/Lavaland/Objects/Weapons/Guns/Basic/kinetic_shotgun.rsi
    shape:
    - 0,0,4,0

- type: entity
  name: proto-kinetic repeater
  id: WeaponProtoKineticRepeater
  parent: [ BaseWeaponProtoKineticLavaland, WeaponProtoKineticAccelerator ]
  description: Fires a barrage of medium-damage kinetic bolts at a short range.
  components:
  - type: Sprite
    sprite: _ClawCommand/Lavaland/Objects/Weapons/Guns/Basic/kinetic_repeater.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: _ClawCommand/Lavaland/Objects/Weapons/Guns/Basic/kinetic_repeater.rsi
  # Accurate without wielding.
  - type: Gun
    minAngle: 1
    maxAngle: 5
    selectedMode: Burst
    burstFireRate: 5
    burstCooldown: 1.5
    availableModes:
    - Burst
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
  - type: BasicEntityAmmoProvider
    proto: RapidBulletKinetic
    capacity: 3
    count: 3
  - type: Item
    sprite: _ClawCommand/Lavaland/Objects/Weapons/Guns/Basic/kinetic_repeater.rsi
    shape:
    - 0,0,2,1

- type: entity
  name: proto-kinetic pistol
  id: WeaponProtoKineticPistol
  parent: [ BaseWeaponProtoKineticLavaland, WeaponProtoKineticAccelerator ]
  description: Fires low-damage kinetic bolts, has a higher mod capacity.
  components:
  - type: Sprite
    sprite: _ClawCommand/Lavaland/Objects/Weapons/Guns/Basic/kinetic_pistol.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: _ClawCommand/Lavaland/Objects/Weapons/Guns/Basic/kinetic_pistol.rsi
  - type: BasicEntityAmmoProvider
    proto: RapidBulletKinetic
  # Accurate without wielding.
  - type: Gun
    minAngle: 1
    maxAngle: 5
    availableModes:
    - FullAuto
    - SemiAuto
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
  - type: UpgradeableGun
    maxUpgradeCount: 3 # higher mod capacity than the other PKAs
  - type: Multishot # Only a pistol should support that for balancing reasons
    missChance: 0
    spreadAddition: 5
  - type: Item
    sprite: _ClawCommand/Lavaland/Objects/Weapons/Guns/Basic/kinetic_pistol.rsi
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1

# Space versions of all PKAs - come with the space modkit pre-installed.
- type: entity
  id: WeaponProtoKineticAcceleratorSpace
  parent: WeaponProtoKineticAccelerator
  suffix: Space upgrade
  components:
  # The shared PKA has no pressure scaling of its own; the space modkit needs this to act on.
  - type: PressureDamageChange
    applyToMelee: false
  - type: EntityTableContainerFill
    containers:
      upgrades:
        id: PKAUpgradeSpace

- type: entity
  id: WeaponProtoKineticShotgunSpace
  parent: WeaponProtoKineticShotgun
  suffix: Space upgrade
  components:
  - type: EntityTableContainerFill
    containers:
      upgrades:
        id: PKAUpgradeSpace

- type: entity
  id: WeaponProtoKineticRepeaterSpace
  parent: WeaponProtoKineticRepeater
  suffix: Space upgrade
  components:
  - type: EntityTableContainerFill
    containers:
      upgrades:
        id: PKAUpgradeSpace

- type: entity
  id: WeaponProtoKineticPistolSpace
  parent: WeaponProtoKineticPistol
  suffix: Space upgrade
  components:
  - type: EntityTableContainerFill
    containers:
      upgrades:
        id: PKAUpgradeSpace
