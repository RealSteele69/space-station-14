# Claw Command: standalone super plasma cutter (this fork has no regular plasma cutter to inherit from).
# Recharges like any other battery weapon; the plasma-sheet refuelling component isn't in this fork.
- type: entity
  name: super plasma cutter
  parent: [ BaseWeaponBatterySmall, BaseSalvageContraband ]
  id: WeaponSuperPlasmaCutter
  description: A strong mining weapon that can mine even bigger tunnels through rocks.
  components:
  - type: Sprite
    sprite: _ClawCommand/Lavaland/Objects/Weapons/Guns/Battery/super_cutter.rsi
    state: icon
  - type: Gun
    fireRate: 2
    soundGunshot:
      path: /Audio/Weapons/plasma_cutter.ogg
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatteryAmmoProvider
    proto: BulletSuperPlasmaCutter
    fireCost: 40
  - type: Appearance
  - type: StaticPrice # Claw Command - above its material composition
    price: 2300
  - type: PhysicalComposition
    materialComposition:
      Gold: 400
      Steel: 200
      Glass: 150
      Plasma: 150
      Bluespace: 100 # Claw Command - fork's bluespace material ID
      Silver: 100
      Diamond: 50

- type: entity
  parent: WeaponSuperPlasmaCutter
  id: WeaponSuperPlasmaCutterEmpty
  suffix: Empty
  components:
  - type: Battery
    startingCharge: 0
