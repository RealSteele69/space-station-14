# Kinetic bolts for the proto-kinetic pistol, repeater and shotgun. They build on the shared
# BulletKinetic (Entities/Objects/Weapons/Guns/Projectiles/Energy/kinetic.yml), so they still mine.

- type: entity
  id: RapidBulletKinetic # Used for PK repeater and pistol
  name: rapid kinetic bolt
  parent: BulletKinetic
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 6.5
        Structural: 8

- type: entity
  id: WeakBulletKinetic # Used for PK shotgun
  categories: [ HideSpawnMenu ]
  parent: RapidBulletKinetic
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 3
        Structural: 5

- type: entity
  id: PelletKinetic
  categories: [ HideSpawnMenu ]
  parent: WeakBulletKinetic

- type: entity
  id: PelletKineticSpread
  categories: [ HideSpawnMenu ]
  parent: PelletKinetic
  components:
  - type: ProjectileSpread
    proto: PelletKinetic
    count: 4
    spread: 20

# Super plasma cutter bolt: passes through and mines a wide path.
- type: entity
  id: BulletSuperPlasmaCutter
  name: super cutter bolt
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  description: Not too bad, but you still don't want to get hit by it.
  components:
  - type: Reflective
    reflective:
      - NonEnergy
  - type: Sprite
    noRot: false
    sprite: _ClawCommand/Lavaland/Objects/Weapons/Guns/Projectiles/bullet_cutter.rsi
    layers:
    - state: icon
      shader: unshaded
  - type: GatheringProjectile
    amount: 40
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        hard: false
        mask:
        - Opaque
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 2
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: False
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Heat: 10
  - type: StaminaDamageOnCollide
    damage: 10
  - type: TimedDespawn
    lifetime: 0.25
  - type: PointLight
    radius: 2
    color: purple
    energy: 1
