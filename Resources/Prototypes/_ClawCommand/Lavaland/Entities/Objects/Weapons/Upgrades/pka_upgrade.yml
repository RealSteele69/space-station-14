# Pressure-retuning PKA modkits. They use the shared BasePKAUpgrade (Entities/Objects/Tools/pka_upgrade.yml)
# and act on weapons with PressureDamageChange (the lavaland proto-kinetic weapons).

- type: entity
  id: PKAUpgradePressure
  parent: [BaseSyndicateContraband, BasePKAUpgrade]
  name: PKA modkit (pressure)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ff4500"
    - state: overlay-2
      color: "#9b0000"
    - state: overlay-3
      color: "#ff4500"
  - type: GunUpgrade
    tags: [ GunUpgradePressure ]
    examineText: gun-upgrade-examine-text-pressure
  - type: GunUpgradePressure # Works almost everywhere now, yupie!
    newLowerBound: 0
    newUpperBound: 200

- type: entity
  id: PKAUpgradeSpace
  parent: BasePKAUpgrade
  name: PKA modkit (space)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ff00bf"
    - state: overlay-2
      color: "#a0038b"
    - state: overlay-3
      color: "#ff00bf"
  - type: GunUpgrade
    tags: [ GunUpgradePressure ]
    examineText: gun-upgrade-examine-text-space
  - type: GunUpgradePressure
    newLowerBound: 0
    newUpperBound: 10
    newAppliedModifier: 2
  - type: Tag
    tags:
    - PKAUpgrade
    - PKAUpgradeSpace

# Trades some stopping power for a much faster trigger. Reuses the shared fire-rate/damage
# upgrade components rather than adding a new mechanic.
- type: entity
  id: PKAUpgradeRapidFeed
  parent: BasePKAUpgrade
  name: PKA modkit (rapid feed)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#f2c230"
    - state: overlay-2
      color: "#8a6d00"
    - state: overlay-3
      color: "#f2c230"
  - type: GunUpgrade
    tags: [ GunUpgradeRapidFeed ]
    examineText: gun-upgrade-examine-text-rapid-feed
  - type: GunUpgradeFireRate
    coefficient: 1.8
  - type: GunUpgradeDamage
    damage:
      types:
        Blunt: -3
        Piercing: -3
  - type: Tag
    tags:
    - PKAUpgrade
    - PKAUpgradeRapidFeed
