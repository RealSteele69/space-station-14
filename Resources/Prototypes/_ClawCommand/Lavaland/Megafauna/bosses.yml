#
# AI selector trees for the lavaland megafauna and elites.
# Each root picks a target (PickTargetSimple, see hierophant.yml) and then one available attack.
# Attacks unlock with phases (MobPhases on the mob) and get faster with anger.

# ---------------------------------------------------------------------------
# Ash drake
# ---------------------------------------------------------------------------

- type: megafaunaSelector
  id: AshDrake
  selector: !type:AllMegafaunaSelector
    children:
    - id: PickTargetSimple
    - id: AshDrakeActions

- type: megafaunaSelector
  id: AshDrakeActions
  selector: !type:GroupMegafaunaSelector
    children:
    - !type:PerformActionSelector
      actionId: ActionAshDrakeFireBreath
      weight: 3
      delay: !type:AngerNumberSelector
        range: 1.2,2.5
        inverse: true
      conditions:
      - !type:ActionAvailableCondition
        actionId: ActionAshDrakeFireBreath
    - !type:PerformActionSelector
      actionId: ActionAshDrakeFireballs
      weight: 2
      delay: !type:AngerNumberSelector
        range: 1.2,2.5
        inverse: true
      conditions:
      - !type:ActionAvailableCondition
        actionId: ActionAshDrakeFireballs
    - !type:PerformActionSelector
      actionId: ActionAshDrakeSwoop
      weight: 2
      delay: 3.0
      conditions:
      - !type:ActionAvailableCondition
        actionId: ActionAshDrakeSwoop
    - !type:PerformActionSelector
      actionId: ActionAshDrakeFireRain
      weight: 2
      delay: !type:AngerNumberSelector
        range: 1.0,2.0
        inverse: true
      conditions:
      - !type:PhaseMegafaunaCondition
        phases: [ 2, 3 ]
      - !type:ActionAvailableCondition
        actionId: ActionAshDrakeFireRain
    - !type:PerformActionSelector
      actionId: ActionAshDrakeFireRing
      weight: 1
      delay: 2.5
      conditions:
      - !type:PhaseMegafaunaCondition
        phases: [ 3 ]
      - !type:ActionAvailableCondition
        actionId: ActionAshDrakeFireRing

