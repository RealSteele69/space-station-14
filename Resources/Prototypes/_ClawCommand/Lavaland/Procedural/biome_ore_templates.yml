# Lavaland copies of the standard ore marker layers. The shared layers in Procedural/biome_ore_templates.yml
# have no WallRockBasalt mapping, so on lavaland (mostly basalt) they would only ever replace the odd asteroid
# rock. These add the basalt veins from Entities/Structures/Walls/asteroid.yml and use lavaland densities.

- type: biomeMarkerLayer
  id: LavalandOreIron
  entityMask:
    AsteroidRock: AsteroidRockTin
    WallRock: WallRockTin
    WallRockBasalt: WallRockBasaltTin
    WallRockChromite: WallRockChromiteTin
    WallRockSand: WallRockSandTin
    WallRockSnow: WallRockSnowTin
  maxCount: 30
  minGroupSize: 8
  maxGroupSize: 20
  radius: 4

