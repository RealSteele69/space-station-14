- type: reagent
  id: MinersSalve
  name: reagent-name-minerssalve
  group: Medicine
  desc: reagent-desc-minerssalve
  physicalDesc: reagent-physical-desc-shiny
  flavor: metallic
  color: "#f2c777"
  recognizable: true
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Blunt: -1.5
            Slash: -1.5
            Piercing: -1.5
            Heat: -2
            Shock: -0.5
            Asphyxiation: -1
            Bloodloss: -1
        conditions:
        - !type:ReagentCondition
          reagent: MinersSalve
          max: 21
        - !type:OnLavalandCondition
      - !type:ModifyBloodLevel
        amount: 1.5
        conditions:
        - !type:ReagentCondition
          reagent: MinersSalve
          max: 21
        - !type:OnLavalandCondition
      - !type:Jitter
      - !type:PopupMessage
        type: Local
        visualType: Small
        messages: [ "generic-reagent-effect-burning-insides" ]
        probability: 0.1
      - !type:Emote
        emote: Scream
        probability: 0.05
        #It's balanced I swear!

