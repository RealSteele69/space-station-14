- type: reagent
  id: Lean
  name: reagent-name-lean
  parent: BaseAlcohol
  desc: reagent-desc-lean
  physicalDesc: reagent-physical-desc-strong-smelling
  color: "#9400D3"
  metamorphicSprite:
    sprite: Objects/Consumable/Drinks/lean.rsi
    state: icon
  metabolisms:
    Bloodstream:
      effects:
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStutter
        type: Update
      - !type:Jitter
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Lean
          min: 25
        damage:
          types:
            Caustic: 0.5
      - !type:Electrocute
        conditions:
        - !type:ReagentCondition
          reagent: Lean
          min: 35
        probability: 0.1
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: Lean
          min: 60
        probability: 0.2
