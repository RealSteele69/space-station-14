- type: reagent
  id: Lamplight
  name: reagent-name-lamplight
  parent: BaseAlcohol
  desc: reagent-desc-lamplight
  physicalDesc: reagent-physical-desc-vibrant
  flavor: lamplight
  color: "#ffd000"
  metamorphicSprite:
    sprite: _Floof/Objects/Consumable/Drinks/lamplight.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 3
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false
  metabolisms:
    Digestion:
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 2
      # Original used OrganType (non-Moth → Pomelustine, Moth → Philterex);
      # OrganType isn't supported here, so we restore the reagents but skip the moth gating.
      - !type:AdjustReagent
        conditions:
        - !type:ReagentCondition
          reagent: Lamplight
          min: 1
        reagent: Pomelustine
        amount: 0.5
      - !type:AdjustReagent
        conditions:
        - !type:ReagentCondition
          reagent: Lamplight
          min: 1
        reagent: Philterex
        amount: 0.5

