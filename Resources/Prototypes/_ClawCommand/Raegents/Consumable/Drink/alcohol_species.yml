# Species-specific cocktails, one per playable race's unofficial house drink.

- type: reagent
  id: Coldscales
  name: reagent-name-coldscales
  parent: BaseAlcohol
  desc: reagent-desc-coldscales
  physicalDesc: reagent-physical-desc-cold
  flavor: coldscales
  color: "#5AEB52"
  metabolisms:
    Digestion:
      metabolites:
        Ethanol: 0.09
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 2

- type: reagent
  id: OilDrum
  name: reagent-name-oil-drum
  parent: BaseAlcohol
  desc: reagent-desc-oil-drum
  physicalDesc: reagent-physical-desc-oily
  flavor: oildrum
  color: "#000000"
  metabolisms:
    Digestion:
      metabolites:
        Ethanol: 0.08
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 2
      - !type:MovementSpeedModifier
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ MetabolizerSynth ]
        walkSpeedModifier: 1.1
        sprintSpeedModifier: 1.1
        time: 3
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: OilDrum
          min: 3
        - !type:MetabolizerTypeCondition
          type: [ MetabolizerSynth ]
          inverted: true
        damage:
          types:
            Poison: 0.1

