- type: reagent
  id: NikkosNaughtyNectar
  name: reagent-name-NNN
  parent: BaseDrink
  desc: reagent-desc-NNN
  physicalDesc: reagent-physical-desc-creamy
  flavor: nikkonectar
  color: "#deebff"
  recognizable: true
  viscosity: 0.15
  metabolisms:
    Digestion:
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 2
    Bloodstream:
      metabolismRate : 0.5
      effects:
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages:
          - "reagent-effect-aphrodisiac-mild1"
          - "reagent-effect-aphrodisiac-mild2"
          - "reagent-effect-aphrodisiac-mild3"
          - "reagent-effect-aphrodisiac-mild4"
          - "reagent-effect-aphrodisiac-mild5"
        probability: 0.02
        conditions:
          - !type:ReagentCondition
            reagent: NikkosNaughtyNectar
            max: 50
  footstepSound:
    collection: FootstepSticky
    params:
      volume: 3

- type: reagent
  id: BoykissersEnergy
  name: reagent-name-boykisser-energy
  parent: BaseDrink
  desc: reagent-desc-boykisser-energy
  physicalDesc: reagent-physical-desc-bubbly
  flavor: nutty
  color: "#FD3DB5"
  recognizable: false
  viscosity: 0.15
  metabolisms:
    Digestion:
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 2
    Bloodstream:
      effects:
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStutter
        type: Update
      - !type:Jitter
      - !type:ModifyStatusEffect # Claw Command - old Drowsiness status key no longer exists
        effectProto: StatusEffectDrowsiness
        time: 10
        type: Remove
      - !type:ResetNarcolepsy
        conditions:
        - !type:ReagentCondition
          reagent: BoykissersEnergy
          min: 20
  footstepSound:
    collection: FootstepSticky
    params:
      volume: 3

