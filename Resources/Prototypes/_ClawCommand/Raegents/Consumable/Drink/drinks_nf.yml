# Ported from Frontier (_NF) — verbatim apart from porting notes.
# Restored over earlier substitution: CucumberWater was substituted with Water.
# metamorphicSprite stripped: the _NF/Objects/Consumable/Drinks/cucumberwater.rsi
# was not ported (would error at load time). Re-add if the rsi is ported.

- type: reagent
  id: CucumberWater
  name: reagent-name-cucumber-water
  parent: BaseDrink
  desc: reagent-desc-cucumber-water
  physicalDesc: reagent-physical-desc-aromatic
  flavor: cucumber
  color: "#b1ceb0"
  metabolisms:
    Digestion:
      effects:
        - !type:Satiate
          satiationType: Thirst
          factor: 6

# Claw Command - the source fork defines no brewing reaction for this, just
# the reagent (vending/premade only).
- type: reagent
  id: HoneyIcedTea
  name: reagent-name-honey-iced-tea
  parent: BaseDrink
  desc: reagent-desc-honey-iced-tea
  physicalDesc: reagent-physical-desc-aromatic
  flavor: honey
  color: "#E79A3F"
  metabolisms:
    Digestion:
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 0.6
  metamorphicSprite:
    sprite: _NF/Objects/Consumable/Drinks/honeyicedtea.rsi
    state: icon
