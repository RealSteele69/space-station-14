# Secret Sauce - a nod to a classic "cheat ingredient" condiment from SS13-lineage codebases
# that would set a dish's hidden "quality" stat to maximum on contact. This fork's food system
# (Content.Shared/Content.Server Nutrition) has no quality-rating concept to hook that mechanic
# into, so rather than invent a new quality-tracking gameplay system from scratch, this is ported
# as a purely flavorful, very rare/expensive condiment: an overwhelming, unmistakably good flavor
# plus a small universal nod-to-the-theme heal (not a real medicine substitute). Deliberately not
# wired into any chemical dispenser or microwave recipe, so it can't be synthesized - only found.
- type: reagent
  id: SecretSauce
  name: reagent-name-secret-sauce
  group: Foods
  desc: reagent-desc-secret-sauce
  physicalDesc: reagent-physical-desc-enigmatic
  flavor: indescribable
  flavorMinimum: 0.01
  color: "#792300"
  recognizable: true
  metabolisms:
    Digestion:
      metabolites:
        Nutriment: 0.5
      effects:
      - !type:EvenHealthChange
        damage:
          Brute: -0.5
          Burn: -0.5
