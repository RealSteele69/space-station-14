# Claw Command — Floof ice cream microwave recipes.
#
# The first 22 are ported verbatim from space/_Floof/Recipes/Cooking/meal_recipes.yml
# (chef assembles an IceCreamBowl with the IceCream reagent base + flavour reagents,
# microwave finishes it into the named bowl). The trailing 5 (Void, Hazelnut, Walnut,
# Starlight, RockyRoad) are designed here — entities ship in _Floof but never got an
# upstream recipe.

- type: microwaveMealRecipe
  id: RecipeIceCreamBloodDrop
  result: IceCreamBloodDrop
  time: 5
  group: Dessert
  reagents:
    IceCream: 20
    Blood: 10
    JuiceBerry: 5
  solids:
    IceCreamBowl: 1

