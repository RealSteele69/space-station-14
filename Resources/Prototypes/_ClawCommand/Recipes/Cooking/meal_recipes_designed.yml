  time: 15
  group: Soup
  reagents:
    Water: 10
  solids:
    FoodBowlBig: 1
    FoodMeatCutlet: 1
    FoodCabbage: 1
    FoodCarrot: 1
    FoodTomato: 1
    FoodOnionSlice: 5

- type: microwaveMealRecipe
  id: RecipeSoupPotato
  result: FoodSoupPotato
  time: 15
  group: Soup
  reagents:
    Cream: 10
    Sugar: 5
