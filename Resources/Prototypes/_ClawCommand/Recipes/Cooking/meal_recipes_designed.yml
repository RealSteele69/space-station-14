# NOTE: Frozen foods (snowcones, popsicles, ice cream sandwiches, freezy, sundae,
# cornuto) intentionally have NO microwave recipe — matches upstream design where
# they're vendor / cargo only (chefvend, food crates). You can't microwave-cook
# frozen treats. See ../../Reagents/Reactions/food_extras.yml for the chef-makeable
# cheese ingredients (mozzarella, curd) and coffee bean roasting under
# Construction/Graphs/food/coffee_beans.yml.

