# Ported from Euphoria/Recipes/Cooking/meal_recipes.yml
# Source made the bun via an intermediate FoodUncookedHotdogBun + a "DoughBuns" construction graph that
# doesn't exist in this fork. Adapted to a direct microwave recipe from dough, matching this fork's/
# vanilla's existing convention for other bun shapes (RecipeBun -> FoodBreadBun in vanilla
# Recipes/Cooking/meal_recipes.yml).

- type: microwaveMealRecipe
  id: RecipeHotdogBun
  result: FoodHotdogBun
  time: 5
  group: Hotdog # Claw Command - listed with the rest of the sausage/hotdog chain.
  solids:
    FoodDoughSlice: 1
  reagents:
    Milk: 5 # Claw Command - a lone dough slice is already vanilla RecipeBun; milk makes it a soft hotdog bun instead.
