# Claw Command - topped hotdogs matching the DonkCo recipe cards (Entities/Objects/Misc/recipe_cards_euphoria.yml).
# All listed on the "Sausages & Hotdogs" guidebook page via the Hotdog group.
# Recipes are tried in descending ingredient count, so a topped dog wins over the plain
# RecipeHotdogHotdogBun whenever its toppings are in the microwave.

- type: microwaveMealRecipe
  id: RecipeHotdogHotdogBun
  result: FoodMealHotdog
  time: 10
  group: Hotdog
  solids:
    FoodMeatSausage: 1
    FoodHotdogBun: 1

