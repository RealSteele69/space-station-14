# Sausage & hotdog
# Source used a multi-result list (result: [FoodSausageRaw x3]) with resultCount commented out and
# recipeType: Assembler/Microwave - this fork's FoodRecipePrototype only supports a single EntProtoId
# Result and has no RecipeType field at all (unconditionally a microwave recipe), so both have been
# adapted to a single-result standard microwave recipe.

- type: microwaveMealRecipe
  id: RecipeSausageRaw
  result: FoodSausageRaw
  time: 10
  group: Savory
  solids:
    FoodSausageCasing: 1
  reagents:
    UncookedAnimalProteins: 9

