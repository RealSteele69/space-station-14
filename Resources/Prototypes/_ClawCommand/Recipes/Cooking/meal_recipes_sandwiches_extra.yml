# Microwave recipes for the new sandwiches/toasts in
# _ClawCommand/Entities/Objects/Consumable/Food/sandwiches_extra.yml.

- type: microwaveMealRecipe
  id: RecipeMealBLT
  result: FoodMealBLT
  time: 10
  group: Savory
  reagents:
    Mayo: 5
  solids:
    FoodMeatBaconCooked: 2
    FoodCabbage: 1
    FoodTomato: 1

- type: microwaveMealRecipe
  id: RecipeMealTwoBread
  result: FoodMealTwoBread
  time: 5
  group: Other
  solids:
    FoodBreadPlainSlice: 2

- type: microwaveMealRecipe
  id: RecipeMealTunaSandwich
  result: FoodMealTunaSandwich
  time: 10
  group: Savory
  reagents:
    Mayo: 5
  solids:
    FoodBreadPlainSlice: 2
    FoodCannedTuna: 1

- type: microwaveMealRecipe
  id: RecipeMealMeatballSub
  result: FoodMealMeatballSub
  time: 10
  group: Meat
  solids:
    FoodMeatMeatballCooked: 3
    FoodBreadBun: 1

- type: microwaveMealRecipe
  id: RecipeMealJelliedToast
  result: FoodMealJelliedToast
  time: 5
  group: Breakfast
  reagents:
    Sugar: 3
  solids:
    FoodBreadPlainSlice: 1

- type: microwaveMealRecipe
  id: RecipeMealJellySandwich
  result: FoodMealJellySandwich
  time: 5
  group: Breakfast
  reagents:
    Sugar: 4
  solids:
    FoodBreadPlainSlice: 2

- type: microwaveMealRecipe
  id: RecipeMealNotASandwich
  result: FoodMealNotASandwich
  time: 5
  group: Other
  # Needs a distinct ingredient signature from RecipeMealTwoBread below (both were
  # just "FoodBreadPlainSlice: 2" with no reagents). RecipeManager sorts recipes by
  # descending IngredientCount() and picks the first match, so two recipes tied on
  # the exact same ingredients are ambiguous - whichever sorts first silently
  # shadows the other, which can then never be cooked. The "Nothing" reagent nudges
  # this one to a higher ingredient count so it's checked first when present.
  reagents:
    Nothing: 1
  solids:
    FoodBreadPlainSlice: 2
