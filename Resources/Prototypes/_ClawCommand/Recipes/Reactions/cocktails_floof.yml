# VBBeer has no mixed-drink reaction upstream either - it's a straight bottled
# beer (see DrinkVBLongneckFull in drinks_floof_bottles.yml), not a cocktail.

# Claw Command - source reaction needs PeanutButter, which doesn't exist in this fork
# (owned by a parallel food-ingredients port); substituted with the existing PeanutOil
# reagent so this cocktail doesn't require a new precursor.
- type: reaction
  id: PeanutButterWhiskey
  requiredMixerCategories:
  - Shake
  reactants:
    PeanutOil:
      amount: 1
    Whiskey:
      amount: 1
  products:
    PeanutButterWhiskey: 2
