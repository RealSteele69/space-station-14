# Chaplain null rod and the holy weapons it turns into on altars.

- type: entity
  parent: BaseItem
  id: BaseNullrod
  abstract: true
  components:
  - type: DivineIntervention
  - type: Sprite
    sprite: _ClawCommand/Objects/Weapons/Nullrod/nullrod.rsi
    state: icon
  - type: Item
    size: Small
  - type: Reflect
    reflectProb: 1
    reflects:
    - Magic
    slotFlags:
    - NONE
  - type: DisarmMalus
    malus: 0
  - type: GuideHelp
    guides:
    - Chaplain

- type: entity
  parent: BaseNullrod
  id: Nullrod
  name: null rod
  description: The old classic. Does nothing special, really. Place it on an altar to reforge it into a holy weapon.
  components:
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        Blunt: 10
        Holy: 10
    soundHit:
      collection: MetalThud
  - type: Nullrod
    damageOnUntrainedUse:
      types:
        Heat: 20
    untrainedUseString: nullrod-untrained-usage-popup
    recallType: Normal
  - type: Tag
    tags:
    - Nullrod

- type: entity
  parent: BaseNullrod
  id: HolyClaymore
  name: holy claymore
  description: A weapon fit for a crusade! A sword capable of stealing life from evil-doers.
  components:
  - type: Item
    size: Large
    sprite: _ClawCommand/Objects/Weapons/Nullrod/holyclaymore.rsi
  - type: Nullrod
    damageOnUntrainedUse:
      types:
        Slash: 20
    untrainedUseString: nullrod-holyclaymore-untrained-usage-popup
    recallType: Normal
  - type: Gun
    soundGunshot: /Audio/Effects/radpulse7.ogg
    fireRate: 0.5
    useKey: false
  - type: GunRequiresWield
  - type: MeleeWeapon
    animationRotation: -45
    wideAnimationRotation: -135
    attackRate: 0.8
    damage:
      types:
        Slash: 13
        Holy: 10
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Wieldable
  - type: LeechOnMarker
    leech:
      types:
        Blunt: -7
        Slash: -7
        Piercing: -6
        Asphyxiation: -10
  - type: Clothing
    sprite: _ClawCommand/Objects/Weapons/Nullrod/holyclaymore.rsi
    quickEquip: false
    slots:
    - back
  - type: Sprite
    sprite: _ClawCommand/Objects/Weapons/Nullrod/holyclaymore.rsi
  - type: AmmoCounter
  - type: UseDelayOnShoot
  - type: UseDelay
    delay: 3.5
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 3.4
    rechargeSound:
      path: /Audio/Magic/Cults/ClockCult/steam_whoosh.ogg
  - type: BasicEntityAmmoProvider
    proto: HolyBulletCharge
    capacity: 1
    count: 1
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-inanimate
    weight: 0.50
  - type: MedievalAccent
  - type: Execution
    doAfterDuration: 3.0
  - type: Tool
    qualities:
    - Slicing
    useSound:
      path: /Audio/Items/Culinary/chop.ogg

- type: entity
  parent: BaseNullrod
  id: Rosary
  name: rosary
  description: Praying with these near someone will heal them. They are surrounded by a holy aura.
  components:
  - type: Sprite
    sprite: _ClawCommand/Objects/Weapons/Nullrod/rosary.rsi
    state: icon
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/weak_hit1.ogg
    damage:
      types:
        Blunt: 3
        Holy: 10
  - type: HeldSpeedModifier # Holy aura.
    walkModifier: 1.15
    sprintModifier: 1.15
  - type: Item
    size: Small
    sprite: _ClawCommand/Objects/Weapons/Nullrod/rosary.rsi
  - type: Clothing
    quickEquip: false
    slots:
    - belt
  - type: Nullrod
