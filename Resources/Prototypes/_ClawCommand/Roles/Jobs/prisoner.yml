# Claw Command - Prisoner as a selectable roundstart/midround job
- type: job
  id: Prisoner
  name: job-name-prisoner
  description: job-description-prisoner
  playTimeTracker: JobPrisoner
  startingGear: PrisonerGear
  icon: "JobIconPrisoner"
  supervisors: job-supervisors-security
  setPreference: true
  alwaysUseSpawner: true
  # weight moved to Resources/Prototypes/Roles/job_weights.yml (Default profile) after upstream removed JobPrototype.Weight
  access:
  - GenpopEnter

- type: startingGear
  id: PrisonerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitPrisoner
    id: PermanentPrisonerIDCard
    ears: ClothingHeadsetGrey
    shoes: ClothingShoesColorBlack

# Permanent prisoner ID - no ExpireIdCard so GenpopLeave is never granted
- type: entity
  parent: PrisonerIDCard
  id: PermanentPrisonerIDCard
  name: permanent prisoner ID card
  description: A prisoner ID card for long-term inmates. This card does not expire.
  components:
  - type: ExpireIdCard # No expire time means it never expires; if one is ever set, expiring still grants nothing.
    expiredAccess: []

- type: chameleonOutfit
  id: PrisonerChameleonOutfit
  job: Prisoner
  equipment:
    mask: ClothingMaskBreath
    hands: ClothingHandsGlovesFingerless
    jumpsuit: ClothingUniformJumpsuitPrisoner
    shoes: ClothingShoesColorBlack
