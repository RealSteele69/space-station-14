  flavor: originalsin
  color: "#99CC35"
  metabolisms:
    Digestion:
      metabolites:
        Ethanol: 0.6

- type: reagent
  id: GodsSake
  name: reagent-name-gods-sake
  parent: BaseAlcohol
  desc: reagent-desc-gods-sake
  physicalDesc: reagent-physical-desc-holy
  flavor: godssake
  color: "#DDDDDD"
  metabolisms:
    Digestion:
      metabolites:
        Ethanol: 0.2

- type: reagent
  id: Godka
  name: reagent-name-godka
  parent: BaseAlcohol
  desc: reagent-desc-godka
  physicalDesc: reagent-physical-desc-strong-smelling
  flavor: godka
  color: "#0064C8"
  fizziness: 0.3
  metabolisms:
    Digestion:
      metabolites:
        Ethanol: 0.6
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 2
      # Flushes radiation out of the drinker.
      - !type:HealthChange
        damage:
          types:
            Radiation: -1.5
      # Unpredictable on the liver: usually purges toxins, sometimes adds to them.
      - !type:HealthChange
        probability: 0.6
        damage:
          types:
            Poison: -1
      - !type:HealthChange
        probability: 0.3
        damage:
          types:
            Poison: 0.5
      - !type:PopupMessage
        type: Local
        messages:
        - godka-effect-woozy
        probability: 0.02

# Engine-room oddities

- type: reagent
  id: OilSlick
  name: reagent-name-oil-slick
  parent: BaseDrink
  desc: reagent-desc-oil-slick
  physicalDesc: reagent-physical-desc-oily
  flavor: honey
  color: "#FDF5E6"
  metabolisms:
    Digestion:
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 1
      - !type:Satiate
        satiationType: Hunger
        factor: 1

- type: reagent
  id: NuclearWaste
  name: reagent-name-nuclear-waste
  parent: BaseDrink
  desc: reagent-desc-nuclear-waste
  physicalDesc: reagent-physical-desc-glowing
  flavor: nuclearwaste
  color: "#7FFF00"
  fizziness: 0.3
  metabolisms:
    Digestion:
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 1
      - !type:Satiate
        satiationType: Hunger
        factor: 0.2
      # The slurry keeps breaking down into radium as it is digested. Plant people shrug it off.
      - !type:AdjustReagent
        reagent: Radium
        amount: 0.25
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Plant ]
          inverted: true

