# Claw Command - novelty bar drinks: the angel ichor line, oil slick / nuclear waste and a few odd cocktails.
# Alcohol strength follows Ethanol metabolite ~= proof / 200, capped at 0.6.

# Angel ichor line

- type: reagent
  id: AngelIchor
  name: reagent-name-angel-ichor
  parent: BaseAlcohol
  desc: reagent-desc-angel-ichor
  physicalDesc: reagent-physical-desc-holy
  flavor: angelichor
  color: "#C4921E"
  metabolisms:
    Digestion:
      metabolites:
        Ethanol: 0.5

- type: reagent
