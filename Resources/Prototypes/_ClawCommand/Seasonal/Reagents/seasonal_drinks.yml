# Claw Command - seasonal holiday drinks (christmas and halloween).
# Alcohol strength follows Ethanol metabolite ~= proof / 200.

# Christmas - bottled and canned

- type: reagent
  id: CinnamonCola
  name: reagent-name-cinnamon-cola
  parent: BaseSoda
  desc: reagent-desc-cinnamon-cola
  physicalDesc: reagent-physical-desc-fizzy
  flavor: cinnamoncola
  color: "#6c2828"
  recognizable: true
  metabolisms:
    Digestion:
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 2
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        time: 1
        type: Remove

