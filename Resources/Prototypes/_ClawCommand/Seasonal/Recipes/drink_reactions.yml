# Angel ichor line

- type: reaction
  id: AngelIchor
  reactants:
    JuiceGrape:
      amount: 5
    Gold:
      amount: 5
    Holywater:
      amount: 5
      catalyst: true
  products:
    AngelIchor: 10

- type: reaction
  id: HolyMary
  reactants:
    Vodka:
      amount: 2
    AngelIchor:
      amount: 3
    JuiceLime:
      amount: 1
  products:
    HolyMary: 6

- type: reaction
  id: AngelsKiss
  reactants:
    AngelIchor:
      amount: 1
    CoffeeLiqueur:
      amount: 1
    Rum:
      amount: 1
  products:
    AngelsKiss: 3

- type: reaction
  id: AngelsWrath
  reactants:
    Rum:
      amount: 1
    SpaceMountainWind:
      amount: 2
    AngelIchor:
      amount: 1
    DrGibb:
      amount: 2
  products:
    AngelsWrath: 6

- type: reaction
  id: IchorMead
  reactants:
    AngelIchor:
      amount: 1
    Mead:
      amount: 1
  products:
    IchorMead: 2

- type: reaction
  id: OriginalSin
  reactants:
    AngelIchor:
      amount: 1
    JuiceApple:
      amount: 1
      catalyst: true
  products:
    OriginalSin: 1

- type: reaction
  id: GodsSake
  reactants:
    Sake:
      amount: 2
    Holywater:
      amount: 1
  products:
    GodsSake: 3

# Holy water is both consumed and a catalyst in the original mix; a reactant map can only list it once,
# so the consumed unit is kept and enzyme remains the catalyst.
- type: reaction
  id: Godka
  reactants:
    Vodka:
      amount: 1
    Holywater:
      amount: 1
    Ethanol:
      amount: 1
    Dylovene:
      amount: 1
    Enzyme:
      amount: 5
      catalyst: true
  products:
    Godka: 1

