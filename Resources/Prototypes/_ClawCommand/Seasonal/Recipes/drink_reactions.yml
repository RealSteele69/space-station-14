# Claw Command - mixing recipes for the seasonal and novelty bar drinks.
# The bottled/canned seasonal drinks (caramel whiskey, schnapps, candy corn vodka, limited-edition sodas, lattes)
# have no recipe; they are only sold.

# Christmas

- type: reaction
  id: CaramelWhiteRussian
  reactants:
    CoffeeLiqueur:
      amount: 1
    CaramelWhiskey:
      amount: 1
    Cream:
      amount: 1
  products:
    CaramelWhiteRussian: 3

- type: reaction
  id: PeppermintMartini
  reactants:
    PeppermintSchnapps:
      amount: 1
    Vodka:
      amount: 1
    Cream:
      amount: 1
  products:
    PeppermintMartini: 3

- type: reaction
  id: Stinger
  reactants:
    PeppermintSchnapps:
      amount: 1
    Cognac:
      amount: 3
  products:
    Stinger: 4

- type: reaction
  id: NaughtyGirlScout
  reactants:
    PeppermintSchnapps:
      amount: 1
    CoffeeLiqueur:
      amount: 1
    IrishCream:
      amount: 1
  products:
    NaughtyGirlScout: 3

