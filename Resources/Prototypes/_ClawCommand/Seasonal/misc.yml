# The whole run-up to Halloween, so the seasonal vending stock is around for more than one day.
- type: holiday
  id: SpookySeason
  name: holiday-name-spooky-season
  beginDay: 1
  beginMonth: October
  endDay: 2
  endMonth: November
  greet:
    !type:Custom
    text: holiday-custom-spooky-season
  celebrate: # Claw Command - trick-or-treat bags for the crew, a few closets booby-trapped
    !type:TrickOrTreatCelebrate
    trapEffects: !type:GroupSelector
      children:
      - id: EffectSpookyClosetSkeleton
        weight: 640
      - id: EffectSpookyClosetGhost
        weight: 200
      - id: EffectSpookyClosetBats
        weight: 150
      - id: EffectSpookyClosetHostile
        weight: 10
      - id: EffectSpookyClosetClown
        weight: 1

