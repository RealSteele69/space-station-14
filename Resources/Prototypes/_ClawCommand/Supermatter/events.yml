# Random events the supermatter runs once it has been angered enough by the gases it absorbs.
# Harsh events are picked when the last absorbed mix was very angering, normal events otherwise.

- type: weightedRandom
  id: SupermatterHarshEvents
  weights:
    GasSpillOxy: 1
    GasSpillPlasma: 1
    GasSpillCarbon: 1
    GasSpillFrezon: 1
    SMShardSpawn: 1
    SMAnomSpawn: 1
    SMEMPSpawn: 1
    SMGravitySpawn: 1

- type: weightedRandom
  id: SupermatterNormalEvents
  weights:
    GasSpillOxy: 3
    GasSpillNitrogen: 3
    GasSpillCarbon: 3
    GasSpillFrezon: 1
    SMBSAnomSpawn: 2
    SMSurge: 4

- type: supermatterEvent
  id: SMSurge
  surge: true
  announcement: supermatter-surge

- type: supermatterEvent
  id: GasSpillOxy
  gasToSpawn: Oxygen
  announcement: gas-spill-oxygen

- type: supermatterEvent
  id: GasSpillPlasma
  gasToSpawn: Plasma
  announcement: gas-spill-plasma

- type: supermatterEvent
  id: GasSpillNitrogen
  gasToSpawn: Nitrogen
  announcement: gas-spill-nitrogen

- type: supermatterEvent
  id: GasSpillCarbon
  gasToSpawn: CarbonDioxide
  announcement: gas-spill-carbondioxide

- type: supermatterEvent
  id: GasSpillFrezon
  gasToSpawn: Frezon
  announcement: gas-spill-frezon

- type: supermatterEvent
  id: SMShardSpawn
  protoToSpawn: SupermatterSliver
  announcement: supermatter-announcement-cc-tamper

- type: supermatterEvent
  id: SMAnomSpawn
  protoToSpawn: RandomAnomalySpawner
  announcement: supermatter-announcement-cc-tamper

- type: supermatterEvent
  id: SMBSAnomSpawn
  protoToSpawn: AnomalyBluespace
  announcement: supermatter-announcement-cc-tamper

- type: supermatterEvent
  id: SMCrabSpawn
  protoToSpawn: MobSupermatterCrab
  announcement: supermatter-announcement-cc-tamper

- type: supermatterEvent
  id: SMEMPSpawn
  protoToSpawn: AdminInstantEffectEMP7
  announcement: supermatter-energy-surge

- type: supermatterEvent
  id: SMGravitySpawn
  protoToSpawn: AdminInstantEffectGravityWell
  announcement: supermatter-energy-surge

# Spawned by the SMCrabSpawn event.
- type: entity
  parent: MobOreCrab
  id: MobSupermatterCrab
  description: An ore crab made from Supermatter.
  suffix: Supermatter
  components:
  - type: SupermatterImmune
  - type: RadiationSource
    intensity: 1.0
  - type: Sprite
    state: bananium_crab
  - type: FactionException
  - type: NPCRetaliation
    attackMemoryLength: 10
  - type: NpcFactionMember
    factions:
      - SimpleNeutral
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SupermatterSliver:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Slippery
    slipData:
      launchForwardsMultiplier: 2
  - type: StepTrigger
    intersectRatio: 0.2
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        hard: false
        layer:
          - SlipLayer
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 3
        Radiation: 5

# EMP with a 7 meter range, used by the SMEMPSpawn event.
- type: entity
  parent: AdminInstantEffectBase
  id: AdminInstantEffectEMP7
  categories: [ HideSpawnMenu ]
  suffix: EMP, 7 meters
  components:
  - type: EmpOnTrigger
    range: 7
    energyConsumption: 50000
