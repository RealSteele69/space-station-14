- type: entity
  parent: BaseItem
  id: SupermatterSliver
  name: supermatter sliver
  description: A shard from the station's supermatter crystal. Highly radioactive.
  components:
    - type: PointLight
      enabled: true
      radius: 3
      energy: 2
      color: "#fff633"
    - type: RadiationSource
      intensity: .75
    - type: Icon
      sprite: _ClawCommand/Objects/Misc/supermatter_sliver.rsi
      state: icon
    - type: Sprite
      sprite: _ClawCommand/Objects/Misc/supermatter_sliver.rsi
      state: icon
    - type: StealTarget
      stealGroup:
      - SupermatterSliver
    - type: Tag
      tags:
        - HighRiskItem
    - type: SupermatterImmune

- type: entity
  id: BaseHandheldStationMapSupermatterCe
  name: handheld supermatter console
  description: Fine-crafted handheld supermatter console for Chief Engineers. Allows the user to view the supermatter's status.
  parent: BaseItem
  components:
    - type: Sprite
      sprite: _ClawCommand/Objects/Devices/supermatter_tablet.rsi
      layers:
        - state: tablet
        - state: supermatterconsole
          shader: unshaded
    - type: ActivatableUI
      inHandsOnly: true
      singleUser: true
      key: enum.SupermatterConsoleUiKey.Key
    - type: SupermatterConsole
    - type: UserInterface
      interfaces:
        enum.SupermatterConsoleUiKey.Key:
          type: SupermatterConsoleBoundUserInterface

# Diode discs, installed into an emitter to change how its bolts affect the supermatter.

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseDiodeDisc
  components:
  - type: Sprite
    sprite: _ClawCommand/Objects/Tools/diodedisc.rsi
    state: icon

- type: entity
  parent: BaseDiodeDisc
  id: DiodeDiscElectroDisruptive
  name: Electro-Disruptive Diode disc
  description: A diode disc for use within an emitter, this one will trigger a causality rectifying event within a supermatter, causing it to repair itself.
  components:
  - type: DiodeDisc
    newBolt: EmitterBoltElectroDisruptive
    upgrade: emitter-electro-disrutpive

- type: entity
  parent: BaseDiodeDisc
  id: DiodeDiscElectroBehavioural
  name: Electro-Behavioural Diode disc
  description: A diode disc for use within an emitter, this one will trigger a causality cascading event within a supermatter, causing damage but increasing energy output significantly. It also has a postive effect on patients health!
  components:
  - type: DiodeDisc
    newBolt: EmitterBoltElectroBehavioural
    upgrade: emitter-electro-behavioural

- type: entity
  name: emitter bolt
  id: EmitterBoltElectroDisruptive
  parent: EmitterBolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags:
    - EmitterBolt
  - type: Projectile
    damage:
      types:
        Heat: 14
        Blunt: 6
  - type: AngeringProjectile
    integDamage: -1
    energyDamage: -60

- type: entity
  name: emitter bolt
  id: EmitterBoltElectroBehavioural
  parent: EmitterBolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags:
    - EmitterBolt
  - type: Projectile
    damage:
      types:
        Heat: -5
        Blunt: -2
  - type: AngeringProjectile
    integDamage: 1
    energyDamage: 100
