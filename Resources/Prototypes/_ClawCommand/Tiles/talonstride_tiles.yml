# --- Tile stacks (from _Nuclear14/Stacks/floor_tile_stacks.yml) ---
# Claw Command - this fork's stack prototypes take a LocId name and inherit BaseTileStack
# (icon + maxCount); names live in Locale/en-US/_ClawCommand/talonstride/n14.ftl.

- type: stack
  parent: BaseTileStack
  id: FloorTileMetalGreen
  name: stack-n14-metal-floor-green
  spawn: FloorTileItemMetalGreen

- type: stack
  parent: BaseTileStack
  id: FloorTileMetalGrey
  name: stack-n14-metal-floor-grey
  spawn: FloorTileItemMetalGrey

- type: stack
  parent: BaseTileStack
  id: FloorTileMetalPurpleSolid
  name: stack-n14-metal-floor-purple-solid
  spawn: FloorTileItemMetalPurpleSolid

- type: stack
  parent: BaseTileStack
  id: FloorTileMetalRedSolid
  name: stack-n14-metal-floor-red-solid
  spawn: FloorTileItemMetalRedSolid

- type: stack
  parent: BaseTileStack
  id: FloorTileMetalTeal
  name: stack-n14-metal-floor-teal
  spawn: FloorTileItemMetalTeal

- type: stack
  parent: BaseTileStack
  id: FloorTileMetalWhiteSolid
  name: stack-n14-metal-floor-white-solid
  spawn: FloorTileItemMetalWhiteSolid

- type: stack
  parent: BaseTileStack
  id: FloorTileMetalYellow
  name: stack-n14-metal-floor-yellow
  spawn: FloorTileItemMetalYellow

- type: stack
  parent: BaseTileStack
  id: FloorTileMetalYellowSolid
  name: stack-n14-metal-floor-yellow-solid
