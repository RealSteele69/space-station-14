# --- Floor tile items for the coloured metal floors (from _Nuclear14/Entities/Objects/Misc/tiles.yml) ---

- type: entity
  name: metal floor green
  parent: FloorTileItemBase
  id: FloorTileItemMetalGreen
  components:
  - type: Sprite
    state: steel
  - type: Item
