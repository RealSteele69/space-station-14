# Ported from space/ (Nuclear14 via Floof) for the TalonStride map.
# Tiles from _Nuclear14/Tiles/floors.yml, plus the footstep sound collections, floor tile
# items and tile stacks they reference. Follows the style of glacier_tiles.yml.
# Textures (Resources/Textures/_Nuclear14/Tiles/...) and audio
# (Resources/Audio/_Nuclear14/Effects/Footsteps/...) were already present in this fork.

# --- Footstep sound collections (from _Nuclear14/SoundCollections/footsteps.yml) ---

- type: soundCollection
  id: N14FootstepWood
  files:
  - /Audio/_Nuclear14/Effects/Footsteps/Wood/wood1.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/Wood/wood2.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/Wood/wood3.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/Wood/wood4.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/Wood/wood5.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/Wood/wood6.ogg

- type: soundCollection
  id: N14FootstepConcrete
  files:
  - /Audio/_Nuclear14/Effects/Footsteps/Concrete/concrete1.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/Concrete/concrete2.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/Concrete/concrete3.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/Concrete/concrete4.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/Concrete/concrete5.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/Concrete/concrete6.ogg

- type: soundCollection
  id: N14FootstepConcreteBroken
  files:
  - /Audio/_Nuclear14/Effects/Footsteps/ConcreteBroken/concretebroken1.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/ConcreteBroken/concretebroken2.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/ConcreteBroken/concretebroken3.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/ConcreteBroken/concretebroken4.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/ConcreteBroken/concretebroken5.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/ConcreteBroken/concretebroken6.ogg

- type: soundCollection
  id: N14FootstepMetalSolid
  files:
  - /Audio/_Nuclear14/Effects/Footsteps/MetalSolid/metalsolid1.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/MetalSolid/metalsolid2.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/MetalSolid/metalsolid3.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/MetalSolid/metalsolid4.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/MetalSolid/metalsolid5.ogg
  - /Audio/_Nuclear14/Effects/Footsteps/MetalSolid/metalsolid6.ogg

# --- Coloured metal floors ---

# --- FloorMetalGreen ---
- type: tile
  id: FloorMetalGreen
  name: metal green
  sprite: /Textures/_Nuclear14/Tiles/metalgreen.png
  baseTurf: Plating #Floofstation
  isSubfloor: false
  deconstructTools: [ Prying ]
  footstepSounds:
    collection: N14FootstepMetalHollow
  friction: 0.30
  itemDrop: FloorTileItemMetalGreen
  thermalConductivity: 0.04
  heatCapacity: 10000
  weather: false #floofstation

