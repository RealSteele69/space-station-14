- type: antag
  id: Vampire
  name: roles-antag-vampire-name
  antagonist: true
  setPreference: true
  objective: roles-antag-vampire-description
  guides: [ Vampire ]
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 36000 # 10h - a dangerous, hard-to-kill predator antag

- type: antagSpecifier
  parent: RestrictedAntag
  id: Vampire
  prefRoles:
  - Vampire
  # Silicons have no blood to drink or feed with.
  jobBlacklist:
  - StationAi
  - Borg
  mindRoles:
  - VampireMindRole

- type: entity
  parent: BaseMindRoleAntag
  id: VampireMindRole
  name: Vampire Role
  components:
  - type: MindRole
    antag: true
    antagPrototype: Vampire
    exclusiveAntag: true
    roleType: SoloAntagonist
    subtype: role-subtype-vampire
  - type: VampireRole

# Rolled as a sub-gamemode, same as other solo antags here - never cancels a preset on its own.
- type: entity
  parent: BaseGameRule
  id: Vampire
  components:
  - type: VampireRule
  - type: GameRule
    minPlayers: 15
    cancelPresetOnTooFewPlayers: false
  - type: AntagObjectives
    objectives:
    - VampireLairObjective
    - VampireProtegeObjective
    - VampireBloodHarvestObjective
    - VampireSurviveObjective
  - type: AntagSelection
    selectionTime: JobsAssigned
    agentName: vampire-roundend-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Vampire
      range:
        min: 1
        max: 6
      playerRatio: 10
  - type: Tag
    tags:
    - CalmAntag

- type: npcFaction
  id: VampireFaction
  hostile:
  - NanoTrasen

- type: damageModifierSet
  id: VampireUndeadResilience
  coefficients:
    Blunt: 0.8
    Slash: 0.8
    Piercing: 0.8
    Cold: 0.0

- type: alert
  id: VampireBlood
  icons:
  - sprite: /Textures/Interface/Alerts/bleed.rsi
    state: bleed0
  - sprite: /Textures/Interface/Alerts/bleed.rsi
    state: bleed1
  - sprite: /Textures/Interface/Alerts/bleed.rsi
