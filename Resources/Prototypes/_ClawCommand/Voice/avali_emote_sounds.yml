# _ClawCommand: Avali emote sound bindings.
# Avali-specific audio lives in Resources/Audio/_ClawCommand/Voice/Avali (see attributions.yml there).
# Bird calls reuse the Resomi chirp/trill/warble collections; the emotes themselves are unlocked for
# Avali through Speech.allowedEmotes on MobAvali. AvaliScreams/AvaliLaughs are shared with Resomi.

- type: soundCollection
  id: AvaliScreams
  files:
  - /Audio/_ClawCommand/Voice/Avali/avali_scream.ogg

- type: soundCollection
  id: AvaliLaughs
  files:
  - /Audio/_ClawCommand/Voice/Avali/avali_laugh.ogg

- type: soundCollection
  id: AvaliCries
  files:
  - /Audio/_ClawCommand/Voice/Avali/avali_cry.ogg

- type: soundCollection
  id: AvaliWhistles
  files:
  - /Audio/_ClawCommand/Voice/Avali/avali_whistle.ogg

- type: emoteSounds
  id: MaleAvali
  voiceSelectorName: humanoid-profile-editor-voice-masculine
  params:
    variation: 0.125
  sounds:
    Scream:
      collection: AvaliScreams
    Laugh:
      collection: AvaliLaughs
    Chirp:
      collection: ResomiChirps
    Trill:
      collection: ResomiTrills
    Warble:
      collection: ResomiWarbles
    Purr:
      collection: FelinidPurrs
    Growl:
      collection: VulpkaninGrowls
    Sneeze:
      collection: MaleSneezes
    Cough:
      collection: MaleCoughs
    CatMeow:
      collection: FelinidMeows # Claw Command - varied space-ported meows for *meows emote
    CatHisses:
      collection: CatHisses
    MonkeyScreeches:
      collection: MonkeyScreeches
    RobotBeep:
      collection: RobotBeeps
    Yawn:
      collection: MaleYawn
    Snore:
      collection: Snores
    Honk:
      collection: BikeHorn
    Sigh:
      collection: MaleSigh
    Crying:
      collection: AvaliCries
    Whistle:
      collection: AvaliWhistles
    Weh:
      collection: Weh
    Gasp:
      collection: MaleGasp
    DefaultDeathgasp:
      collection: MaleDeathGasp

- type: emoteSounds
  id: FemaleAvali
  voiceSelectorName: humanoid-profile-editor-voice-feminine
  params:
    variation: 0.125
  sounds:
    Scream:
      collection: AvaliScreams
    Laugh:
      collection: AvaliLaughs
    Chirp:
      collection: ResomiChirps
    Trill:
      collection: ResomiTrills
    Warble:
      collection: ResomiWarbles
    Purr:
      collection: FelinidPurrs
    Growl:
      collection: VulpkaninGrowls
    Sneeze:
      collection: FemaleSneezes
    Cough:
      collection: FemaleCoughs
    CatMeow:
      collection: FelinidMeows # Claw Command - varied space-ported meows for *meows emote
    CatHisses:
      collection: CatHisses
    MonkeyScreeches:
      collection: MonkeyScreeches
    RobotBeep:
      collection: RobotBeeps
    Yawn:
      collection: FemaleYawn
    Snore:
      collection: Snores
    Honk:
      collection: CluwneHorn
    Sigh:
      collection: FemaleSigh
    Crying:
      collection: AvaliCries
    Whistle:
      collection: AvaliWhistles
    Weh:
      collection: Weh
    Gasp:
      collection: FemaleGasp
    DefaultDeathgasp:
      collection: FemaleDeathGasp
