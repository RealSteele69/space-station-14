# _ClawCommand: Rodentia voice. Human voice sets, with a mouse squeak for screams and *squeak.

- type: emoteSounds
  id: MaleRodentia
  voiceSelectorName: humanoid-profile-editor-voice-masculine
  params:
    variation: 0.125
  sounds:
    Scream:
      path: /Audio/Animals/mouse_squeak.ogg
    Laugh:
      collection: MaleLaugh
    Sneeze:
      collection: MaleSneezes
    Cough:
      collection: MaleCoughs
    Yawn:
      collection: MaleYawn
    Snore:
      collection: Snores
    Honk:
      collection: BikeHorn
    Sigh:
      collection: MaleSigh
    Crying:
      collection: MaleCry
    Whistle:
      collection: Whistles
    Weh:
      collection: Weh
    Squeak:
      path: /Audio/Animals/mouse_squeak.ogg
    CatMeow:
      collection: CatMeows
    Gasp:
      collection: MaleGasp
    DefaultDeathgasp:
      collection: MaleDeathGasp

