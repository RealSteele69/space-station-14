# Ported from Goobstation for ClawCommand.
#
# Fork note (big adaptation, same shape as _GoobStation/SlaughterDemon/GameRules/slaughter_demon.yml):
# upstream replaced AntagSelectionComponent.Definitions: List<...> with Antags: AntagCountSelector[]
# + a separate "antagSpecifier" prototype. The old "definitions[].components" list (which used to
# carry SlasherKitSelect/UserInterface/GhostRole/GhostTakeoverAvailable together) now lives on the
# antagSpecifier's own "components" field (added to the spawned player entity).
#
# Also dropped/adapted on the GameRule entity itself:
# - StationEventComponent has no "chaos"/"eventType" fields on this fork.
# - GameRuleComponent has no "chaosScore" field.
# - AntagLoadProfileRuleComponent has no "forceMaxSize" field.
# - "GunBlocked" doesn't exist here (and source's own comment already called it broken upstream
#   inside AntagSelection) - dropped, not replaced.
# - "GrabIntent" doesn't exist as an opt-in component here - this fork's grab-escalation ladder
#   (PullerComponent.GrabStage) is already available to everyone, so the slasher gets it for free.
# - "BreathingImmunity" doesn't exist under that name - dropped (minor, the slasher is rarely in
#   vacuum long enough for it to matter; SlasherIncorporealComponent still grants the Goobstation
#   Special*ImmunityComponent stubs while actually incorporeal).
# - NightVision: Action (EntProtoId, not "toggleAction"), LightingColor (not "color"), no
#   activateSound/deactivateSound fields on this fork's NightVisionComponent.
# - "Hunger"/"Thirst" components (with baseDecayRate: 0) don't exist - this fork replaced them
#   fork-wide with a unified Content.Shared.Nutrition.Components.SatiationComponent keyed by
#   SatiationTypePrototype, with no simple decay-rate override field. Rather than hand-build a
#   full satiation dictionary just to turn off starvation for one antag, this was dropped - the
#   Slasher eats/drinks like a normal human. Minor QoL loss, not a balance issue.
# - speciesOverrideBlacklist entries use this fork's real species roster/IDs: Yowie/Harpy/
#   Plasmaman don't exist here at all (different species list than Goobstation), and IPC/Synth
#   are "SpeciesIPC"/"SpeciesSynth" here, not bare "IPC"/"Synth".

- type: antagSpecifier
  id: SlasherSpecifier
  spawnerPrototype: SpawnPointGhostSlasher
  pickPlayer: false
  mindRoles:
  - MindRoleSlasher
  briefing:
    text: slasher-role-greeting
    color: Red
    sound: /Audio/_GoobStation/Effects/Slasher/SlasherIntro.ogg
  components:
  - type: SlasherKitSelect
    kits:
      slasher-kit-butcher:
        gear: SlasherGear
        description: slasher-kit-butcher-desc
        grantedToVictimOnSight:
        - type: SlasherFearOverlay
        sprite:
          sprite: _GoobStation/Objects/Specific/Slasher/mask.rsi
          state: icon
      slasher-kit-spring:
        gear: SlasherGearSpring
        description: slasher-kit-spring-desc
        grantedToVictimOnSight:
        - type: SlasherFearOverlay
        sprite:
          sprite: _GoobStation/Objects/Specific/Slasher/spring_mask.rsi
          state: icon
        machetePrototype: SlasherMacheteSpring
        bloodTrailMusic:
          path: /Audio/_GoobStation/Slasher/Music/fnaf_bonnies_lullaby.ogg
          params:
            volume: -4
            loop: true
      slasher-kit-billy:
        gear: SlasherGearBilly
        description: slasher-kit-billy-desc
        grantedToVictimOnSight:
        - type: SlasherFearOverlay
        sprite:
          sprite: Objects/Tools/crowbar.rsi
          state: icon
        machetePrototype: SlasherCrowbar
        bloodTrailMusic:
          path: /Audio/_GoobStation/Slasher/Music/that_handsome_devil_midi.ogg
          params:
            volume: -7
            loop: true
      slasher-kit-cult:
        gear: SlasherGearCult
        description: slasher-kit-cult-desc
        grantedToVictimOnSight:
        - type: SlasherFearOverlay
        sprite:
          sprite: Clothing/Head/Hoods/cult.rsi
          state: icon
        machetePrototype: SlasherEldritchBlade
        bloodTrailMusic:
          path: /Audio/_GoobStation/Slasher/Music/cultist_chant.ogg
          params:
            loop: true
      slasher-kit-maintenance:
        gear: SlasherGearMaintenance
        description: slasher-kit-maintenance-desc
        grantedToVictimOnSight:
        - type: SlasherFearOverlay
        sprite:
          sprite: Clothing/Head/Hats/papersacksmile.rsi
          state: icon
        machetePrototype: SlasherButchCleaver
        bloodTrailMusic:
          path: /Audio/_GoobStation/Slasher/Music/scared_to_bits.ogg
          params:
            loop: true
      slasher-kit-cannibal:
        gear: SlasherGearCannibal
        description: slasher-kit-cannibal-desc
        grantedToVictimOnSight:
        - type: SlasherFearOverlay
        sprite:
          sprite: _GoobStation/Wizard/Clothing/Mask/pig.rsi
          state: icon
        machetePrototype: SlasherButchCleaver
        bloodTrailMusic:
          path: /Audio/_GoobStation/Slasher/Music/horror_violin_string.ogg
          params:
            volume: -7
            loop: true
      slasher-kit-clown:
        gear: SlasherGearClown
        description: slasher-kit-clown-desc
        grantedToVictimOnSight:
        - type: SlasherFearOverlay
        sprite:
          sprite: Clothing/Mask/clown.rsi
          state: icon
        machetePrototype: SlasherOffsetCaneClown
        bloodTrailMusic:
          path: /Audio/_GoobStation/Slasher/Music/naktigonis_catwhisker.ogg
          params:
            volume: -7
            loop: true
        jumpscareSound:
          path: /Audio/Items/Toys/pushHornHonk.ogg
        meatSpikePrototype: SlasherMeatSpikeClown
        bloodTrailReagent: Honk
        soulStealSound:
          path: /Audio/Items/Toys/pushHornHonk.ogg
        ascensionGear: SlasherGearClownAscended
        ascendanceAnnouncementKey: slasher-soulsteal-ascendance-clown
        ascendanceSound:
          path: /Audio/Items/Toys/pushHornHonk.ogg
          params:
            volume: -2
      slasher-kit-glutton:
        gear: SlasherGearGlutton
        description: slasher-kit-glutton-desc
        grantedToVictimOnSight:
        - type: SlasherFearOverlay
        sprite:
          sprite: Clothing/OuterClothing/Hardsuits/lingspacesuit.rsi
          state: icon
        machetePrototype: SlasherButchCleaver
        bloodTrailMusic:
          path: /Audio/_GoobStation/Slasher/Music/padtext_horror.ogg
          params:
            volume: -7
            loop: true
      slasher-kit-hockey:
        gear: SlasherGearHockey
        description: slasher-kit-hockey-desc
        grantedToVictimOnSight:
        - type: SlasherFearOverlay
        sprite:
          sprite: _GoobStation/Objects/Specific/Slasher/hockymask/hockey_mask.rsi
          state: icon
        bloodTrailMusic:
          path: /Audio/_GoobStation/Slasher/Music/horror_synthwave.ogg
          params:
            volume: -7
            loop: true
      slasher-kit-boogeyman:
        gear: SlasherGearBoogeyman
        description: slasher-kit-boogeyman-desc
        guide: SlasherBoogeyman
        sprite:
          sprite: _GoobStation/Objects/Specific/Slasher/boogeyman/mask.rsi
          state: icon
        machetePrototype: SlasherKitchenKnife
        bloodTrailMusic:
          path: /Audio/_GoobStation/Slasher/Music/halloween.ogg
          params:
            loop: true
        removeComponents:
        - type: SlasherIncorporeal
        components:
        - type: BoogeymanShadow
        - type: MovementSpeedModifier
          baseWalkSpeed: 5.0
          baseSprintSpeed: 5.0
    postSelectionComponents:
    - type: Slasher
    - type: SlasherSummonMachete
    - type: SlasherStaggerArea
    - type: SlasherRelentlessGrab
    - type: SlasherRegenerate
    - type: SlasherFear
    - type: SlasherIncorporeal
    - type: SlasherSoulSteal
    - type: SlasherSummonMeatSpike
    - type: NightVision
      lightingColor: "#FF0000"
      action: ActionSlasherNightVision
    - type: WeakToHoly
    - type: MobThresholds
      thresholds:
        0: Alive
        150: Dead
    - type: RandomMetadata
      nameSegments:
      - NamesSlasherTitle
      - NamesSlasher
      nameFormat: name-format-slasher
  - type: UserInterface
    interfaces:
      enum.SlasherKitSelectUiKey.Key:
        type: SlasherKitSelectBoundUserInterface
  - type: GhostRole
    name: ghost-role-information-slasher-name
    description: ghost-role-information-slasher-description
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
  - type: GhostTakeoverAvailable

- type: entity
  parent: BaseGameRule
  id: SlasherSpawn
  components:
  - type: StationEvent
    weight: 3
    duration: null
    earliestStart: 30
    minimumPlayers: 30
  - type: GameRule
  - type: AntagLockerSpawn
  - type: AntagLoadProfileRule
    speciesOverride: Human
    speciesOverrideBlacklist:
    - SpeciesIPC
    - Diona
    - SpeciesSynth
  - type: AntagObjectives
    objectives:
    - SlasherSurviveObjective
    - SlasherAbsorbSoulsObjective
  - type: AntagSelection
    selectionTime: RuleStarted
    agentName: slasher-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: SlasherSpecifier
