# Ported from Goobstation for ClawCommand.
#
# Fork note: source's ghost-role spawner used mindRoles: [ MindRoleGhostRoleSoloAntagonistGoob ],
# a Goobstation-specific mind role variant that doesn't exist here. Uses the plain
# MindRoleGhostRoleSoloAntagonist (already used by this fork's other ghost-role antags, e.g.
# Dragon). Also dropped the "SpawnPointGhostSlasherToken" secondary/relic-token spawner variant -
# it isn't referenced by the actual GameRule and is a minor convenience spawner, not core to the
# feature.

- type: antag
  id: Slasher
  name: roles-antag-slasher-name
  antagonist: true
  setPreference: false
  objective: roles-antag-slasher-objectives
  guides: [ Slasher ]

- type: entity
  categories: [ HideSpawnMenu, Spawner ]
  parent: BaseAntagSpawner
  id: SpawnPointGhostSlasher
  components:
  - type: GhostRole
    name: ghost-role-information-slasher-name
    description: ghost-role-information-slasher-description
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: default
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - sprite: _GoobStation/Objects/Specific/Slasher/machete.rsi
      state: icon

- type: startingGear
  id: SlasherGear
  equipment:
    jumpsuit: ClothingUniformSlasher
    back: ClothingBackpackSatchel
    head: ClothingHeadHatSlasherMask
    gloves: ClothingHandsSlasherGloves
    outerClothing: ClothingOuterSlasherApron
    shoes: ClothingShoesSlasher
    id: AgentIDCard

- type: startingGear
  id: SlasherGearSpring
  parent: SlasherGear
  equipment:
    head: ClothingHeadHatSlasherMaskSpring
    outerClothing: ClothingOuterSlasherApronSpring

- type: startingGear
  id: SlasherGearBilly
