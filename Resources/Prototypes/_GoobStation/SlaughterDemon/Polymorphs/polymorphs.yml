# Ported from Goobstation for ClawCommand.
# Fork note: this fork's PolymorphConfiguration has no componentsToTransfer/attachToGridOrMap/showPopup
# fields (only entity/forced plus the usual Transfer*/RevertOn* flags, which default sensibly here -
# TransferDamage/RevertOnCrit/RevertOnDeath already default to true). Source used componentsToTransfer to
# carry LanguageKnowledge/LanguageSpeaker/Grammar/SlaughterDevour onto the jaunt form; those are instead
# baked directly onto PolymorphBloodCrawlJaunt itself (see Mobs/NPC/polymorph.yml).

- type: polymorph
  id: BloodCrawlJaunt
  configuration:
    entity: PolymorphBloodCrawlJaunt
    forced: true
