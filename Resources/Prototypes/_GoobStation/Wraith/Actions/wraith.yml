# Ported from Goobstation for ClawCommand.

# This file includes all the actions for wraith.
# Revenants, other ghost-roles should get their own directory outside the Wraith one.

#   - type: ActionWraithPoints -> Removes Wraith Points once the action gets handled
#    wpConsume: int -> Amount of Wraith Points to remove

# Base Wraith Actions
# Fork note: dropped ActionToggleGhostHearingWraith - source itself marks it "Unused - Requires Rework of
# ghost system to allow re-usable actions", and its iconOn field doesn't exist on this fork's
# ActionComponent either. Dead code in source; not referenced from any ActionGrant.

- type: entity
  id: ActionHaunt
  name: Haunt
  description: Become corporeal for 30 seconds. During this time, you gain additional wraith points, depending on the amount of humans in your vicinity. Use this ability again while corporeal to fade back into the aether.
  components:
  - type: Sprite
    sprite: _GoobStation/Wraith/actions.rsi
    state: haunt
  - type: Action
    sound: !type:SoundPathSpecifier
      path: /Audio/_GoobStation/Wraith/wraithhaunt.ogg
    useDelay: 30
  - type: InstantAction
    event: !type:HauntEvent

- type: entity
  id: ActionWraithWhisper
  parent: DemonicWhisperAction
  name: Ethereal Whisper
  description: Send an ethereal message to a living being.
  components:
  - type: Sprite
    sprite: _GoobStation/Wraith/actions.rsi
    state: whisper
  - type: Action
    sound: !type:SoundPathSpecifier
      path: /Audio/_GoobStation/Wraith/wraithwhisper2.ogg
    useDelay: 2

- type: entity
  id: ActionBloodWriting
  name: Blood Writing
  description: Write a spooky character on the ground.
  components:
  - type: Sprite
    sprite: _GoobStation/Wraith/actions.rsi
    state: blood_writing
  - type: Action
    useDelay: 5
  - type: InstantAction
    event: !type:BloodWritingEvent

- type: entity
  id: ActionAbsorbCorpse
  name: Absorb corpse
  description: Steal life essence from a corpse. You cannot use this on a skeleton!
  components:
  - type: Sprite
    sprite: _GoobStation/Wraith/actions.rsi
    state: absorb_corpse
  - type: Action
    sound: !type:SoundPathSpecifier
      path: /Audio/_GoobStation/Wraith/wraithsoulsucc1.ogg
    useDelay: 45
    itemIconStyle: BigAction
  - type: TargetAction
    deselectOnMiss: true
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      requireAll: true
      components:
      - MobState
      - HumanoidProfile
    event: !type:AbsorbCorpseEvent
  - type: ActionWraithPoints
    wpConsume: 20
  - type: ActionUseDelayOnUse
    useDelayAccumulator: 45

- type: entity
  id: ActionSpook
  name: Spook
  description: Cause freaky, weird, creepy or spooky stuff to happen in an area around you. Use this ability to spawn an entity as the origin of these events, then interact with it to select which action to use.
  components:
  - type: Sprite
    sprite: _GoobStation/Wraith/actions.rsi
    state: spook
  - type: Action
    sound: !type:SoundPathSpecifier
      path: /Audio/_GoobStation/Wraith/wraithspook1.ogg
    itemIconStyle: BigAction
    useDelay: 30
  - type: TargetAction
    range: 10
  - type: WorldTargetAction
    event: !type:SpookEvent
  - type: ActionWraithPoints
    wpConsume: 20

- type: entity
  id: ActionDecay
  name: Decay
  description: Cause a human to lose stamina, or an object to malfunction.
  components:
  - type: Sprite
    sprite: _GoobStation/Wraith/actions.rsi
    state: decay
  - type: Action
    sound: !type:SoundPathSpecifier
      path: /Audio/_GoobStation/Wraith/wraithstaminadrain.ogg
    useDelay: 60
    itemIconStyle: BigAction
  - type: TargetAction
    deselectOnMiss: true
  - type: EntityTargetAction
    canTargetSelf: false
    blacklist:
      components:
      - BorgChassis
      - BibleUser
    event: !type:DecayEvent
  - type: ActionWraithPoints
    wpConsume: 30

- type: entity
  id: ActionCommand
  name: Command
  description: Command a few objects to hurl themselves at the target location.
  components:
  - type: Sprite
    sprite: _GoobStation/Wraith/actions.rsi
    state: command
  - type: Action
    useDelay: 40
    itemIconStyle: BigAction
  - type: TargetAction
    range: 10
  - type: EntityTargetAction
    canTargetSelf: false
    blacklist:
      components:
      - BibleUser
    event: !type:WraithCommandEvent
  - type: ActionWraithPoints
    wpConsume: 50

- type: entity
  id: ActionAnimateObject
  parent: ActionAnimateSpell
  name: Animate object
  description: Animate an inanimate object to attack nearby humans.
  components:
  - type: Sprite
    sprite: _GoobStation/Wraith/actions.rsi
    state: anim_object
  - type: Action
    sound: !type:SoundPathSpecifier
      path: /Audio/_GoobStation/Wraith/wraithlivingobject.ogg
    useDelay: 60
  - type: ActionWraithPoints
    wpConsume: 200

- type: entity
  id: ActionPossessObject
  name: Possess object
  description: Possess and control an everyday object. Freakout level high.
  components:
  - type: ActionWraithPoints
    wpConsume: 300
  - type: Sprite
    sprite: _GoobStation/Wraith/actions.rsi
    state: possess_object
  - type: Action
    itemIconStyle: BigAction
    useDelay: 150
  - type: TargetAction
    deselectOnMiss: true
  - type: EntityTargetAction
    whitelist:
      components:
      - Animateable # Currently on: SeatBase, TableBase, ClosetBase, BaseMachine, ConstructibleMachine, BaseComputer, BaseItem, CrateGeneric, StorageTank, GasCanister
    blacklist:
      components:
      - NukeDisk
      - GravityGenerator
      - AnomalyGenerator
      - TegGenerator
      - TegCirculator
      - XenoArtifact
      - Ghost
      - Spectral
      - FadingTimedDespawn
      - TimedDespawn
    event: !type:PossessObjectEvent
      toAdd:
      - type: Animate
      - type: MindContainer
      - type: InputMover
      - type: MobMover
      - type: CombatMode
      - type: MeleeWeapon
        animation: WeaponArcSlash
        wideAnimation: WeaponArcClaw
        altDisarm: false
        soundHit:
          collection: AlienClaw
        range: 1.5
        angle: 0.0
        damage:
          types:
            Slash: 20
      - type: NpcFactionMember
        factions:
        - Wraith
      - type: NoSlip
      - type: MovementSpeedModifier
        baseWalkSpeed: 5
        baseSprintSpeed: 5
      - type: MovementAlwaysTouching
      - type: CanMoveInAir
      - type: Damageable
        damageModifierSet: ManifestedSpirit
      - type: Destructible
        thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 300 #Easily killable with holy damage so it has to be somewhat high for it to be worth the wraith risking it
          behaviors:
          - !type:DoActsBehavior
            acts: ["Destruction"]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
      - type: Hands
      - type: CanEscapeInventory
      - type: MobCollision
      - type: LanguageSpeaker
      - type: UniversalLanguageSpeaker
      - type: Speech
        speechVerb: Ghost
      toRemove:
      - RequireProjectileTarget
      - BlockMovement
      - Item
      - MeleeRequiresWield

- type: entity
  id: ActionEvolve
  name: Evolve
  description: Choose a form to evolve into once you have absorbed at least 3 souls.
  components:
  - type: Sprite
    sprite: _GoobStation/Wraith/actions.rsi
    state: evolve
  - type: Action
    useDelay: 0
  - type: InstantAction
    event: !type:WraithEvolveEvent
  - type: ActionWraithPoints
    wpConsume: 150

# Harbinger Actions
- type: entity
  id: ActionRaiseSkeleton
  name: Raise skeleton
  description: Raise a skeletonized dead body or fill a locker with an indurable skeletal servant.
  components:
  - type: Sprite
    sprite: _GoobStation/Wraith/actions.rsi
    state: skeleton
  - type: Action
    sound: !type:SoundPathSpecifier
      path: /Audio/_GoobStation/Wraith/wraithraise1.ogg
    useDelay: 60
    itemIconStyle: BigAction
  - type: TargetAction
    range: 15
    deselectOnMiss: true
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - EntityStorage
      - HumanoidProfile
    event: !type:RaiseSkeletonEvent
  - type: ActionWraithPoints
    wpConsume: 100

- type: entity
  id: ActionSummonVoidPortal
  name: Summon void portal
  description: Summon a void portal from which otherworldly creatures pour out.
  components:
  - type: ConfirmableAction
    popup: wraith-portal-already
    primeTime: 10
  - type: Sprite
    sprite: _GoobStation/Wraith/actions.rsi
    state: open_portal
  - type: Action
    sound: !type:SoundPathSpecifier
      path: /Audio/_GoobStation/Wraith/wraithportal.ogg
    useDelay: 180
  - type: InstantAction
    event: !type:SummonPortalEvent
  # Fork note: this fork already has a vanilla ActionUserWhitelistComponent (same feature, different field
  # names: Whitelist required, OnFailPopup instead of Popup). Our own duplicate was dropped as redundant.
  - type: ActionUserWhitelist
    whitelist:
      components:
      - Corporeal
    onFailPopup: wraith-must-be-corporeal
  - type: ActionWraithPoints
    wpConsume: 150

- type: entity
  id: ActionSummonVoidCreature
  name: Summon void creatures
  description: Attempt to breach the veil between worlds to allow a lesser void creature to enter this realm.
  components:
  - type: Sprite
    sprite: _GoobStation/Wraith/actions.rsi
    state: summon_creature
  - type: Action
    useDelay: 150
  - type: InstantAction
    event: !type:SummonVoidCreatureEvent
  - type: ActionWraithPoints
    wpConsume: 400

- type: entity
  id: ActionMakeRevenant
  name: Make revenant
  description: Take control of an intact corpse as a powerful Revenant! You will not be able to absorb this corpse later. As a revenant, you gain increased point generation, but your revenant abilities cost much more points than normal.
  components:
  - type: Sprite
    sprite: _GoobStation/Wraith/actions.rsi
    state: revenant
  - type: Action
    useDelay: 60
    itemIconStyle: BigAction
  - type: TargetAction
    deselectOnMiss: true
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:MakeRevenantEvent
  - type: ActionWraithPoints
    wpConsume: 1000

