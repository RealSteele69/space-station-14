# Ported from Goobstation for ClawCommand.

# This holds all forms of the diseased rat
# Fork note: dropped transferComponents - this fork's DiseasedRatFormUnlockPrototype has no such field.
# The server DiseasedRatSystem evolves via a plain PolymorphEntity call, which already transfers
# name/damage; the Medium/Large forms below just define their own full component set directly instead.
- type: diseasedRatFormUnlock
  id: MediumDiseasedRat
  filthRequired: 6
  entity: MobPlagueRatMedium

- type: diseasedRatFormUnlock
  id: GiantDiseasedRat
  filthRequired: 12
  entity: MobPlagueRatLarge

