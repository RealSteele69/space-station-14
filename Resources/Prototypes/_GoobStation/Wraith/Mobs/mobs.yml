- type: entity
  id: MobAncientRepairBot # This mob is supposed to be a drone that auto-repairs stuff, but out of scope, and olny for adventure zones anyway.
  parent: [ BaseMob, MobCombat ]
  name: strange robot  #This mob is also supposed to shoot lightning bolts instead of slicing in meelee range, but since we don't have AI capable of using mob skills, that is to be added.
  description: It looks like some sort of floating repair bot or something?
  components:
  # Fork note: dropped Advertise (see MobCrunched).
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - Wraith
  - type: Prying
    pryPowered: true
  - type: ComplexInteraction
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: Sprite
    drawdepth: Mobs
    sprite: _GoobStation/Wraith/Mobs/ancient.rsi
    layers:
      - state: ancient_repairbot
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      collection: AlienClaw
    damage:
      types:
        Piercing: 10
  - type: MobState
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 20
        mask:
          - MobMask
        layer:
          - MobLayer
  # Fork note: "Repairbot" SoundCollection doesn't exist here; pointed at a direct path from the ported
  # audio files instead (Audio/_GoobStation/Wraith/Mobs/repairbot/).
  - type: SpamEmitSound
    minInterval: 10
    maxInterval: 30
    sound:
      path: /Audio/_GoobStation/Wraith/Mobs/repairbot/fixit.ogg
      params:
        volume: -1
        maxDistance: 12
        variation: 0.05
  - type: Damageable
    damageModifierSet: StrongMetallic
  - type: PointLight
    enabled: true
    color: "#790c24"
    radius: 3
    softness: 5
    autoRot: true
    castShadows: false
  - type: NoSlip
  - type: Pullable
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 30
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
  - type: Tag
    tags:
    - DoorBumpOpener

