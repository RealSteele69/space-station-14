# Ported from Goobstation for ClawCommand.

# This holds all simplemobs summoned by void portal.

- type: entity
  id: MobSkeletonGoon
  parent: [ BaseMob, MobCombat]
  name: malicious skeleton
  description: A hostile skeleton summoned by a wraith.
  components:
  - type: HTN # Fork note: source's XenomorphCompound HTN task doesn't exist here, substituted with SimpleHostileCompound.
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavSmash: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
  - type: Prying
    pryPowered: true
  - type: ComplexInteraction
  - type: NpcFactionMember
    factions:
    - Wraith
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 5
  - type: Sprite
    drawdepth: Mobs
    sprite: _GoobStation/Wraith/Mobs/skeleton.rsi
    layers:
      - state: skeletonGoon
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bone_rattle.ogg
    damage:
      types:
        Blunt: 15
        Structural: 30
  - type: MobState
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 60
        mask:
          - MobMask
        layer:
          - MobLayer
  - type: Damageable
    damageModifierSet: Skeleton
  - type: NoSlip
  - type: Pullable
  - type: ZombieImmune
  - type: Speech
    speechVerb: Skeleton
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 30
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              path: /Audio/Effects/bone_rattle.ogg
          - !type:SpawnEntitiesBehavior
            spawn:
              MaterialBones:
                min: 1
                max: 15
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
  - type: Vocal # Fork note: source's wilhelm sound path doesn't exist in the ported asset tree, dropped.
    emoteSounds: Skeleton
  - type: SkeletonAccent

- type: entity
  id: MobCrunched
  parent: [ BaseMob, MobCombat ]
  name: transposed scientist
  description: A fellow who seems to have been shunted between dimensions. Not a good state to be in.
  components:
  # Fork note: dropped Advertise (source's "CrunchedSpeech" flavor-chatter LocalizedDatasetPrototype
  # doesn't exist here, and isn't load-bearing for the mob's function as a minion).
  - type: Prying
    pryPowered: true
  - type: ComplexInteraction
  - type: NPCRetaliation
  - type: FactionException
  - type: NpcFactionMember
    factions:
    - Passive
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 5
  - type: Sprite
    drawdepth: Mobs
    sprite: _GoobStation/Wraith/Mobs/humanoid.rsi
    layers:
      - state: crunched
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcFist
    soundHit:
      collection: AlienClaw
    damage:
      types:
        Blunt: 7
  - type: MobState
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 60
        mask:
          - MobMask
        layer:
          - MobLayer
  - type: Damageable
    damageModifierSet: Cockroach
  - type: NoSlip
  - type: Pullable
  - type: Speech
    speechVerb: Ghost
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 40
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              path: /Audio/Effects/gib2.ogg
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound

- type: entity
  id: MobShade
  parent: [ BaseMob, MobCombat ]
  name: darkness
  description: Oh god.
  components:
  # Fork note: dropped Advertise (see MobCrunched). SpamEmitSound points at a direct path instead of a
  # "CreepyWhisper" SoundCollection - that collection doesn't exist here, but the actual audio files it
  # would have pointed to were still ported (Audio/_GoobStation/Wraith/Mobs/shade/).
  - type: SpamEmitSound
    minInterval: 5
    maxInterval: 25
    sound:
      path: /Audio/_GoobStation/Wraith/Mobs/shade/creepywhisper_1.ogg
      params:
        volume: 3
        maxDistance: 12
        variation: 0.01
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - Wraith
  - type: Prying
    pryPowered: true
  - type: ComplexInteraction
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: Sprite
    drawdepth: Mobs
    sprite: _GoobStation/Wraith/Mobs/humanoid.rsi
    layers:
      - state: shade
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    soundHit:
      collection: AlienClaw
    damage:
      types:
        Blunt: 7
  - type: MobState
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 60
        mask:
          - MobMask
        layer:
          - MobLayer
  - type: Damageable
    damageModifierSet: StrongMetallic # Massive daamge reduction, but very low health.
  - type: NoSlip
  - type: Pullable
  - type: Speech
    speechVerb: Ghost
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 20
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              path: /Audio/_GoobStation/Wraith/ghostrespawn.ogg
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound

