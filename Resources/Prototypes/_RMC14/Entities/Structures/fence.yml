# Ported from RMC-14 (https://github.com/RMC-14/RMC-14, MIT), Resources/Prototypes/_RMC14/Entities/Structures/fence.yml.
# Decorative only: RMC-specific components (xeno charge/acid, vehicle smashing, minimap, mesons,
# dropship blocking, construction graphs) were stripped. Sprites are CMSS13/RMC art, credited in each meta.json.

- type: entity
  parent: BaseFenceMetal
  id: CMFence
  name: fence
  description: A large metal mesh strewn between two poles. Intended as a cheap way to separate areas, while allowing one to see through it.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/fences.rsi
    state: fence0
  - type: InteractionOutline
  - type: Clickable
  - type: IconSmooth
    key: fences
    states:
    - !type:DirectionSpriteSmoothing
      mask: [ fences ]
      base: fence
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Items/wirecutter.ogg
      # RMC swaps to the broken node of its construction graph; here the broken fence is spawned instead.
      - !type:SpawnEntitiesBehavior
        spawn:
          RMCFenceBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: CMBaseStructureCorrodible
  id: RMCFenceBroken
  name: broken fence
  description: A mess of broken wire strewn between two poles, it's not blocking anyone's way through.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/fences.rsi
    state: brokenfence0
  - type: Clickable
  - type: InteractionOutline
  - type: PlacementReplacement
    key: walls
  - type: IconSmooth
    key: fences
    states:
    - !type:DirectionSpriteSmoothing
      mask: [ fences ]
      base: brokenfence
  - type: Physics
    canCollide: false
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Tag
    tags: []

